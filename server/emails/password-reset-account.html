                  <!-- ONE OF THESE PER ACCOUNT ON THE ADDRESS (server/mailer.js
                       renders it n times and joins). The username is here because
                       the reset form is reached by email now, so with more than
                       one character the button alone doesn't say what it opens.
                       It arrives HTML-escaped; see sendPasswordResetEmail. -->
                  <tr>
                    <td style="padding:18px 22px 0 22px;font-family:'Courier New',Consolas,monospace;font-size:10px;letter-spacing:2px;color:#5a684b;text-transform:uppercase;">
                      Account &nbsp;<span style="color:#d3c6aa;letter-spacing:1px;text-transform:none;">{{username}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:8px 22px 0 22px;">
                      <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr>
                          <td style="background:#3e4838;border:1px solid #a7c080;border-radius:9px;">
                            <a href="{{resetUrl}}" style="display:inline-block;padding:13px 30px;font-family:'Courier New',Consolas,monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#a7c080;text-decoration:none;">
                              Reset&nbsp;&nbsp;&#9656;
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:8px 22px 0 22px;font-family:'Courier New',Consolas,monospace;font-size:11px;line-height:1.7;color:#768861;word-break:break-all;">
                      <a href="{{resetUrl}}" style="color:#a7c080;">{{resetUrl}}</a>
                    </td>
                  </tr>
