<title>Architect MUD — Combat Balance</title>
<style>
:root{
  --bg:#f4f5f3; --panel:#ffffff; --panel2:#eceeea; --line:#d8dcd5; --ink:#1d2420; --ink2:#5c6660;
  --accent:#2e8574; --good:#4f7f54; --good-bg:#e5efe4; --warn:#9a7020; --warn-bg:#f5ecdb; --crit:#b4483e; --crit-bg:#f6e5e3;
  --mono:ui-monospace,Consolas,"Cascadia Code",Menlo,monospace;
  --sans:system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161b; --panel:#191f26; --panel2:#20262e; --line:#2b333c; --ink:#dde3de; --ink2:#8b968f;
  --accent:#4fb8a5; --good:#7fb885; --good-bg:#1e2a1f; --warn:#d9a441; --warn-bg:#302818; --crit:#e0776c; --crit-bg:#33211f;
}}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#191f26; --panel2:#20262e; --line:#2b333c; --ink:#dde3de; --ink2:#8b968f;
  --accent:#4fb8a5; --good:#7fb885; --good-bg:#1e2a1f; --warn:#d9a441; --warn-bg:#302818; --crit:#e0776c; --crit-bg:#33211f;
}
:root[data-theme="light"]{
  --bg:#f4f5f3; --panel:#ffffff; --panel2:#eceeea; --line:#d8dcd5; --ink:#1d2420; --ink2:#5c6660;
  --accent:#2e8574; --good:#4f7f54; --good-bg:#e5efe4; --warn:#9a7020; --warn-bg:#f5ecdb; --crit:#b4483e; --crit-bg:#f6e5e3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;align-items:baseline;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0}
header h1 span{color:var(--accent);font-family:var(--mono)}
.meta{color:var(--ink2);font-size:12px}
.regen{margin-left:auto;color:var(--ink2);font-size:11.5px}
.regen code{font:11px var(--mono);background:var(--panel2);padding:1px 6px;border-radius:3px;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:20px 24px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
td.e{font-family:var(--mono);font-size:12px}
td.e .z{color:var(--ink2);font-size:11px;font-family:var(--sans)}
.cell{border-radius:4px;padding:4px 8px;display:inline-block;min-width:110px}
.cell b{font-size:13px}
.cell .d{color:var(--ink2);font-size:11px}
.g{background:var(--good-bg)} .g b{color:var(--good)}
.w{background:var(--warn-bg)} .w b{color:var(--warn)}
.c{background:var(--crit-bg)} .c b{color:var(--crit)}
.note{color:var(--ink2);font-size:12.5px;max-width:80ch;margin:14px 0}
h2{font-size:14px;margin:22px 0 10px}
.flag{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;padding:8px 12px;margin-bottom:8px;font-size:12.5px}
.flag code{font:12px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:3px}
</style>
<header>
  <h1><span>architect-mud</span> combat balance</h1>
  <div class="meta" id="meta"></div>
  <div class="regen">regenerate: <code>npm run combat-sim</code> (options: <code>--fights N --enemy id</code>)</div>
</header>
<main id="main"></main>
<script>
const D = /*__DATA__*/;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('meta').innerHTML =
  `generated <b>${esc(D.generatedAt.replace('T',' ').slice(0,16))}</b> · ${D.results.length} enemies · ${D.fights} fights per pairing`;

const cellCls = c => c.winRate >= 0.8 ? 'g' : c.winRate >= 0.35 ? 'w' : 'c';
const cellHtml = c => {
  if (!c) return '—';
  const win = Math.round(c.winRate * 100);
  const parts = [`<b>${win}% win</b>`];
  if (c.avgTtk) parts.push(`<span class="d">ttk ${c.avgTtk.toFixed(0)}s · ${Math.round(c.avgHpLeft)} hp left</span>`);
  if (c.deathRate) parts.push(`<span class="d">${Math.round(c.deathRate * 100)}% deaths</span>`);
  if (c.timeouts) parts.push(`<span class="d">${c.timeouts} stalemates</span>`);
  return `<span class="cell ${cellCls(c)}">${parts.join('<br>')}</span>`;
};

let h = `<div class="tblwrap"><table><tr><th>enemy</th>${D.archetypes.map(a => `<th>${esc(a.label)}</th>`).join('')}</tr>`;
for (const r of D.results) {
  h += `<tr><td class="e"><b>${esc(r.name)}</b><br>${esc(r.enemy)}<br><span class="z">hp ${r.hp} · hit ${r.hit} · dodge ${r.dodge}${r.zones.length ? '<br>' + esc(r.zones.slice(0, 3).join(', ')) + (r.zones.length > 3 ? '…' : '') : '<br><i>no spawns</i>'}</span></td>` +
    D.archetypes.map(a => `<td>${cellHtml(r.cells[a.key])}</td>`).join('') + `</tr>`;
}
h += `</table></div>`;

// automatic balance flags
const flags = [];
for (const r of D.results) {
  const cs = D.archetypes.map(a => r.cells[a.key]).filter(Boolean);
  if (cs.every(c => c.winRate === 0)) flags.push(`<code>${esc(r.enemy)}</code> is unbeatable by every archetype — is that intended?`);
  else if (cs.every(c => c.winRate === 1 && (c.avgTtk ?? 99) < 15)) flags.push(`<code>${esc(r.enemy)}</code> dies in under 15s to everyone, including a fresh spawn — trivial.`);
  if (cs.some(c => c.timeouts === D.fights)) flags.push(`<code>${esc(r.enemy)}</code> stalemates (neither side can land a kill) for at least one archetype.`);
  const fresh = r.cells.fresh;
  if (fresh && fresh.deathRate >= 0.9 && r.zones.length) flags.push(`<code>${esc(r.enemy)}</code> kills a fresh spawn ${Math.round(fresh.deathRate * 100)}% of the time and spawns in ${esc(r.zones[0])} — early-game wall?`);
}
if (flags.length) h += `<h2>Balance flags</h2>` + flags.map(f => `<div class="flag">${f}</div>`).join('');

h += `<div class="note">Method: real engine math (playerAttackEnemy / enemyAttackPlayer) on a virtual clock stepped 1s per tick, mirroring the live gameLoop. Fidelity limits: archetype skill = stat bonus only (no player_skills rows), no status effects, drugs, darkness, or fleeing. Archetype builds are defined at the top of <b>tools/combat-sim/sim.mjs</b> — tune them there.</div>`;
document.getElementById('main').innerHTML = h;
</script>
