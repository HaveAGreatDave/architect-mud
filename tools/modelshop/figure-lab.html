<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure Lab</title>
<!--
  Everybody drawn as a person, in either of the game's two figure renderers:

    Room    the close-up figure (client/game/js/panels/figure.js) in the Room Stage's own renderer
            (gl/room.js, gl/figure-hd.js): the Room Stage, the TV and Broadcast Studio sequences.
            The script at the bottom of this page.
    Street  the street's baked crowd body (actor3d.js, gl/actors.js) with the street heads L0 to
            L2, dressed by district: what a player sees out on the map. crowd-lab.js, loaded the
            first time Street is picked.

  The top rows are the choices that change what you're looking at (the renderer, then the figure
  and who for Room, the shot for Street); the panel down the left holds the rest. The URL carries
  the top rows (?renderer=street&shot=gala, ?fig=both&npc=npc_john_akerson), so a link opens on
  the same view. /actor-lab.html redirects here with ?renderer=street.
-->
<style>
  :root { --bg: #0b0d14; --panel: #10131c; --fg: #d8d4c8; --dim: #8a8678; --line: #23263a; --on: #e8c070; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  a { color: inherit; }
  header { border-bottom: 1px solid var(--line); padding: 6px 12px; display: flex; flex-direction: column; gap: 6px; }
  header .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  header b { color: var(--on); letter-spacing: 0.2em; }
  .spacer { flex: 1; }
  .k { color: var(--dim); }
  .note { color: var(--dim); font-size: 12px; }
  /* a row of radio buttons drawn as one segmented control */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg label { cursor: pointer; position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 3px 10px; color: var(--dim); border-left: 1px solid var(--line); }
  .seg label:first-child span { border-left: 0; }
  .seg input:checked + span { background: var(--on); color: #14120f; }
  .seg input:focus-visible + span { outline: 1px solid var(--on); outline-offset: -2px; }
  .seg.big span { padding: 4px 14px; }
  main { flex: 1; min-height: 0; display: flex; }
  aside { width: 250px; flex: none; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 10px 10px; box-sizing: border-box; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 6px 0 0; padding: 4px 0 0; }
  legend { color: var(--on); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; padding: 0 4px 0 0; }
  aside label { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--dim); padding: 2px 0; white-space: nowrap; }
  aside label.tick { justify-content: flex-start; }
  aside select, aside input[type=number], aside input[type=text], aside input:not([type]) { max-width: 140px; }
  aside input[type=range] { width: 90px; }
  label input, label select { vertical-align: middle; }
  #stage { flex: 1; min-width: 0; position: relative; }
  #view, #views { position: absolute; inset: 0; }
  #view canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #stats { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--dim); text-shadow: 0 0 4px #000; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .view { position: relative; min-height: 0; }
  .view canvas { width: 100%; height: 100%; display: block; }
  .view span { position: absolute; left: 12px; top: 10px; font-size: 12px; letter-spacing: 0.25em; text-shadow: 0 0 4px #000; }
  #st-w span { color: #8fb4ff; }
  #st-e span { color: #f0a848; }
  #street-msg { position: absolute; left: 12px; bottom: 10px; color: var(--dim); }
  /* only the chosen renderer's rows, panel and view */
  body[data-renderer="room"] [data-for="street"], body[data-renderer="street"] [data-for="room"] { display: none !important; }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    aside { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #stage { min-height: 56vh; }
    #views { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-renderer="room">
<header>
  <div class="row">
    <a href="/" style="opacity:.7">← Modelshop</a>
    <b>FIGURE LAB</b>
    <span class="seg big" role="radiogroup" aria-label="renderer">
      <label title="The close-up figure in the Room Stage's renderer: rooms, the TV, Broadcast Studio sequences"><input type="radio" name="renderer" value="room" checked><span>Room · close-up</span></label>
      <label title="The street's baked crowd body and street heads, dressed by district"><input type="radio" name="renderer" value="street"><span>Street · crowd</span></label>
    </span>
    <span class="spacer"></span>
    <a href="/pose-lab.html" title="Deadball's clips keyed on the real rig and played in the 3-D park">Pose Lab →</a>
  </div>
  <div class="row" data-for="room">
    <span class="k">figure</span>
    <span class="seg" role="radiogroup" aria-label="figure">
      <label title="The revised figure (docs/proposals/sculpted-figure.md): on for the TV and Broadcast Studio sequences"><input type="radio" name="fig" value="sculpt" checked><span>sculpted</span></label>
      <label title="The figure the Room Stage draws today"><input type="radio" name="fig" value="current"><span>current</span></label>
      <label title="One person twice under the same light: current on the left, sculpted on the right"><input type="radio" name="fig" value="both"><span>before / after</span></label>
    </span>
    <span class="k">who</span>
    <select id="npc" title="Lab people roll off a seed; an NPC with a settled look (flags.figure) is drawn as their content file has them"><option value="">lab people</option></select>
    <label class="k">id <input id="who" placeholder="any npc_… id, Enter" style="width:13em"></label>

  </div>
  <div class="row" data-for="street">
    <span class="k">shot</span>
    <span class="seg" role="radiogroup" aria-label="shot">
      <label title="Seven people on each side's street"><input type="radio" name="st-shot" value="street" checked><span>street</span></label>
      <label title="Four people lined up at head height"><input type="radio" name="st-shot" value="portraits"><span>portraits</span></label>

      <label title="One head close up, at the head level chosen on the left"><input type="radio" name="st-shot" value="head"><span>head</span></label>
      <label title="Materials A/B: evening dress lit as metal, satin and leather on the left, as cloth on the right"><input type="radio" name="st-shot" value="gala"><span>gala</span></label>
      <label title="A walk from the side, to see a planted foot stay planted"><input type="radio" name="st-shot" value="gait"><span>gait</span></label>
    </span>
    <label class="k" title="The look that ships, with none of this page's proposals on it"><input type="checkbox" id="st-built"> as built</label>
  </div>
</header>
<main>
  <aside data-for="room">
    <fieldset><legend>Body</legend>
      <label>sex <select id="sex"><option value="">by person</option><option>female</option><option>male</option></select></label>
      <label>build <select id="build"><option value="">by person</option><option>average</option><option>older</option><option>hunched</option><option>woman</option></select></label>
      <label title="ectomorph, mesomorph, endomorph"><span><input type="checkbox" id="useW"> weight</span> <input type="range" id="weight" min="0" max="1" step="0.1" value="0.5"></label>
      <label><span><input type="checkbox" id="useB"> bust</span> <input type="range" id="bust" min="0" max="1" step="0.1" value="0.5"></label>
      <label><span><input type="checkbox" id="useT"> butt</span> <input type="range" id="butt" min="0" max="1" step="0.1" value="0.5"></label>
      <label>changes <select id="muts"><option value="">by person</option><option value="all">all of them</option><option value="none">none</option></select></label>
    </fieldset>
    <fieldset><legend>Head</legend>
      <label>hair <select id="hair"><option value="">by person</option><option value="0">cropped</option><option value="1">neat</option><option value="2">tousled</option><option value="3">long</option><option value="4">quiff</option></select></label>
      <label>facial hair <select id="facial"><option value="">by person</option><option>clean</option><option>stubble</option><option>shadow</option><option>moustache</option><option>goatee</option><option>vandyke</option><option>soulpatch</option><option>chinstrap</option><option>sideburns</option><option>trimmed</option><option>full</option><option>long</option></select></label>
      <label title="How hard a life shows: scars, grime and stubble on the face, grime, scuffs and chips on the clothes">grit <select id="grit"><option value="">by person</option><option value="0">clean</option><option value="0.5">worn</option><option value="1">hardened</option></select></label>
      <label>mood <select id="mood"><option value="">none</option></select></label>

      <label>say <input id="say" placeholder="a line, then Enter" style="width:12em"></label>
      <label>mouth <select id="shape"><option value="">by what they say</option></select></label>
    </fieldset>
    <fieldset><legend>Clothes</legend>
      <label>dress <select id="dress"><option value="">the city's</option><option value="wildblood">Wildblood</option></select></label>
      <label>cut <select id="cut"><option value="">by person</option><option value="each">one of each</option></select></label>
      <label>wear <select id="wear"><option value="all">dressed</option><option value="body">body only</option><option value="legs">trousers and shoes</option></select></label>
      <label>bottoms <select id="bottoms"><option value="">by person</option><option value="none">trousers</option></select></label>
      <label>hat <select id="hat"><option value="">by person</option><option value="none">none</option></select></label>
      <label>scarf <select id="scarf"><option value="">by person</option><option value="none">none</option></select></label>
      <label>gear <select id="gear"><option value="">by person</option><option value="none">none</option><option value="all">all</option></select></label>
    </fieldset>
    <fieldset><legend>Doing</legend>
      <label>pose <select id="pose"><option>stand</option><option>sit</option><option value="lie">lie</option></select></label>

      <label>doing <select id="doing"><option value="">idling</option></select></label>

    <fieldset><legend>View</legend>

      <label>people <input type="number" id="n" value="4" min="1" max="8" style="width:4em"></label>
      <label>seed <input type="number" id="seed" value="7" style="width:5em"></label>

      <label class="tick"><input type="checkbox" id="comic"> comic look</label>
      <label class="tick" title="as a player in the mature layer sees them (docs/systems-mis.md)"><input type="checkbox" id="mature" onchange="globalThis.__figureMature = this.checked"> mature</label>
      <label class="tick"><input type="checkbox" id="lamp" checked> lamp</label>

    </fieldset>
  </aside>
  <aside data-for="street">
    <fieldset><legend>Look</legend>
      <label>faces <select id="st-facesrc"><option value="atlas">atlas</option><option value="painted">painted</option></select></label>
      <label>head <select id="st-lod"><option value="0">L0</option><option value="1">L1</option><option value="2">L2</option></select></label>

    </fieldset>

    <fieldset><legend>Motion</legend>
      <label>clip <select id="st-clip"><option>mixed</option><option>walk</option><option>idle</option><option>talk</option><option>listen</option><option>wait</option><option>phone</option><option>smoke</option></select></label>
      <label class="tick"><input type="checkbox" id="st-spin"> turntable</label>
    </fieldset>
    <fieldset><legend>View</legend>
      <label>zoom <input type="range" id="st-zoom" min="2" max="9" step="0.1" value="5.4"></label>
      <label>seed <input type="number" id="st-seed" value="7" style="width:5em"></label>
    </fieldset>
  </aside>
  <section id="stage">
    <div id="view" data-for="room"><canvas id="c"></canvas><div id="stats"></div></div>
    <div id="views" data-for="street">
      <div class="view" id="st-w"><canvas id="st-a"></canvas><span>WEST · ASCENDANT QUARTER</span></div>
      <div class="view" id="st-e"><canvas id="st-b"></canvas><span>EAST · LONG WATCH GROUND</span></div>
      <div id="street-msg"></div>
    </div>
  </section>
</main>

<script type="module">
// The page's shell: which renderer is showing, and the URL that says so. The street's module is
// loaded the first time it's picked (it bakes the crowd and opens two WebGL contexts). Each
// renderer's animation loop draws nothing while the other is showing.
const q = new URLSearchParams(location.search);
// the query as the page opened, before writeUrl rewrites it (the camera below reads it)
globalThis.__labQ = location.search;
const radio = (name, v) => { const r = document.querySelector(`input[name="${name}"][value="${v}"]`); if (r) r.checked = true; };
let streetLoaded = null;
function setRenderer(r) {
  document.body.dataset.renderer = r;
  radio('renderer', r);
  if (r === 'street' && !streetLoaded) {
    const msg = document.getElementById('street-msg');
    msg.textContent = 'baking the street…';
    streetLoaded = import('/crowd-lab.js').then(() => { msg.textContent = ''; }, (e) => { msg.textContent = 'the street lab failed to load: ' + e.message; console.error(e); });
  }
}
// The top rows, written back to the URL as they change.
function writeUrl() {
  const u = new URLSearchParams();
  const v = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value;
  if (v('renderer') === 'street') { u.set('renderer', 'street'); if (v('st-shot') !== 'street') u.set('shot', v('st-shot')); }
  else {
    if (v('fig') !== 'sculpt') u.set('fig', v('fig'));
    const who = document.getElementById('who').value.trim();
    if (who) u.set('npc', who);
  }
  history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
}
globalThis.__labWriteUrl = writeUrl;
if (q.get('shot')) radio('st-shot', q.get('shot'));
if (q.get('fig')) radio('fig', q.get('fig'));
if (q.get('npc') || q.get('id')) document.getElementById('who').value = q.get('npc') || q.get('id');
for (const r of document.querySelectorAll('input[name="renderer"]')) r.addEventListener('change', () => { setRenderer(r.value); writeUrl(); });
for (const r of document.querySelectorAll('input[name="st-shot"], input[name="fig"]')) r.addEventListener('change', writeUrl);
setRenderer(q.get('renderer') === 'street' ? 'street' : 'room');
</script>
<script type="module">
// The Room renderer: the close-up figure (client/game/js/panels/figure.js), drawn by the Room
// Stage's own renderer (gl/room.js) in an empty room: the same light, the same ink and the same
// skinning a flat's visitors get, so what this shows is what ships. "crowd body beside" stands the
// street's bake (actor3d.js, which is the same clothes sampled coarsely) next to each person, to
// judge that the two read as one figure. Drag to orbit, wheel to zoom.
//
// "who" draws an NPC as their content file has them: their sex and settled figure (flags.figure)
// through the Modelshop's /api/npc-figure. The list is every NPC with a settled look
// (/api/npc-figures); the id box takes anyone, settled or not.
import { createRoomRenderer } from '/client/game/js/panels/gl/room.js';
import { figurePeople, peopleBatch, preparePeople } from '/client/game/js/panels/gl/room-people.js';
import { heldProps } from '/client/game/js/panels/gl/room-held.js';
import { createBatch, vtx, MAT } from '/client/game/js/panels/gl/ballpark-mesh.js';
import { MOUTHS, mouthTrack, textTrack, mouthAt } from '/client/shared/lip-sync.js';
import { ACTOR_CLIPS, ACTOR_ROOM_CLIPS } from '/client/game/js/panels/actor3d.js';
import { MOODS } from '/client/shared/expressions.js';
import { FIGURE_CUT_NAMES, FIGURE_BOTTOMS, FIGURE_HATS, FIGURE_SCARVES } from '/client/game/js/panels/figure.js';
for (const [id, T] of [['bottoms', FIGURE_BOTTOMS], ['hat', FIGURE_HATS], ['scarf', FIGURE_SCARVES]]) for (const n of Object.keys(T)) document.getElementById(id).add(new Option(n));
// every cut by name, in the wardrobe's order
for (const n of FIGURE_CUT_NAMES) { const o = document.createElement('option'); o.textContent = n; document.getElementById('cut').append(o); }

const $ = (id) => document.getElementById(id);
const figMode = () => document.querySelector('input[name="fig"]:checked')?.value || 'sculpt';

// Who: lab people, or an NPC. Picking from the list or entering an id reads their file at once.
let settled = {};
const npcSel = $('npc');
const syncNpc = () => { const id = $('who').value.trim(); npcSel.value = [...npcSel.options].some((o) => o.value === id) ? id : ''; };
async function readSettled() {
  const id = $('who').value.trim();
  syncNpc();
  globalThis.__labWriteUrl?.();
  if (!id) { settled = {}; $('whoNote').textContent = ''; return; }
  const r = await fetch('/api/npc-figure?id=' + encodeURIComponent(id)).catch(() => null);
  const body = r?.ok ? await r.json() : null;
  if (id !== $('who').value.trim()) return;
  settled = body || {};
  $('whoNote').textContent = !body ? 'no such NPC: rolled off the id' : body.figure ? 'settled look' : 'no settled look: rolled off the id';
}
npcSel.addEventListener('change', () => { $('who').value = npcSel.value; readSettled(); });
$('who').addEventListener('change', readSettled);
fetch('/api/npc-figures').then((r) => (r.ok ? r.json() : [])).then((list) => {
  for (const n of list) npcSel.add(new Option(n.name || n.id, n.id));
  syncNpc();
}).catch(() => {});
if ($('who').value.trim()) readSettled();

const canvas = $('c');
const R = createRoomRenderer(canvas, {});
if (!R) { $('stats').textContent = 'no WebGL2 here'; throw new Error('no WebGL2'); }

// the room: a floor and a back wall, nothing else
const L = { world: (u, v, y) => [u, y, v], r: [1, 0, 0], f: [0, 0, 1] };
function quad(b, a, bb, c, d, n, col) { for (const p of [a, bb, c, a, c, d]) vtx(b, p, n, [0, 0], col, MAT.MATTE); }
const solid = createBatch(64);
quad(solid, [-6, 0, -3], [6, 0, -3], [6, 0, 6], [-6, 0, 6], [0, 1, 0], [0.16, 0.15, 0.14]);
quad(solid, [-6, 0, -3], [-6, 3, -3], [6, 3, -3], [6, 0, -3], [0, 0, 1], [0.24, 0.23, 0.22]);
R.setRoom({ solid, screen: createBatch(1), glass: createBatch(1), view: createBatch(1), textured: new Map() }, () => null);

const cam = { yaw: Math.PI, pitch: -0.08, dist: 3.4, fov: 40, at: [0, 1.05, 0] };
// ?set=id:value,... sets any control on the left as the page opens (a box takes 1 or 0)
{ const st = new URLSearchParams(globalThis.__labQ || location.search).get('set'); for (const kv of (st || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'), el = document.getElementById(k); if (!el) continue; if (el.type === 'checkbox') el.checked = v === '1'; else el.value = v; } }
{ const g = new URLSearchParams(globalThis.__labQ || location.search).get('grit'); if (g !== null) document.getElementById('grit').value = g; }
{ const qc = (new URLSearchParams(globalThis.__labQ || location.search).get('cam') || '').split(',').map(Number); if (qc.length === 4 && qc.every(Number.isFinite)) { cam.yaw = qc[0]; cam.pitch = qc[1]; cam.dist = qc[2]; cam.at = [0, qc[3], 0]; } }
let spin = 0, drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw = drag.yaw - (e.clientX - drag.x) * 0.008; cam.pitch = Math.max(-1.2, Math.min(1.2, drag.pitch - (e.clientY - drag.y) * 0.006)); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(0.5, Math.min(9, cam.dist * (e.deltaY > 0 ? 1.08 : 1 / 1.08))); }, { passive: false });

// a line to mouth, voiced if the audio engine's here, and any shape held to look at
let line = null;
for (const k of Object.keys(MOUTHS)) $('shape').add(new Option(k));
// every clip a person in a room can play, to look at one by one; a clip that plays once starts again every few seconds
for (const c of [...ACTOR_CLIPS, ...ACTOR_ROOM_CLIPS]) $('doing').add(new Option(c.name));
// a mood for everybody, as the server sends one (docs/systems-expressions.md)
for (const m of MOODS) if (m !== 'neutral') $('mood').add(new Option(m));
const moodNow = () => ($('mood').value ? { mood: { m: $('mood').value, i: +$('moodI').value } } : {});
const onceOf = (name) => ACTOR_ROOM_CLIPS.find((c) => c.name === name && c.once)?.dur || 0;
$('say').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const trace = [], text = $('say').value, res = window.AudioEngine?.speak?.(text, { channel: 'npc', seed: $('who').value || 'lab', trace });
  line = { track: res && trace.length ? mouthTrack(trace) : textTrack(text), t0: performance.now() + (res?.delay || 0) * 1000 };
});
const mouthNow = () => ($('shape').value ? MOUTHS[$('shape').value] : line ? mouthAt(line.track, (performance.now() - line.t0) / 1000) || undefined : undefined);
const WEAR = { all: null, body: { top: false, legs: false, shoes: false }, legs: { top: false } };
function bodies() {
  const n = Math.max(1, Math.min(8, +$('n').value || 1)), seed = +$('seed').value || 0, out = [], who = $('who').value.trim(), mode = figMode();
  // one person, the current figure and the sculpted one side by side under the same light
  if (mode === 'both') return [false, true].map((sculpt, i) => ({ id: who || `lab-${seed}-0`, at: [(i - 0.5) * 1.0, 0], yaw: 0, pose: $('pose').value, dress: $('dress').value, sculpt, ...(who ? settled : {}) }));
  // lying, a row of them on the floor, heads to the right
  const lie = $('pose').value === 'lie', doing = $('doing').value, once = onceOf(doing), m = who ? 1 : n;
