// ── the room ─────────────────────────────────────────────────────────────────────────────────────
const L = { world: (u, v, y) => [u, y, v], r: [1, 0, 0], f: [0, 0, 1] };
function quad(b, a, bb, c, d, n, col, m = MAT.MATTE) { for (const p of [a, bb, c, a, c, d]) vtx(b, p, n, [0, 0], col, m); }
function floorBatch() {
  const s = createBatch(256);
  // dirt circle and chalk box
  const seg = 48; for (let j = 0; j < seg; j++) { const a0 = (j / seg) * Math.PI * 2, a1 = ((j + 1) / seg) * Math.PI * 2; for (const p of [[0, 0.002, 0], [Math.cos(a1) * 1.5, 0.002, Math.sin(a1) * 1.5], [Math.cos(a0) * 1.5, 0.002, Math.sin(a0) * 1.5]]) vtx(s, p, [0, 1, 0], [0, 0], [0.42, 0.27, 0.16], MAT.GROUND); }
  quad(s, [-8, 0, -4], [8, 0, -4], [8, 0, 8], [-8, 0, 8], [0, 1, 0], [0.12, 0.2, 0.1], MAT.GROUND);
  quad(s, [-8, 0, -4], [-8, 4, -4], [8, 4, -4], [8, 0, -4], [0, 0, 1], [0.16, 0.15, 0.14]);
  for (const x of [-0.7, 0.7]) quad(s, [x - 0.025, 0.004, -0.7], [x + 0.025, 0.004, -0.7], [x + 0.025, 0.004, 0.7], [x - 0.025, 0.004, 0.7], [0, 1, 0], [0.95, 0.93, 0.88]);
  return s;
}
const FLOOR = floorBatch();
function solidWith(gear, rows) {
  const s = createBatch(FLOOR.n + 4096);
  s.data.set(FLOOR.data.subarray(0, FLOOR.data.length)); s.n = FLOOR.n;
  for (const [bone, tris, col, m] of gear) {
    const b = BONE[bone]; if (b === undefined) continue; const o = b * 12;
    const X = (p) => [0, 1, 2].map((r) => rows[o + r * 4] * p[0] + rows[o + r * 4 + 1] * p[1] + rows[o + r * 4 + 2] * p[2] + rows[o + r * 4 + 3]);
    const N = (n) => norm([0, 1, 2].map((r) => rows[o + r * 4] * n[0] + rows[o + r * 4 + 1] * n[1] + rows[o + r * 4 + 2] * n[2]));
    for (const [p, n] of tris) vtx(s, X(p), N(n), [0, 0], col, m);
  }
  return s;
}

// ── UI ───────────────────────────────────────────────────────────────────────────────────────────
for (const c of [...ACTOR_CLIPS, ...ACTOR_ROOM_CLIPS]) if (c.name !== 'walk') $('clip').add(new Option(c.name));

for (const m of MOODS) $('mood').add(new Option(m)); $('mood').value = 'angry';
let cur = +(new URLSearchParams(location.search).get('p') || 0);
const DESC = {};
function list() {
  $('list').innerHTML = P.map((p, i) => `<button data-i="${i}" class="${i === cur ? 'on' : ''}"><span class="sw" style="background:${ORD[p[2]][1]}"></span>${p[0]}</button>`).join('');
  $('list').querySelectorAll('button').forEach((b) => (b.onclick = () => { cur = +b.dataset.i; list(); card(); }));
}
function card() { const p = P[cur], t = teamOf(cur); $('card').innerHTML = `<h2>${p[0]}</h2><div>"${p[1]}" · ${ORD[p[2]][0]} · ${p[3]}</div><div>${t ? 'Drafted by the ' + t : 'Not drafted this season'}</div>`; }
$('season').addEventListener('change', () => card());

const cam = { yaw: Math.PI * 0.82, pitch: -0.04, dist: 4.4, fov: 34, at: [0, 1.08, 0] };
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw = drag.yaw - (e.clientX - drag.x) * 0.008; cam.pitch = Math.max(-1.2, Math.min(1.2, drag.pitch - (e.clientY - drag.y) * 0.006)); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(0.6, Math.min(9, cam.dist * (e.deltaY > 0 ? 1.08 : 1 / 1.08))); }, { passive: false });

function bodyOf(i) {
  const p = P[i], c = C[i], k = kitOf(i);
  const fig = { cut: 'shortsleeve', top: k.top, legs: k.legs, shoes: k.shoes, skin: c.skin, hair: c.hair || [40, 28, 20], build: c.b, ...(c.w != null ? { weight: c.w } : {}), ...(c.b === 'woman' ? { head: 3 } : {}) };

}
let last = 0;
function draw(now) {
  globalThis.__houseComic = $('comic').checked;
  const t = now / 1000, dt = Math.min(0.1, t - last); last = t;

    const key = { ...r.key, cut: 'shortsleeve', gear: { belt: true }, body: c.body || null };
    let rows = r.rows;
    if (c.lift) { rows = rows.slice(); for (let b = 0; b < rows.length; b += 12) rows[b + 7] += c.lift; }
    const col = r.col.slice(); col.set(rgb(...kitOf(cur).legs), FIG_SLOT.legs * 3);
    return { ...r, key, rows, col, mut: c.paint || 0 };
  });
  R.setFigures(recs);
  R.setRoom({ solid: solidWith(gearOf(cur, t), recs[0].rows), screen: createBatch(1), glass: createBatch(1), view: createBatch(1), textured: new Map() }, () => null);
