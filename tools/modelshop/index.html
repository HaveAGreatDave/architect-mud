<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modelshop — GLASS building models</title>
<link rel="stylesheet" href="/shared/themes.css">
<style>
  :root { color-scheme: dark; --ms-bg: #0d0f12; --ms-panel: #14181d; --ms-line: #262c34; --ms-ink: #d6dde6; --ms-dim: #8b97a5; --ms-accent: #6fd3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ms-bg); color: var(--ms-ink); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #wrap { display: grid; grid-template-columns: 260px 1fr 300px; height: 100vh; }
  .col { overflow: auto; border-right: 1px solid var(--ms-line); }
  .col:last-child { border-right: 0; border-left: 1px solid var(--ms-line); }
  h1 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--ms-line); letter-spacing: .08em; color: var(--ms-accent); }
  h1 small { color: var(--ms-dim); letter-spacing: 0; font-weight: normal; }
  #search { width: 100%; padding: 7px 12px; background: var(--ms-panel); border: 0; border-bottom: 1px solid var(--ms-line); color: var(--ms-ink); font: inherit; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { padding: 5px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.03); }
  #list li:hover { background: var(--ms-panel); }
  #list li.on { background: #1d2732; color: var(--ms-accent); }
  #list li .k { color: var(--ms-dim); font-size: 11px; }
  #stage { display: flex; flex-direction: column; min-width: 0; }
  #view { flex: 1; min-height: 0; background: #000; display: block; width: 100%; }
  #bar { padding: 8px 12px; border-top: 1px solid var(--ms-line); background: var(--ms-panel); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { color: var(--ms-dim); display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { width: 120px; }
  button { background: #1b2129; color: var(--ms-ink); border: 1px solid var(--ms-line); padding: 4px 10px; font: inherit; cursor: pointer; border-radius: 3px; }
  button.on { border-color: var(--ms-accent); color: var(--ms-accent); }
  section { padding: 10px 12px; border-bottom: 1px solid var(--ms-line); }
  section h2 { font-size: 11px; margin: 0 0 8px; color: var(--ms-dim); letter-spacing: .1em; text-transform: uppercase; }
  #scales { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #scales figure { margin: 0; }
  #scales canvas { width: 100%; background: #000; display: block; border: 1px solid var(--ms-line); }
  #scales figcaption { color: var(--ms-dim); font-size: 10px; padding-top: 2px; }
  select { width: 100%; background: #1b2129; color: var(--ms-ink); border: 1px solid var(--ms-line); font: inherit; padding: 3px; margin-bottom: 6px; }
  #diffimgs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  #diffimgs figure { margin: 0; }
  #diffimgs canvas { width: 100%; background: #000; display: block; border: 1px solid var(--ms-line); }
  #diffimgs figcaption { color: var(--ms-dim); font-size: 10px; text-align: center; padding-top: 2px; }
  #diffnum { padding-top: 6px; }
  #editor h3 { font-size: 10px; margin: 10px 0 4px; color: var(--ms-dim); letter-spacing: .1em; text-transform: uppercase; }
  .etop { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .part { border: 1px solid var(--ms-line); border-radius: 3px; margin-bottom: 5px; }
  .part.sel { border-color: var(--ms-accent); }
  .phead { display: flex; gap: 3px; align-items: center; padding: 3px 5px; background: #171c22; }
  .phead b { flex: 1; font-weight: normal; color: var(--ms-accent); font-size: 11px; }
  .pbody { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; padding: 5px; }
  .fld { display: flex; gap: 4px; align-items: center; }
  .fld label { flex: 0 0 34px; font-size: 10px; }
  .fld input { flex: 1; min-width: 0; background: #10141a; color: var(--ms-ink); border: 1px solid var(--ms-line); font: inherit; font-size: 11px; padding: 1px 3px; }
  .fld select.tag { flex: 0 0 42px; font-size: 10px; padding: 0; margin: 0; }
  .fld select.tag.warn { color: #ffbe6f; border-color: #ffbe6f; }
  .fld input.warn { color: #ffbe6f; border-color: #ffbe6f; }
  button.mini { padding: 0 5px; font-size: 11px; line-height: 16px; }
  .addrow { display: flex; gap: 4px; margin: 4px 0 10px; }
  .addrow select, .addrow input { flex: 1; margin: 0; min-width: 0; background: #10141a; color: var(--ms-ink); border: 1px solid var(--ms-line); font: inherit; font-size: 11px; }
  .msgs { margin-top: 6px; font-size: 11px; }
  .dim { color: var(--ms-dim); }
  #esave { font-size: 11px; padding-top: 6px; word-break: break-word; }
  #esave.ok { color: #7ee787; }
  #esave.err { color: #ff7b72; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row b { font-weight: normal; color: var(--ms-dim); }
  .warn { color: #ffbe6f; }
  .err { color: #ff7b72; white-space: pre-wrap; }
  ol { margin: 0; padding-left: 20px; }
  ol li { color: var(--ms-dim); }
</style>
</head>
<body>
<div id="wrap">
  <div class="col">
    <h1>MODELSHOP <small id="count"></small></h1>
    <input id="search" placeholder="filter models…" autocomplete="off">
    <ul id="list"></ul>
  </div>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="bar">
      <button id="preset-cockpit" class="on">Cockpit</button>
      <button id="preset-cab">Cab</button>
      <label>orbit <input id="heading" type="range" min="0" max="359" value="0"></label>
      <label>dist <input id="dist" type="range" min="2" max="60" step="0.5" value="9"></label>
      <label>eye <input id="eye" type="range" min="0" max="30" step="0.1" value="1.4"></label>
      <label>fh <input id="fh" type="range" min="0.15" max="1" step="0.01" value="0.4"></label>
      <label>h <input id="h" type="range" min="0.2" max="4" step="0.05" value="1"></label>
      <label>seed <input id="seed" type="range" min="0" max="12" step="1" value="3"></label>
      <label>night <input id="night" type="range" min="0" max="1" step="0.05" value="0"></label>
      <label>facing
        <select id="facing">
          <option value="0,1">N (0,1)</option>
          <option value="0,-1">S (0,-1)</option>
          <option value="1,0">E (1,0)</option>
          <option value="-1,0">W (-1,0)</option>
        </select>
      </label>
      <button id="wire">Cage</button>
      <button id="spin">Spin</button>
    </div>
  </div>

  <div class="col">
    <section>
      <h2>Model</h2>
      <div id="meta"></div>
    </section>
    <section>
      <h2>At other scales</h2>
      <div id="scales"></div>
    </section>
    <section>
      <h2>Cage — what the cold open gets</h2>
      <div id="bake"></div>
    </section>
    <section>
      <h2>Edit</h2>
      <div id="editor"></div>
      <div id="esave"></div>
    </section>
    <section>
      <h2>Difference</h2>
      <select id="cmp"><option value="">— compare with —</option></select>
      <div id="diffimgs"></div>
      <div id="diffnum"></div>
    </section>
    <section>
      <h2>Checks</h2>
      <div id="checks"></div>
    </section>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
