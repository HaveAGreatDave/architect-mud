<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actor Lab</title>
<style>
  :root { --bg: #0b0d14; --fg: #d8d4c8; --dim: #8a8678; --line: #23263a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  header b { color: #e8c070; letter-spacing: 0.2em; }
  label { color: var(--dim); white-space: nowrap; }
  label input, label select { vertical-align: middle; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .view { position: relative; }
  .view canvas { width: 100%; height: 80vh; display: block; }
  .view span { position: absolute; left: 12px; top: 10px; font-size: 12px; letter-spacing: 0.25em; text-shadow: 0 0 4px #000; }
  #w span { color: #8fb4ff; }
  #e span { color: #f0a848; }
  @media (max-width: 800px) { #views { grid-template-columns: 1fr; } .view canvas { height: 46vh; } }
</style>
</head>
<body>
<header>
  <b>ACTOR LAB</b>
  <label>shot <select id="shot"><option>street</option><option>portraits</option><option>faces</option><option>gala</option></select></label>
  <label><input type="checkbox" id="built"> as built</label>
  <label><input type="checkbox" id="mats" checked> materials</label>
  <label>weather <select id="weather"><option>clear</option><option selected>rain</option><option>cold</option></select></label>
  <label><input type="checkbox" id="night" checked> night</label>
  <label><input type="checkbox" id="shadows" checked> contact shadows</label>
  <label>clip <select id="clip"><option>mixed</option><option>walk</option><option>idle</option></select></label>
  <label><input type="checkbox" id="spin"> turntable</label>
  <label>zoom <input type="range" id="zoom" min="2" max="9" step="0.1" value="5.4"></label>
  <label>seed <input type="number" id="seed" value="7" style="width:4em"></label>
</header>
<div id="views">
  <div class="view" id="w"><canvas id="a"></canvas><span>WEST · ASCENDANT QUARTER</span></div>
  <div class="view" id="e"><canvas id="b"></canvas><span>EAST · LONG WATCH GROUND</span></div>
</div>
<script type="module">
// A look at the street figures (client/game/js/panels/actor3d.js), dressed by district. The west
// street is mostly Ascendants with a few Null, the east mostly Long Watch with some Wildblood. Both
// read the real bake, so they draw the mesh the game does. "as built" draws the look that ships;
// "portraits" and "faces" line people up at head height so the faces can be judged. "materials"
// lights each garment as what it's made of (the game's version is envAt in gl/actors.js), and
// "gala" is its A/B: four people in evening dress, lit as metal, satin and leather on the left and
// as cloth on the right.
//
// An order's dress is the street's, never the NPC's: a figure in the west wears the west's colours
// because of where it walks, which says nothing about who it is (see ACTOR_OUTFITS in actor3d.js).
//
// What this page fakes that the real thing would bake:
//   the face       the bake's eyes and brows are lumps; here they are pushed inside the head and the
//                  face is painted on the skin, with its relief as a bump. The real thing is the same
//                  paint in gl/actors.js and smaller features in buildBody.
//   reshaping      nose, lips, hands, ears, hair, hoods and collars are moved in the vertex shader
//                  from the rest shape, rotated with the bone they ride. The real thing is buildBody.
//   the held arm   re-posed in the vertex shader. The real thing is a hold clip, baked.
//   props          caps, horns, headphones, rifles, packs, radios, tablets and umbrellas are small
//                  meshes placed each frame on the frame of the part they ride, where a rigid part
//                  on that bone would sit.
import { actorBake, actorOutfit } from '/client/game/js/panels/actor3d.js';

const bk = actorBake();
const TOP = bk.top;
const IDLE0 = bk.clips.idle.row0;
const rest = bk.preview.subarray(IDLE0 * bk.nv * 3, (IDLE0 + 1) * bk.nv * 3);
const R3 = (v) => [rest[v * 3], rest[v * 3 + 1], rest[v * 3 + 2]];

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mulS = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ── The body's pieces ───────────────────────────────────────────────────────────────────────────────
// Every loft and ellipsoid in buildBody is its own connected piece, so a union-find over the
// triangles recovers them, and their material and place say which is which.
const pieces = (() => {
  const up = new Int32Array(bk.nv).map((_, i) => i);
  const find = (i) => { while (up[i] !== i) i = up[i] = up[up[i]]; return i; };
  for (let t = 0; t < bk.idx.length; t += 3) {
    const a = find(bk.idx[t]);
    up[find(bk.idx[t + 1])] = a;
    up[find(bk.idx[t + 2])] = find(a);
  }
  const groups = new Map();
  for (let v = 0; v < bk.nv; v++) { const r = find(v); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(v); }
  return [...groups.values()].map((vs) => {
    const c = [0, 0, 0], mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const v of vs) for (let i = 0; i < 3; i++) { const x = rest[v * 3 + i]; c[i] += x; mn[i] = Math.min(mn[i], x); mx[i] = Math.max(mx[i], x); }
    return { vs, mat: bk.mat[vs[0]], c: c.map((x) => x / vs.length), mn, mx };
  });
})();
const ofMat = (m) => pieces.filter((p) => p.mat === m);
const biggest = (list) => list.reduce((a, b) => (b.vs.length > a.vs.length ? b : a));
const eyes = ofMat(5);
const MID = (eyes[0].c[0] + eyes[1].c[0]) / 2;
const isL = (p) => p.c[0] > MID;
const eyeL = eyes.find(isL), eyeR = eyes.find((p) => !isL(p));
const hair = biggest(ofMat(4));
const brows = ofMat(4).filter((p) => p !== hair);
const browL = brows.find(isL), browR = brows.find((p) => !isL(p));
const lips = ofMat(6)[0];
const headish = ofMat(0).filter((p) => p.c[1] > eyeL.c[1] - 0.1);
const head = biggest(headish);
const ears = headish.filter((p) => p !== head && Math.abs(p.c[0] - MID) > 0.05);
const earL = ears.find(isL), earR = ears.find((p) => !isL(p));
const nose = headish.find((p) => p !== head && !ears.includes(p));
const neck = ofMat(0).find((p) => p.c[1] < eyeL.c[1] - 0.1 && p.c[1] > 1.2);
const handish = ofMat(0).filter((p) => p.c[1] < 1.2);
const palms = handish.filter((p) => p.mx[1] - p.mn[1] > 0.09), thumbs = handish.filter((p) => !palms.includes(p));
const handL = palms.find(isL), handR = palms.find((p) => !isL(p));
const torso = biggest(ofMat(1));
const sleeves = ofMat(1).filter((p) => p !== torso), sleeveL = sleeves.find(isL), sleeveR = sleeves.find((p) => !isL(p));

// Per-vertex feature ids, shared by both shaders:
//   1/2 eye L/R  3/4 brow L/R  5 nose  6 lips  7 head skin  8 ears  9 hair  10/11 hand L/R (with the
//   thumbs)  12 neck  13/14 sleeve L/R. Left is the figure's own left, +X.
const FEAT = new Float32Array(bk.nv);
const tag = (p, id) => { if (p) for (const v of p.vs) FEAT[v] = id; };
tag(eyeL, 1); tag(eyeR, 2); tag(browL, 3); tag(browR, 4); tag(nose, 5); tag(lips, 6); tag(head, 7);
ears.forEach((e) => tag(e, 8)); tag(hair, 9); tag(handL, 10); tag(handR, 11); tag(neck, 12); tag(sleeveL, 13); tag(sleeveR, 14);
thumbs.forEach((t) => tag(t, isL(t) ? 10 : 11));
// part = 1 is the coat's body; arm = 1 is the right sleeve and the right hand, which hold umbrellas.
const part = new Float32Array(bk.nv), arm = new Float32Array(bk.nv);
for (const v of torso.vs) part[v] = 1;
for (const p of [sleeveR, handR, ...thumbs.filter((t) => !isL(t))]) for (const v of p.vs) arm[v] = 1;

const ringAt = (p, y, tol) => {
  const s = [0, 0, 0]; let k = 0;
  for (const v of p.vs) if (Math.abs(rest[v * 3 + 1] - y) < tol) { s[0] += rest[v * 3]; s[1] += rest[v * 3 + 1]; s[2] += rest[v * 3 + 2]; k++; }
  return k ? mulS(s, 1 / k) : [0, y, 0];
};
const hairFront = hair.vs.filter((v) => rest[v * 3 + 2] > hair.c[2] + 0.06).reduce((m, v) => Math.min(m, rest[v * 3 + 1]), Infinity);
// The anchors the shaders measure the face and the reshaping from. The hair shell's centre is its
// box centre in x and z; in y the shell is cut at the hairline, so it is its top less its radius.
const ANCHOR = {
  mid: MID, eyeL: eyeL.c, eyeR: eyeR.c, browL: browL.c, browR: browR.c, nose: nose.c, noseY: [nose.mn[1], nose.mx[1]],
  lip: lips.c, head: head.c, hair: [(hair.mn[0] + hair.mx[0]) / 2, hair.mx[1] - (hair.mx[0] - hair.mn[0]) * 0.56, (hair.mn[2] + hair.mx[2]) / 2],
  hairFront, neck: neck.c, earL: earL.c, earR: earR.c, handL: handL.c, handR: handR.c,
  torsoTop: torso.mx[1], collar: ringAt(torso, torso.mx[1], 0.004), coatX: torso.c[0],
  patch: (() => { const r = ringAt(sleeveL, sleeveL.mx[1] - 0.09, 0.012); return [sleeveL.mx[0], r[1], r[2]]; })(),
};

// ── Frames: where a rigid part is this frame, and how it has turned since the rest shape ─────────────
const nearestIn = (p, x, y, z) => p.vs.reduce((b, v) => (Math.hypot(rest[v * 3] - x, rest[v * 3 + 1] - y, rest[v * 3 + 2] - z) < Math.hypot(rest[b * 3] - x, rest[b * 3 + 1] - y, rest[b * 3 + 2] - z) ? v : b), p.vs[0]);
const extremeIn = (p, axis, sign) => p.vs.reduce((a, v) => (rest[v * 3 + axis] * sign > rest[a * 3 + axis] * sign ? v : a), p.vs[0]);
const HEAD_V = extremeIn(hair, 1, 1);
const FR = {
  head: [HEAD_V, extremeIn(eyeL, 2, 1), extremeIn(eyeR, 2, 1)],
  handL: [extremeIn(handL, 1, 1), extremeIn(handL, 1, -1), extremeIn(handL, 2, 1)],
  handR: [extremeIn(handR, 1, 1), extremeIn(handR, 1, -1), extremeIn(handR, 2, 1)],
  torso: [nearestIn(torso, MID, 1.2, -0.4), nearestIn(torso, MID + 0.15, 1.36, -0.4), nearestIn(torso, MID - 0.15, 1.36, -0.4)],
};
const SHOULDER_V = nearestIn(sleeveR, sleeveR.c[0], sleeveR.mx[1], sleeveR.c[2]);

function posAt(c, ph, v) {
  const fr = (((ph % 1) + 1) % 1) * c.len, f0 = Math.floor(fr), f1 = (f0 + 1) % c.len, t = fr - f0;
  const a = (c.row0 + f0) * bk.nv * 3 + v * 3, b = (c.row0 + f1) * bk.nv * 3 + v * 3, P = bk.preview;
  return [0, 1, 2].map((i) => P[a + i] + (P[b + i] - P[a + i]) * t);
}
function basis(a, b, d) { const e1 = norm(sub(b, a)); const t = sub(d, a); const e2 = norm(sub(t, mulS(e1, dot(t, e1)))); return [e1, e2, cross(e1, e2)]; }
// Row-major 3x3s. R takes a rest-shape vector to where the part has it this frame.
function frameOf(c, ph, ids) {
  const r = ids.map(R3), p = ids.map((v) => posAt(c, ph, v));
  const Br = basis(...r), Bp = basis(...p), R = new Array(9).fill(0);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) R[i * 3 + j] += Bp[k][i] * Br[k][j];
  return { R, o: p[0], o0: r[0] };
}
const m3 = (a, b) => { const o = new Array(9).fill(0); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) o[i * 3 + j] += a[i * 3 + k] * b[k * 3 + j]; return o; };
const rotX3 = (a) => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const rotY3 = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rotZ3 = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
const colMajor = (R) => [R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]];
const mat4 = (A, t, sc = 1) => [A[0] * sc, A[3] * sc, A[6] * sc, 0, A[1] * sc, A[4] * sc, A[7] * sc, 0, A[2] * sc, A[5] * sc, A[8] * sc, 0, t[0], t[1], t[2], 1];
const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];

// ── The held arm ────────────────────────────────────────────────────────────────────────────────────
// The forearm folds up at the elbow, the upper arm comes a little forward and in. Shoulder and elbow
// are measured off the right sleeve. The same numbers drive the shader and holdPoint, so the umbrella
// lands in the hand.
const HOLD = (() => {
  const S = ringAt(sleeveR, sleeveR.mx[1] - 0.03, 0.012);
  const E = ringAt(sleeveR, S[1] - 0.3, 0.015);
  return { S, E, elbow: -1.45, shoulder: -0.22, inward: 0.3 };
})();
const rotX = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), y = p[1] - o[1], z = p[2] - o[2]; return [p[0], o[1] + c * y - s * z, o[2] + s * y + c * z]; };
const rotZ = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + c * x - s * y, o[1] + s * x + c * y, p[2]]; };
function holdPoint(r) {
  const fa = sstep(HOLD.E[1] + 0.06, HOLD.E[1] - 0.06, r[1]);
  const f = rotX(r, HOLD.E, HOLD.elbow);
  let v = [r[0] + (f[0] - r[0]) * fa, r[1] + (f[1] - r[1]) * fa, r[2] + (f[2] - r[2]) * fa];
  v = rotX(v, HOLD.S, HOLD.shoulder);
  return rotZ(v, HOLD.S, HOLD.inward);
}
// A mesh-space point through the figure's shape and heading, as VERT does it.
function place(p, fig, restY, held) {
  let [x, y, z] = p;
  const band = sstep(0.35, 0.6, restY) * (1 - sstep(1.35, 1.5, restY));
  x *= 1 + (fig.g - 1) * band; z *= 1 + (fig.g - 1) * band * 0.8;
  const s = fig.hunch * sstep(0.95, TOP * 0.85, held ? 1.4 : restY);
  [x, y, z] = rotX([x, y, z], [0, 0.95, 0], s);
  x *= fig.ht; y *= fig.ht; z *= fig.ht;
  const ch = Math.cos(fig.hd), sh = Math.sin(fig.hd);
  return [ch * x + sh * z + fig.x, y, -sh * x + ch * z + fig.z];
}
// The model matrix for a prop riding a part: authored relative to the frame's rest anchor.
function attach(fig, fr) {
  const s = fig.hunch * sstep(0.95, TOP * 0.85, fr.o0[1]);
  return mat4(m3(rotY3(fig.hd), m3(rotX3(s), fr.R)), place(fr.o, fig, fr.o0[1], false), fig.ht);
}

const VERT = `#version 300 es
precision highp float;
precision highp int;
in float aMat;
in vec3 aRest;
in float aPart;
in float aArm;
in float aFeat;
uniform highp sampler2D uPosT;
uniform highp sampler2D uNrmT;
uniform int uW;
uniform int uRows;
uniform int uIdle0;
uniform mat4 uVP;
uniform vec4 uClip;
uniform vec3 uAt;
uniform float uHd;
uniform vec3 uShape;
uniform float uTop;
uniform float uFlare;
uniform float uHold;
uniform vec3 uArmOff;
uniform vec3 uHoldS;
uniform vec3 uHoldE;
uniform vec3 uHoldA;
uniform float uNew;
uniform mat3 uHeadR;
uniform mat3 uHandLR;
uniform mat3 uHandRR;
uniform vec3 uEyeL;
uniform vec3 uEyeR;
uniform vec3 uBrowL;
uniform vec3 uBrowR;
uniform vec3 uNoseC;
uniform vec2 uNoseY;
uniform vec3 uLipC;
uniform vec3 uHeadC;
uniform vec3 uHairC;
uniform vec3 uEarL;
uniform vec3 uEarR;
uniform vec3 uHandL;
uniform vec3 uHandR;
uniform vec3 uCollarC;
uniform vec3 uNeckC;
uniform float uTorsoTop;
uniform float uMid;
uniform float uSeed;
uniform vec2 uCollar;
uniform int uHairStyle;
uniform float uHood;
uniform float uEarPoint;
out vec3 vN;
out vec3 vW;
out vec3 vRest;
out vec3 vRestN;
out float vPart;
out float vArm;
flat out int vMat;
flat out int vFeat;
ivec2 texel(int f) { return ivec2(gl_VertexID % uW, f * uRows + gl_VertexID / uW); }
vec3 rotX(vec3 p, vec3 o, float a) { float c = cos(a), s = sin(a); vec3 q = p - o; return o + vec3(q.x, c * q.y - s * q.z, s * q.y + c * q.z); }
vec3 rotZ(vec3 p, vec3 o, float a) { float c = cos(a), s = sin(a); vec3 q = p - o; return o + vec3(c * q.x - s * q.y, s * q.x + c * q.y, q.z); }
float h1(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h1(i), h1(i + vec3(1, 0, 0)), f.x), mix(h1(i + vec3(0, 1, 0)), h1(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h1(i + vec3(0, 0, 1)), h1(i + vec3(1, 0, 1)), f.x), mix(h1(i + vec3(0, 1, 1)), h1(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float sq(float x) { return x * x; }
float g2(vec2 p) { return exp(-dot(p, p)); }
const vec3 HAND_S = vec3(0.66, 1.08, 0.94);
// The rest shape as the new look wants it. Everything is measured from the anchors, so it holds if
// buildBody moves a part.
vec3 reshape(vec3 r, int f) {
  if (uNew < 0.5) return r;
  // The bake's eyes and brows are lumps; they go inside the head and the face is painted instead.
  if (f == 1) return uEyeL + (r - uEyeL) * 0.3 - vec3(0.0, 0.0, 0.012);
  if (f == 2) return uEyeR + (r - uEyeR) * 0.3 - vec3(0.0, 0.0, 0.012);
  if (f == 3) return uBrowL + (r - uBrowL) * 0.3 - vec3(0.0, 0.0, 0.016);
  if (f == 4) return uBrowR + (r - uBrowR) * 0.3 - vec3(0.0, 0.0, 0.016);
  // The nose: a teardrop, narrow at the bridge, wide and forward at the tip.
  if (f == 5) {
    vec3 l = r - uNoseC;
    float t = clamp((r.y - uNoseY.x) / max(1e-4, uNoseY.y - uNoseY.x), 0.0, 1.0);
    return uNoseC + vec3(l.x * mix(1.35, 0.55, t), l.y * 0.82, l.z * mix(0.7, 0.45, t));
  }
  if (f == 6) return uLipC + (r - uLipC) * vec3(1.12, 1.15, 0.8) - vec3(0.0, 0.0, 0.003);
  // The head's profile: a chin that comes forward and a brow over the eyes.
  if (f == 7) {
    float fw = smoothstep(0.02, 0.07, r.z - uHeadC.z);
    float ax = abs(r.x - uMid);
    float chin = g2(vec2(ax / 0.024, (r.y - (uLipC.y - 0.032)) / 0.015));
    float brow = exp(-sq((r.y - (uEyeL.y + 0.014)) / 0.01)) * (1.0 - smoothstep(0.03, 0.06, ax));
    return r + vec3(0.0, -0.002 * chin, 0.008 * chin + 0.003 * brow) * fw;
  }
  if (f == 8) {
    if (uHood > 0.5) return uHeadC + (r - uHeadC) * 0.7;
    if (uEarPoint > 0.5) {
      bool left = r.x > uMid;
      vec3 l = r - (left ? uEarL : uEarR);
      float u = max(l.y, 0.0) / 0.028;
      return r + vec3((left ? 1.0 : -1.0) * 0.014 * u * u, 0.03 * u * u, -0.016 * u * u);
    }
    return r;
  }
  if (f == 9) {
    vec3 l = r - uHairC;
    if (uHood > 0.5) {
      // A hood: the hair shell grown, dropped at the sides to frame the face and at the back to
      // the shoulders, with a little peak over the brow.
      vec3 q = uHairC + l * vec3(1.15, 1.08, 1.13) + vec3(0.0, 0.004, -0.006);
      float side = smoothstep(0.03, 0.07, abs(l.x));
      float back = smoothstep(0.01, -0.06, l.z);
      float low = smoothstep(-0.004, -0.028, l.y);
      q.y -= low * (0.07 * side * (1.0 - back) + 0.17 * back);
      q.z += 0.014 * side * low * (1.0 - back);
      q += vec3(0.0, -0.01, 0.014) * smoothstep(0.05, 0.09, l.z) * smoothstep(-0.02, 0.03, l.y);
      return q;
    }
    // The shell's edge tucks into the scalp all the way round, so the hairline is where hair meets
    // skin and not the lip of a helmet. buildBody pulls the shell up to a line 0.6 m up per metre
    // forward; near that line the shell sinks, deepest at the back where it stands off furthest.
    float rimY = -0.028 + 0.6 * max(l.z, -0.1);

    r -= normalize(l) * nearRim * depth * (uHairStyle == 3 ? smoothstep(0.0, 0.04, l.z) : 1.0);

const FRAG = `#version 300 es

in vec3 vRest;
in vec3 vRestN;

in float vArm;

flat in int vFeat;

uniform vec3 uLegs;
uniform vec3 uSkin;
uniform vec3 uHair;
uniform vec3 uShoe;
uniform vec3 uAcc;
uniform vec3 uGlow;
uniform vec3 uIris;
uniform vec3 uKey;
uniform vec3 uKeyC;
uniform vec3 uSky;
uniform vec3 uGnd;

float h1(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
float vnoise(vec3 p) {

float sq(float x) { return x * x; }
float g2(vec2 p) { return exp(-dot(p, p)); }
float line(float x, float w) { return 1.0 - smoothstep(0.0, w, abs(x)); }
// A line w wide that never gets thinner than a pixel: past that it widens and fades, so a brow or a
// lash at a distance becomes a soft shade instead of a crawling stripe.
float lineAA(float d, float w) { float W = max(w, fw); return (1.0 - smoothstep(0.0, W, abs(d))) * min(1.0, 1.4 * w / W); }

// face's relief without a normal map.
vec3 bump(vec3 n, vec3 p, float h) {
  vec3 dx = dFdx(p), dy = dFdy(p);

  float det = dot(dx, r1);
  vec3 g = sign(det) * (hx * r1 + hy * r2);

// What a shiny surface sees, with no environment map: ground below, sky above, a bright band where
// they meet, the key as a soft box and the rim light as a second, coloured one behind. Rougher
// blurs the lot. Metal and gloss read as metal and gloss because of this, not because of a colour.
vec3 envAt(vec3 R, float rough) {
  float w = mix(0.05, 0.5, rough);
  vec3 c = mix(uGnd * 0.6, uSky * 1.1, smoothstep(-w, w, R.y));
  c += mix(uSky, uKeyC, 0.5) * 0.45 * exp(-sq(R.y / (w + 0.06)));

  c += mix(uKeyC, uRimC, 0.5) * uNight * 0.9 * exp(-sq((R.y - 0.05) / (w + 0.12)));

float diamond(vec2 p, float s) {
  vec2 g = abs(fract(vec2(p.x + p.y, p.x - p.y) / s) - 0.5);
  return min(g.x, g.y);

void paintFace(inout vec3 col, inout float h, inout vec3 glow, vec3 r) {

    float frontN = smoothstep(0.2, 0.6, vRestN.z);
    // Cloth: long folds below the waist, creases up the sleeves and trousers, a weave everywhere.
    if (m == 1 && vPart > 0.5) h += 0.0035 * sin(ang * 9.0 + vnoise(r * 5.0 + uSeed) * 4.0) * (1.0 - smoothstep(0.6, 1.02, r.y));
    if (m == 1 && vPart < 0.5) h += 0.0015 * sin(r.y * 70.0 + vnoise(r * 9.0) * 3.0);
    if (m == 2) {
      h += 0.0018 * sin(r.y * 55.0 + vnoise(r * 7.0 + uSeed) * 5.0) * line(r.y - 0.25, 0.22);
      if (uOrder != 4) h += 0.0008 * line(vRestN.x, 0.12) * step(0.5, vRestN.z) * step(0.3, r.y);
    }
    micro = vnoise(r * 260.0) * 0.00035;
    h += micro;
    if (uOrder == 1) {
      // Ascendant: a clean pale coat, a high collar, lit piping on the front edge, hem and cuffs,
      // a badge on the breast, glossy shoes.
      rough = 0.35;
      if (m == 1) {
        float edge = line(cx - 0.012, 0.004) * frontN * step(r.y, uTorsoTop - 0.03) * vPart;
        float hemLine = line(r.y - 0.645, 0.006) * vPart;
        float cuff = line(r.y - 0.9, 0.005) * (1.0 - vPart);
        glow += uGlow * (edge + hemLine + cuff) * 1.6;
        col *= 1.0 - 0.18 * line(r.y - 1.02, 0.01) * vPart;
        h -= 0.0012 * line(cx - 0.012, 0.01) * frontN;
        col *= 1.0 - 0.1 * line(abs(cx) - 0.12, 0.004) * frontN * step(0.9, r.y);
        float bx = cx - 0.09;
        float badge = lineAA(abs(bx) * 1.7 - (1.318 - r.y), 0.0012) * step(1.29, r.y) * step(r.y, 1.318) * frontN * vPart;
        glow += uGlow * badge * 1.4;
        col = mix(col, vec3(0.1, 0.1, 0.14), line(r.y - (uTorsoTop - 0.004), 0.004) * vPart);
      }
      if (m == 2) col *= 1.0 + 0.25 * line(abs(r.x - uCoatX) - 0.12, 0.006);
      if (m == 3) { rough = 0.18; col *= 0.9; }
      if (uCyber > 0.5 && skinLike && vArm > 0.5) {
        col = vec3(0.05, 0.05, 0.07);
        rough = 0.15;
        glow += uGlow * line(fract(r.y * 45.0) - 0.5, 0.06) * 1.2;
      }
    } else if (uOrder == 2) {
      // Long Watch: a weathered trench with the collar up, a rifle sling or pack straps, a belt
      // with pouches, a patch on the left arm, lace-up boots.
      if (m == 1) {
        float wear = smoothstep(0.55, 0.8, vnoise(r * 22.0 + uSeed));
        col = mix(col, col * 1.35 + 0.02, wear * 0.5);
        col = mix(col, col * vec3(0.55, 0.5, 0.42), (1.0 - smoothstep(0.62, 1.0, r.y)) * grime);
        float strap = 0.0;
        if (uStrap == 1) strap = line(cx + (r.y - 1.18) * 0.75, 0.02) * step(0.95, r.y) * step(r.y, 1.45) * vPart;
        if (uStrap == 2) strap = line(abs(cx) - 0.085, 0.016) * step(1.1, r.y) * vPart;
        float belt = line(r.y - 0.985, 0.022) * vPart;
        float pouch = belt * step(0.5, fract(ang * 1.6 + 0.2)) * step(r.z, 0.0);
        col = mix(col, uAcc, max(strap, belt));
        h += 0.004 * (strap + belt) + 0.006 * pouch;
        col += vec3(0.25, 0.22, 0.12) * line(r.y - 0.985, 0.006) * line(cx, 0.018) * frontN;
        col *= 1.0 - 0.35 * line(cx - 0.03, 0.005) * frontN * step(0.7, r.y) * vPart;
        if (f == 13) {
          float d = length(vec2(r.z - uPatch.z, r.y - uPatch.y));
          float disc = (1.0 - smoothstep(0.019, 0.021, d)) * smoothstep(0.2, 0.5, vRestN.x);
          col = mix(col, mix(vec3(0.62, 0.45, 0.15), vec3(0.12, 0.09, 0.05), line(d - 0.017, 0.0025) + line(r.y - uPatch.y, 0.003) * step(d, 0.012)), disc);
          h += 0.001 * disc;
        }
      }
      if (m == 2) {
        col = mix(col, col * 0.6, (1.0 - smoothstep(0.02, 0.3, r.y)) * grime);
        if (r.y < 0.27) {
          col = uShoe * 1.12 * (0.85 + 0.25 * vnoise(r * 90.0));
          col *= 1.0 - 0.45 * line(r.y - 0.265, 0.006);
          float lace = line(fract(r.y / 0.018 + abs(vRestN.x) * 1.4) - 0.5, 0.12) * step(0.6, vRestN.z);
          col = mix(col, vec3(0.1, 0.08, 0.06), lace * 0.8);
          h += 0.0012 * lace;
          rough = 0.6;
        }
      }
      if (m == 3) { col = mix(col, uAcc * 0.8, step(0.05, r.y)); h += 0.002 * line(fract(r.y * 40.0) - 0.5, 0.1) * step(0.06, r.y); }
    } else if (uOrder == 3) {
      // Null: a black hoodie with the hood up, a jam patch on the arm, one green lamp, sneakers.
      rough = 0.8;
      if (m == 1) {
        float pouch = step(0.93, r.y) * step(r.y, 1.06) * step(abs(cx), 0.11) * frontN;
        col *= 1.0 - 0.4 * pouch * (line(r.y - 1.06, 0.006) + line(abs(cx) - 0.11, 0.006));
        h += 0.002 * pouch;
        col = mix(col, vec3(0.6), line(abs(cx) - 0.03, 0.004) * frontN * step(1.2, r.y) * step(r.y, uTorsoTop - 0.01));
        col *= 1.0 - 0.3 * line(r.y - 0.89, 0.012);
        glow += vec3(0.2, 1.0, 0.4) * line(length(vec2(cx - 0.09, r.y - 1.25)), 0.008) * frontN * 2.0;
        if (f == 13) {
          vec2 pd = vec2(r.z - uPatch.z, r.y - uPatch.y);
          float disc = (1.0 - smoothstep(0.018, 0.02, length(pd))) * smoothstep(0.2, 0.5, vRestN.x);
          col = mix(col, mix(vec3(0.45), vec3(0.05), max(line(length(pd) - 0.014, 0.0025), line(pd.x - pd.y, 0.0025) * step(length(pd), 0.014))), disc);
        }
      }
      if (m == 3) { col = mix(col, vec3(0.85, 0.84, 0.8), 1.0 - smoothstep(0.024, 0.03, r.y)); col = mix(col, vec3(0.8), line(r.y - 0.06, 0.004) * step(0.5, abs(vRestN.x))); }
    } else if (uOrder == 5) {
      // Evening dress: a hip-length jacket open in a V to one button, a banded shirt inside it,
      // patterned yokes either side of the V, and the shirt's cuffs showing past the sleeves.
      if (m == 1) {
        float front = frontN * vPart;
        float top = uTorsoTop;
        float vB = 1.06;
        float halfW = 0.088 * clamp((r.y - vB) / (top - vB), 0.0, 1.0);
        float ax = abs(cx);
        float inV = step(vB, r.y) * (1.0 - smoothstep(halfW - 0.0015, halfW + 0.0015, ax)) * front;
        float band = smoothstep(top - 0.034, top - 0.028, r.y) * vPart;
        float cuff = (f == 13 || f == 14) ? smoothstep(0.9, 0.894, r.y) : 0.0;
        float shirt = max(max(inV, band), cuff);
        // The yoke runs from the V's edge out toward the shoulder, its lower edge rising outward.
        float yb = 1.255 + (ax - halfW) * 0.55;
        float yoke = smoothstep(yb - 0.002, yb + 0.002, r.y) * (1.0 - smoothstep(0.15, 0.155, ax)) * front * (1.0 - shirt);
        vec3 yc = uAcc * (0.7 + 0.6 * vnoise(r * 70.0 + uSeed)) * (0.85 + 0.3 * vnoise(r * 240.0));
        col = mix(col, yc, yoke);
        col *= 1.0 - 0.5 * lineAA(r.y - yb, 0.0015) * step(ax, 0.155) * front * (1.0 - shirt);
        // The shirt: faint stripes, a placket down the middle with its buttons, a line under the band.
        vec3 sc = uShirt * (0.95 + 0.05 * step(0.5, fract(cx / 0.006)));
        sc *= 1.0 - 0.12 * lineAA(ax - 0.011, 0.0008);
        float btn = (1.0 - smoothstep(0.0035, 0.0045 + fw, length(vec2(cx, fract((r.y - vB) / 0.055) * 0.055 - 0.0275)))) * step(r.y, top - 0.04);
        sc = mix(sc, uShirt * 0.35, btn);
        sc *= 1.0 - 0.25 * lineAA(r.y - (top - 0.034), 0.001) * vPart;
        // Where the jacket's edge stands off the shirt, the shirt is in its shadow.
        sc *= 1.0 - 0.4 * (1.0 - smoothstep(0.0, 0.014, halfW - ax)) * inV;
        col = mix(col, sc, shirt);
        h -= 0.004 * inV;
        h += 0.0015 * lineAA(ax - halfW - 0.004, 0.004) * front * step(vB, r.y) * (1.0 - band);
        // One button at the foot of the V.
        float b1 = 1.0 - smoothstep(0.009, 0.0105 + fw, length(vec2(cx, r.y - (vB - 0.012))));
        col = mix(col, uAcc * 0.4, b1 * front);
        h += 0.0015 * b1 * front;
        matte = max(max(shirt, yoke), b1 * front);
      }
      if (m == 3) col *= 1.0 - 0.5 * (1.0 - smoothstep(0.012, 0.02, r.y));
    } else if (uOrder == 4) {
      // Wildblood: a red cloak with a ragged hem and a woven band, marked skin, a necklace of
      // teeth, wrapped shins.
      rough = 0.9;
      if (m == 1) {
        col = mix(col, col * 1.3, smoothstep(0.5, 0.9, vnoise(r * 14.0 + uSeed)) * 0.4);
        float band = step(abs(r.y - hem - 0.05), 0.035) * vPart;
        col = mix(col, uAcc, band * step(0.5, fract(ang * 6.0 + r.y * 40.0)));
        h += 0.002 * band;
        col = mix(col, col * 0.55, (1.0 - smoothstep(0.64, 0.95, r.y)) * grime * 0.8);
      }
      if (m == 2 && r.y < 0.42) {
        col = mix(col, vec3(0.5, 0.42, 0.3), 0.8);
        float wrap = line(fract(r.y / 0.022 + atan(vRestN.x, vRestN.z) * 0.25) - 0.5, 0.1);
        col *= 1.0 - 0.35 * wrap;
        h += 0.001 * wrap;
      }
      if (skinLike) {
        float spots = smoothstep(0.62, 0.7, vnoise(r * 70.0 + uSeed));
        col = mix(col, col * vec3(0.55, 0.4, 0.5), spots * (f == 7 ? 0.5 : 1.0));
      }
      if ((f == 12 || m == 1) && abs(r.y - (uTorsoTop - 0.035)) < 0.012 && vRestN.z > 0.0) {
        col = mix(col, vec3(0.9, 0.86, 0.72), step(0.5, fract(ang * 8.0)));

      }
    }
    // The person: face, nose, lips, ears, hair, hands, neck.
    vec3 skin = uSkin;
    if (f == 7) {
      paintFace(col, h, glow, r);
      // Below the hair at the temples and the nape the skin takes the hair's colour and lets it go,
      // so the shell's edge disappears into a hairline instead of a zigzag.
      if (uHood < 0.5) {
        vec3 lh = r - uHairC;
        float rimY = -0.028 + 0.6 * max(lh.z, -0.1);
        float fade = smoothstep(-0.03, -0.004, lh.y - rimY) * smoothstep(0.07, 0.02, lh.z);
        float strand = vnoise(vec3(atan(lh.x, lh.z) * 24.0, lh.y * 16.0, uSeed));
        vec3 fc = uHairStyle == 4 ? mix(col, gHair * 0.45, 0.4 * (0.7 + 0.6 * vnoise(r * 900.0))) : gHair * (0.78 + 0.4 * strand) * 0.9;
        col = mix(col, fc, fade * 0.9);
      }
    }
    if (f == 5) {
      col *= 1.0 - 0.14 * smoothstep(0.006, 0.0, r.z - uNoseC.z);
      col *= 1.0 - 0.4 * smoothstep(uNoseY.x + 0.014, uNoseY.x + 0.003, r.y) * smoothstep(0.0, -0.6, normalize(vN).y);
      col = mix(col, col * vec3(1.06, 0.9, 0.88), 0.35 * smoothstep(uNoseY.x + 0.025, uNoseY.x + 0.008, r.y));
    }
    if (f == 6) {
      float lu = (r.x - uLipC.x) / 0.022;
      float lv = (r.y - uLipC.y) / 0.0052;
      float d = lv - (0.05 - 0.28 * uMood * lu * lu);
      vec3 lip = skin * mix(vec3(0.78, 0.55, 0.53), vec3(0.9, 0.68, 0.64), smoothstep(0.3, -0.3, d));
      if (uMakeup > 0.5) lip = uLipTint * mix(0.75, 1.0, smoothstep(0.3, -0.3, d));
      col = mix(lip, skin, smoothstep(0.62, 1.0, abs(lu)));
      col = mix(col, skin * 0.28, lineAA(d * 0.0052, 0.00045) * (1.0 - smoothstep(0.85, 1.05, abs(lu))));
      rough = 0.5;
    }
    if (f == 8) col *= vec3(1.03, 0.9, 0.88);
    if (f == 9) {
      if (uHood > 0.5) {
        col = uCoat * (0.88 + 0.14 * vnoise(r * 60.0 + uSeed));
        h += 0.0012 * sin((r.y - uHairC.y) * 90.0 + vnoise(r * 12.0) * 3.0);
        rough = 0.85;
      } else {
        vec3 lh = r - uHairC;
        float strand = vnoise(vec3(atan(lh.x, lh.z) * 24.0, lh.y * 16.0, uSeed));
        col = gHair * (0.78 + 0.4 * strand);
        h += 0.0007 * strand;
        if (uHairStyle == 1) col *= 1.0 - 0.55 * lineAA(lh.x - 0.024, 0.0014) * smoothstep(0.03, 0.06, lh.y) * smoothstep(-0.03, 0.02, lh.z);
        if (uHairStyle == 4) {
          // Swept back: the strands run front to back, and the cut sides are skin through stubble.
          strand = vnoise(vec3(lh.x * 320.0, lh.y * 60.0 - lh.z * 20.0, uSeed));
          col = gHair * (0.72 + 0.5 * strand);
          h += 0.0009 * strand;
          float cut = smoothstep(0.05, 0.068, abs(lh.x)) * (1.0 - smoothstep(0.02, 0.055, lh.y));
          cut = max(cut, smoothstep(-0.03, -0.075, lh.z) * (1.0 - smoothstep(0.0, 0.035, lh.y)));
          col = mix(col, mix(uSkin, gHair * 0.45, 0.45 * (0.7 + 0.6 * vnoise(r * 900.0))), cut);
        }
        rough = uHairStyle == 1 || uHairStyle == 4 ? 0.35 : 0.6;
        isHair = true;
      }
    }
    if (f == 10 || f == 11) {
      vec3 l = r - (f == 10 ? uHandL : uHandR);
      float fing = smoothstep(-0.004, -0.02, l.y);
      float d = min(abs(l.z + 0.018), min(abs(l.z - 0.001), abs(l.z - 0.019)));
      col *= 1.0 - 0.3 * lineAA(d, 0.0011) * fing;
      col *= 1.0 - 0.12 * lineAA(l.y + 0.011, 0.0018);
      if (uGlove > 0 && !(uCyber > 0.5 && vArm > 0.5)) {
        float gv = smoothstep(-0.02, -0.01, l.y);
        col = mix(col, uGlove == 1 ? uAcc * 1.25 : vec3(0.05, 0.05, 0.055), gv);
        rough = mix(rough, 0.45, gv);
      }
      if (uClaws > 0.5) {
        float tip = smoothstep(-0.052, -0.062, l.y);
        col = mix(col, vec3(0.09, 0.075, 0.07), tip);
        rough = mix(rough, 0.2, tip);
      }
    }
    if (f == 12) col *= 1.0 - 0.25 * smoothstep(uLipC.y - 0.06, uLipC.y - 0.03, r.y);
    if (uScarf > 0.5 && ((f == 12 && r.y < uLipC.y - 0.045) || (vPart > 0.5 && r.y > uTorsoTop - 0.03))) {
      col = (uOrder == 2 ? vec3(0.12, 0.11, 0.1) : uAcc) * (0.8 + 0.2 * step(0.5, fract(r.y * 55.0))) * (0.85 + 0.3 * vnoise(r * 150.0));
      h += 0.0018 * vnoise(r * 80.0);
      rough = 1.0;
    }
    if (inside) col = uOrder == 1 ? uAcc * 0.55 : col * 0.42;
  }
  // The material of the garment under this pixel: 0 cloth, 1 satin, 2 leather, 3 vinyl, 4 metal.
  // A Long Watch boot is the trousers' mesh painted as a boot, so it takes the shoes' material.
  int mk = 0;
  if (uMatOn > 0.5 && uOrder != 0 && !inside) {
    if (m == 1) mk = int(uMats.x + 0.5);
    else if (m == 2) mk = int((uOrder == 2 && r.y < 0.27 ? uMats.z : uMats.y) + 0.5);
    else if (m == 3) mk = int(uMats.z + 0.5);
    if (matte > 0.5 || (uScarf > 0.5 && vPart > 0.5 && r.y > uTorsoTop - 0.03)) mk = 0;
  }
  if (mk > 0) {
    vec2 p2 = abs(vRestN.x) > abs(vRestN.z) ? vec2(r.z, r.y) : vec2(r.x, r.y);
    // Under a sharp reflection the weave's noise glitters, so vinyl and metal are smooth.
    if (mk >= 3) h -= micro;
    if (mk == 4) {
      // Lame: a quilted diamond lattice, sunk at the lines and puffed in the cells.
      float s = 0.008;
      float d = diamond(p2, s);
      float fade = 1.0 - smoothstep(s * 0.08, s * 0.25, fw);
      h += (0.00012 * smoothstep(0.0, 0.25, d) - 0.00014 * (1.0 - smoothstep(0.0, 0.06, d))) * fade;
    } else if (mk == 2) {
      // Leather: grain, and the odd crease where it bends.
      h += 0.0003 * vnoise(r * 700.0) + 0.0008 * smoothstep(0.7, 0.9, vnoise(r * 40.0 + uSeed));
    } else if (mk == 1) {
      h += 0.0002 * sin(p2.y * 900.0 + vnoise(r * 30.0) * 6.0) * (1.0 - smoothstep(0.0003, 0.001, fw));
    }
  }
  col *= 1.0 - 0.22 * uWet * step(0.5, float(m != 0 && m != 6));
  vec3 n = normalize(vN);
  if (inside) n = -n;
  if (uOrder != 0) n = bump(n, vW, h);
  float nk = dot(n, uKey);
  float wrap = max(0.0, (nk + 0.35) / 1.35);
  vec3 amb = mix(uGnd, uSky, n.y * 0.5 + 0.5);
  float ao = mix(0.55, 1.0, smoothstep(0.0, 0.3, r.y));
  ao *= 1.0 - 0.3 * line(r.y - 0.93, 0.08) * (1.0 - smoothstep(0.03, 0.09, abs(r.x - uCoatX)));
  ao *= 0.85 + 0.15 * smoothstep(-0.004, 0.004, h);
  if (inside) ao *= 0.6;
  vec3 v = normalize(uEye - vW);
  float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  vec3 lit = col * (amb * ao + uKeyC * wrap * (1.0 - 0.3 * uWet)) + rim * uRimC;
  // Skin: light that gets under it warms the edge of the shadow.
  if (skinLike && uOrder != 0) lit += col * vec3(0.3, 0.1, 0.06) * uKeyC * (smoothstep(-0.45, 0.1, nk) - smoothstep(0.1, 0.7, nk)) * 0.8;
  vec3 hv = normalize(uKey + v);
  float nh = max(dot(n, hv), 0.0);
  float shine = skinLike ? 0.1 : mix(0.03, 0.5, 1.0 - rough) + 0.35 * uWet;
  lit += uKeyC * pow(nh, mix(18.0, 60.0, 1.0 - rough)) * shine;
  if (mk > 0) {
    float mr = mk == 1 ? 0.42 : mk == 2 ? 0.55 : mk == 3 ? 0.1 : 0.36;
    float ndv = max(dot(n, v), 0.0);
    float fr = pow(1.0 - ndv, 5.0);
    vec3 E = envAt(reflect(-v, n), mr) * ao;
    if (mk == 4) {
      // Metal has next to no diffuse: its colour is the colour of what it reflects.
      lit = col * amb * ao * 0.15 + mix(col, vec3(1.0), fr * 0.5) * E + rim * uRimC * 0.3;
    } else {
      // Satin's sheen takes the fibre's colour and brightens where the cloth turns away;
      // leather and vinyl reflect white, vinyl hard.
      float kr = mk == 1 ? mix(0.06, 0.5, fr) + 0.12 * sq(1.0 - ndv) : mk == 2 ? mix(0.035, 0.3, fr) : mix(0.05, 0.8, fr);
      vec3 tint = mk == 1 ? mix(vec3(1.0), col / max(0.05, max(col.r, max(col.g, col.b))), 0.7) : vec3(1.0);
      lit = lit * (1.0 - kr) + tint * E * kr * (mk == 3 ? 1.6 : 1.0);
    }
  }
  // Hair: a soft band of sheen round the crown.
  if (isHair) lit += uKeyC * 0.12 * exp(-sq((nh - 0.72) / 0.12)) * (0.4 + dot(gHair, vec3(0.33)));
  lit += glow;
  outColor = vec4(pow(lit, vec3(0.95)), 1.0);
}`;

const PLAIN_V = `#version 300 es
in vec3 aP;
in vec3 aN;
in vec3 aC;
in float aE;
in float aK;
uniform mat4 uVP;
uniform mat4 uM;
out vec3 vN;
out vec3 vL;
out vec3 vWp;
out vec3 vC;
out float vE;
out float vK;
void main() { vec4 w = uM * vec4(aP, 1.0); vN = mat3(uM) * aN; vL = aP; vWp = w.xyz; vC = aC; vE = aE; vK = aK; gl_Position = uVP * w; }`;
// Modes: 0 a prop, 0.7 the weather, 1 the pavement, 2 a contact shadow. A prop's vertex colour
// either tints the prop's colour (aK 0) or is its own (aK 1); aE is how much of uEmit it gives off.
const PLAIN_F = `#version 300 es
precision highp float;
in vec3 vN;
in vec3 vL;
in vec3 vWp;
in vec3 vC;
in float vE;
in float vK;
uniform vec3 uC;
uniform vec3 uKey;
uniform vec3 uKeyC;
uniform vec3 uSky;
uniform vec3 uGlow;
uniform vec3 uEmit;
uniform vec3 uEye;
uniform float uMode;
uniform float uA;
uniform float uWet;
out vec4 o;
void main() {
  if (uMode > 1.5) {
    float d = dot(vL.xz, vL.xz);
    o = vec4(0.0, 0.0, 0.0, uA * pow(max(0.0, 1.0 - d), 2.0));
    return;
  }
  if (uMode > 0.5 && uMode < 0.9) { o = vec4(uC, uA); return; }
  vec3 n = normalize(vN);

  if (order === 2) return [R() < 0.3 ? 2 : 0, 0, 2];

// The gala line-up: the reference's gold and silver first, then chrome, white satin and oxblood leather.
const GALA = [
  { coat: [236, 178, 64], legs: [206, 208, 222], shoes: [214, 214, 222], hair: [24, 150, 160], acc: [74, 46, 82], mats: [4, 4, 3], hairStyle: 4 },
  { coat: [150, 156, 168], legs: [22, 22, 28], shoes: [16, 16, 20], hair: [18, 16, 20], acc: [30, 30, 40], mats: [4, 1, 3], hairStyle: 1 },
  { coat: [232, 230, 238], legs: [30, 34, 60], shoes: [20, 20, 26], hair: [60, 40, 30], acc: [120, 110, 160], mats: [1, 1, 3], hairStyle: 1 },
  { coat: [112, 26, 30], legs: [26, 26, 30], shoes: [44, 30, 22], hair: [215, 212, 200], acc: [40, 20, 22], mats: [2, 2, 2], hairStyle: 4 },
];

function crowd(seed, district, orders = null) {
  const R = mulberry(seed * 9973 + (district === 'W' ? 1 : 77) + (orders ? orders.length * 131 : 0));
  const pick = (list) => list[Math.floor(R() * list.length)];
  const pickW = (list) => { let t = 0; for (const [, w] of list) t += w; let x = R() * t; for (const [v, w] of list) if ((x -= w) < 0) return v; return list[0][0]; };
  const n = orders ? orders.length : 7;
  return Array.from({ length: n }, (_, i) => {
    const vals = Array.from({ length: 5 }, R);
    const base = actorOutfit((k) => vals[k]);
    const order = orders ? orders[i] : pickW(DISTRICT[district]), O = ORDERS[order];
    let skin = base.skin;
    if (O.skin) { const t = pick(O.skin); skin = skin.map((c, j) => c * 0.5 + t[j] * 0.5); }
    const o = { coat: pick(O.coat), legs: pick(O.legs), skin, hair: pick(O.hair), shoes: pick(O.shoes) };
    const r = () => R();
    const prop = order === 2 ? (r() < 0.5 ? 'rifle' : r() < 0.6 ? 'pack' : null) : order === 1 ? (r() < 0.5 ? 'tablet' : null) : order === 3 ? (r() < 0.6 ? 'radio' : null) : null;
    return { base, o, order, acc: pick(O.acc), glow: pick(O.glow), body: pickW(O.body),
      clip: ['walk', 'idle', 'walk', 'idle', 'walk', 'walk', 'idle'][i % 7], ph: R(), seed: R() * 100,
      girth: O.girth[0] + R() * (O.girth[1] - O.girth[0]), height: 0.93 + R() * 0.12,
      brolly: R() < (order === 1 ? 0.8 : order === 2 ? 0.35 : 0.2), brollyC: pick(BROLLY[order]),
      cap: order === 2 && R() < 0.75, capC: O.cap ? pick(O.cap) : [0, 0, 0], scarf: order === 2 ? R() < 0.8 : R() < 0.3,
      makeup: order === 1 && R() < 0.5, lipTint: [[110, 50, 120], [90, 30, 60], [60, 40, 110]][Math.floor(R() * 3)],
      cyber: order === 1 && R() < 0.5, hoodR: R(), implant: order === 1 && R() < 0.7, bun: order === 1 && R() < 0.45,
      phones: order === 3 && R() < 0.8, earPoint: order === 4 && R() < 0.8, claws: order === 4,
      glove: order === 2 ? (R() < 0.35 ? 1 : 0) : order === 3 ? (R() < 0.6 ? 2 : 0) : 0,
      age: Math.pow(R(), 1.3), brow: O.brow + (R() - 0.5) * 0.6, mood: O.mood + (R() - 0.5) * 0.4, iris: pick(O.iris),
      beard: order === 2 ? (R() < 0.3 ? 2 : R() < 0.5 ? 1 : 0) : order === 3 ? (R() < 0.25 ? 1 : 0) : order === 1 ? (R() < 0.08 ? 1 : 0) : 0,
      prop, strap: order === 2 ? (prop === 'rifle' ? 1 : prop === 'pack' ? 2 : 0) : 0,
      mats: matsFor(order, mulberry(seed * 7919 + i * 31 + order)),

}
// The shots: the street, then a line-up and a pair of faces, each with the district's two orders.
const SHOTS = {
  street: { eye: [2.2, 1.5, 5.4], at: [0, 0.95, -0.6] },
  portraits: { eye: [0.35, 1.5, 2.4], at: [0, 1.3, 0], n: 4, gap: 0.5 },
  faces: { eye: [0.08, 1.64, 0.95], at: [0, 1.615, 0], n: 2, gap: 0.36 },
  gala: { eye: [0.45, 1.3, 3.9], at: [0, 0.98, 0], n: 4, gap: 0.55 },
};
function lineup(seed, district, n, gap) {
  const [a, b] = DISTRICT[district].map(([o]) => o);
  const people = crowd(seed, district, Array.from({ length: n }, (_, i) => (i % 2 ? b : a)));
  people.forEach((p, i) => { p.x = (i - (n - 1) / 2) * gap; p.z = 0; p.clip = 'idle'; p.face = true; });
  return people;
}
// The same four people on both sides; only the west has materials on.
function gala(seed) {
  const people = crowd(seed, 'W', GALA.map(() => 5));
  people.forEach((p, i) => {
    const G = GALA[i];
    Object.assign(p.o, { coat: G.coat, legs: G.legs, shoes: G.shoes, hair: G.hair });
    Object.assign(p, { acc: G.acc, mats: G.mats, hairStyle: G.hairStyle, body: 1, girth: 1.02, height: 1.0, age: 0.15,
      brolly: false, scarf: false, prop: null, strap: 0, glove: 0, beard: 0, makeup: false, cyber: false, implant: false, bun: false,
      x: (i - (GALA.length - 1) / 2) * SHOTS.gala.gap, z: 0, clip: 'idle', face: true });
  });
  return people;
}

const $ = (id) => document.getElementById(id);
const views = [{ ...gl2($('a')), district: 'W' }, { ...gl2($('b')), district: 'E' }];
let crowds = {};
const recrowd = () => {
  const s = +$('seed').value || 0;
  crowds = {};
  for (const d of ['W', 'E']) crowds[d] = { street: crowd(s, d), portraits: lineup(s, d, 4, SHOTS.portraits.gap), faces: lineup(s, d, 2, SHOTS.faces.gap), gala: gala(s) };
};
recrowd();
$('seed').oninput = recrowd;

// Each side's light: the west is cold neon, the east sodium and fire.
function lightFor(district, night, weather) {
  if (!night) {
    const wet = weather === 'rain';
    return { key: [0.55, 0.7, 0.45], keyC: wet ? [0.6, 0.62, 0.66] : [0.95, 0.9, 0.82], sky: wet ? [0.36, 0.4, 0.46] : [0.46, 0.5, 0.58],
      gnd: [0.3, 0.26, 0.22], rim: [0.18, 0.2, 0.24], bg: wet ? [0.4, 0.43, 0.49] : weather === 'cold' ? [0.62, 0.66, 0.7] : [0.55, 0.6, 0.68],
      pave: wet ? [0.32, 0.33, 0.36] : weather === 'cold' ? [0.66, 0.67, 0.7] : [0.5, 0.49, 0.47], street: [0.5, 0.5, 0.55] };
  }
  return district === 'W'
    ? { key: [-0.4, 0.6, 0.55], keyC: [0.42, 0.5, 0.9], sky: [0.08, 0.1, 0.22], gnd: [0.05, 0.05, 0.1], rim: [0.45, 0.35, 0.95],
        bg: [0.03, 0.04, 0.1], pave: [0.16, 0.17, 0.24], street: [0.4, 0.3, 1.0] }
    : { key: [0.5, 0.45, 0.5], keyC: [0.95, 0.6, 0.28], sky: [0.1, 0.07, 0.1], gnd: [0.12, 0.06, 0.04], rim: [0.9, 0.3, 0.2],
        bg: [0.08, 0.04, 0.05], pave: [0.2, 0.17, 0.16], street: [1.0, 0.5, 0.2] };
}

const DROPS = Array.from({ length: 900 }, (_, i) => { const R = mulberry(i + 5); return [R() * 10 - 5, R() * 3.4, R() * 6 - 4.5, R()]; });
function weatherVerts(kind, t) {
  const out = new Float32Array(DROPS.length * 6);
  DROPS.forEach(([x, y, z, r], i) => {
    const fall = kind === 'rain' ? 7 : 0.6, len = kind === 'rain' ? 0.16 : 0.015;
    const yy = ((y - t * fall * (0.8 + r * 0.4)) % 3.4 + 3.4) % 3.4;
    const xx = x + (kind === 'cold' ? Math.sin(t * 0.8 + r * 20) * 0.15 : yy * 0.05);
    out.set([xx, yy, z, xx - 0.01, yy + len, z], i * 6);
  });
  return out;
}

// The anchors never change, so they go to each program once.
function setAnchors(gl, U) {
  const v3 = (n, a) => { if (U[n]) gl.uniform3fv(U[n], a); };
  const f1 = (n, a) => { if (U[n]) gl.uniform1f(U[n], a); };
  v3('uEyeL', ANCHOR.eyeL); v3('uEyeR', ANCHOR.eyeR); v3('uBrowL', ANCHOR.browL); v3('uBrowR', ANCHOR.browR);
  v3('uNoseC', ANCHOR.nose); if (U.uNoseY) gl.uniform2fv(U.uNoseY, ANCHOR.noseY); v3('uLipC', ANCHOR.lip);
  v3('uHeadC', ANCHOR.head); v3('uHairC', ANCHOR.hair); v3('uEarL', ANCHOR.earL); v3('uEarR', ANCHOR.earR);
  v3('uNeckC', ANCHOR.neck); v3('uHandL', ANCHOR.handL); v3('uHandR', ANCHOR.handR); v3('uCollarC', ANCHOR.collar); v3('uPatch', ANCHOR.patch);
  f1('uTorsoTop', ANCHOR.torsoTop); f1('uMid', ANCHOR.mid); f1('uHairFront', ANCHOR.hairFront); f1('uCoatX', ANCHOR.coatX);
}

function frame(now) {
  const t = now / 1000, night = $('night').checked, weather = $('weather').value, built = $('built').checked;
  const rain = weather === 'rain', cold = weather === 'cold', shot = $('shot').value, S = SHOTS[shot];
  views.forEach((V) => {
    const { gl } = V, cv = gl.canvas, people = crowds[V.district][shot];
    // The gala shot is an A/B of the materials, so both sides get the west's light.
    const L = lightFor(shot === 'gala' ? 'W' : V.district, night, weather);
    const matOn = built ? 0 : shot === 'gala' ? (V.district === 'W' ? 1 : 0) : $('mats').checked ? 1 : 0;
    const label = cv.parentElement.querySelector('span');
    label.dataset.home ??= label.textContent;
    label.textContent = shot === 'gala' ? (matOn ? 'EVENING DRESS · MATERIALS' : 'EVENING DRESS · FLAT') : label.dataset.home;
    const dpr = devicePixelRatio || 1, w = cv.clientWidth * dpr | 0, h = cv.clientHeight * dpr | 0;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clearColor(...L.bg, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    const zk = +$('zoom').value / 5.4;
    const eye = add(S.at, mulS(sub(S.eye, S.at), zk));
    const vp = mul(persp(0.62, w / h, 0.05, 50), lookAt(eye, S.at));
    const kl = Math.hypot(...L.key), K = L.key.map((k) => k / kl);
    const P = V.plain;
    const plainCommon = () => {
      gl.useProgram(P.p);
      gl.uniformMatrix4fv(P.U.uVP, false, vp);
      gl.uniform3fv(P.U.uKey, K); gl.uniform3fv(P.U.uKeyC, L.keyC); gl.uniform3fv(P.U.uSky, L.sky);
      gl.uniform3fv(P.U.uGlow, L.street); gl.uniform1f(P.U.uWet, rain ? 1 : 0); gl.uniform3fv(P.U.uEye, eye);
      gl.uniform3f(P.U.uEmit, 0, 0, 0);
    };
    plainCommon();
    gl.uniform3fv(P.U.uC, L.pave.map((c) => c * (night ? 1.6 : 0.8))); gl.uniform1f(P.U.uMode, 1); gl.uniform1f(P.U.uA, 1);
    gl.uniformMatrix4fv(P.U.uM, false, mat4(I3, [0, 0, -1.5]));
    gl.bindVertexArray(V.ground.vao); gl.drawArrays(gl.TRIANGLES, 0, V.ground.count);

    const figs = people.map((p) => {
      const c = bk.clips[$('clip').value === 'mixed' ? p.clip : $('clip').value];
      const hd = $('spin').checked ? t * 0.6 + p.x : p.face ? -p.x * 0.4 : 0.3 - p.x * 0.1;
      const hunch = built ? 0 : cold ? 0.16 : rain && !p.brolly ? 0.08 : p.order === 3 ? 0.06 : 0;
      return { p, c, ph: t / c.dur + p.ph, hd, x: p.x, z: p.z, g: built ? 1 : p.girth, ht: built ? 1 : p.height, hunch,
        holds: !built && rain && p.brolly };
    });

    if (!built && $('shadows').checked) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      gl.uniform1f(P.U.uMode, 2);
      gl.bindVertexArray(V.disc.vao);
      const yaw = Math.atan2(-K[0], -K[2]);
      for (const f of figs) {
        gl.uniform1f(P.U.uA, night ? 0.5 : rain ? 0.4 : 0.55);
        const A = m3(rotY3(yaw), [0.26 * f.g, 0, 0, 0, 1, 0, 0, 0, 0.42]);
        gl.uniformMatrix4fv(P.U.uM, false, mat4(A, [f.x - K[0] * 0.08, 0.003, f.z - K[2] * 0.08]));
        gl.drawArrays(gl.TRIANGLES, 0, V.disc.count);
        if (f.holds) {
          gl.uniform1f(P.U.uA, 0.22);
          gl.uniformMatrix4fv(P.U.uM, false, mat4(I3, [f.x, 0.004, f.z], 0.55));
          gl.drawArrays(gl.TRIANGLES, 0, V.disc.count);
        }
      }
      gl.depthMask(true); gl.disable(gl.BLEND);
    }

    const B = V.body, U = B.U;
    gl.useProgram(B.p); gl.bindVertexArray(V.vao);
    setAnchors(gl, U);
    gl.uniformMatrix4fv(U.uVP, false, vp);
    gl.uniform3fv(U.uEye, eye);
    gl.uniform3fv(U.uKey, K); gl.uniform3fv(U.uKeyC, L.keyC); gl.uniform3fv(U.uSky, L.sky); gl.uniform3fv(U.uGnd, L.gnd);
    gl.uniform3fv(U.uRimC, L.rim.map((c) => c * (night ? 0.8 : 0.5)));
    gl.uniform1f(U.uTop, TOP); gl.uniform1f(U.uNight, night ? 1 : 0);
    gl.uniform1i(U.uW, bk.W); gl.uniform1i(U.uRows, bk.rows); gl.uniform1i(U.uIdle0, IDLE0);
    gl.uniform3fv(U.uHoldS, HOLD.S); gl.uniform3fv(U.uHoldE, HOLD.E); gl.uniform3f(U.uHoldA, HOLD.elbow, HOLD.shoulder, HOLD.inward);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, V.posT); gl.uniform1i(U.uPosT, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, V.nrmT); gl.uniform1i(U.uNrmT, 1);
    const c3 = (u, rgb, k = 1) => gl.uniform3f(u, rgb[0] / 255 * k, rgb[1] / 255 * k, rgb[2] / 255 * k);
    const extras = [];
    for (const f of figs) {
      const p = f.p, o = built ? p.base : p.o, O = ORDERS[p.order];
      gl.uniform4f(U.uClip, f.c.row0, f.c.len, f.ph, 0);
      gl.uniform3f(U.uAt, f.x, 0, f.z);
      gl.uniform1f(U.uHd, f.hd);
      gl.uniform3f(U.uShape, f.g, f.ht, f.hunch);
      gl.uniform1f(U.uSeed, p.seed);
      gl.uniform1f(U.uNew, built ? 0 : 1);
      gl.uniform1i(U.uOrder, built ? 0 : p.order);
      gl.uniform1i(U.uBody, built ? 0 : p.body);
      gl.uniform1f(U.uFlare, !built && p.body === 4 ? 1 : 0);
      const fh = frameOf(f.c, f.ph, FR.head), fL = frameOf(f.c, f.ph, FR.handL), fR = frameOf(f.c, f.ph, FR.handR);
      gl.uniformMatrix3fv(U.uHeadR, false, colMajor(fh.R));
      gl.uniformMatrix3fv(U.uHandLR, false, colMajor(fL.R));
      gl.uniformMatrix3fv(U.uHandRR, false, colMajor(fR.R));
      const armOff = sub(posAt(f.c, f.ph, SHOULDER_V), R3(SHOULDER_V));
      gl.uniform1f(U.uHold, f.holds ? 1 : 0);
      gl.uniform3fv(U.uArmOff, armOff);
      const hood = !built && p.order !== 5 && (p.order === 3 || (rain && !p.brolly && !p.cap && p.order !== 4) || (cold && p.hoodR < 0.5 && !p.cap));
      gl.uniform1f(U.uHood, hood ? 1 : 0);
      gl.uniform1i(U.uHairStyle, built ? 0 : p.hairStyle ?? O.hairStyle);
      gl.uniform2fv(U.uCollar, built ? [0, 1] : O.collar);
      gl.uniform1f(U.uMatOn, matOn);
      gl.uniform3fv(U.uMats, p.mats);
      c3(U.uShirt, [236, 234, 226]);
      gl.uniform1f(U.uEarPoint, !built && p.earPoint ? 1 : 0);
      gl.uniform1f(U.uScarf, !built && p.scarf && (p.order === 2 || cold) ? 1 : 0);
      gl.uniform1f(U.uWet, !built && rain ? (f.holds ? 0.3 : 1) : 0);
      gl.uniform1f(U.uCyber, p.cyber ? 1 : 0);
      gl.uniform1f(U.uAge, p.age); gl.uniform1f(U.uBrow, p.brow); gl.uniform1f(U.uMood, p.mood);
      gl.uniform1f(U.uBeard, p.beard); gl.uniform1f(U.uImplant, p.implant ? 1 : 0); gl.uniform1f(U.uClaws, p.claws ? 1 : 0);
      gl.uniform1i(U.uGlove, p.glove); gl.uniform1i(U.uStrap, p.strap);
      gl.uniform1f(U.uMakeup, p.makeup ? 1 : 0); c3(U.uLipTint, p.lipTint);
      c3(U.uCoat, o.coat); c3(U.uLegs, o.legs); c3(U.uSkin, o.skin); c3(U.uHair, o.hair); c3(U.uShoe, o.shoes);
      c3(U.uAcc, p.acc); c3(U.uGlow, p.glow, night ? 1 : 0.6); c3(U.uIris, p.iris);
      gl.drawElements(gl.TRIANGLES, bk.idx.length, gl.UNSIGNED_SHORT, 0);
      if (built) continue;
      const grey = sstep(0.6, 1.0, p.age) * 0.7, hairC = p.o.hair.map((c) => c + (153 - c) * grey);
      if (p.cap) extras.push({ mesh: V.cap, M: attach(f, fh), col: p.capC });
      if (p.order === 4) extras.push({ mesh: V.horns, M: attach(f, fh), col: [255, 255, 255] });
      if (p.phones) extras.push({ mesh: V.phones, M: attach(f, fh), col: [255, 255, 255], emit: [0.2, 1, 0.4] });
      if (p.bun && !hood) extras.push({ mesh: V.bun, M: attach(f, fh), col: hairC });
      if (p.prop === 'tablet') extras.push({ mesh: V.tablet, M: attach(f, fL), col: [255, 255, 255], emit: p.glow.map((c) => (c / 255) * 0.55) });
      if (p.prop === 'rifle' || p.prop === 'pack' || p.prop === 'radio') extras.push({ mesh: V[p.prop], M: attach(f, frameOf(f.c, f.ph, FR.torso)), col: [255, 255, 255], emit: [1, 0.15, 0.1] });
      if (f.holds) {
        const hr = add(holdPoint(ANCHOR.handR), armOff);
        extras.push({ mesh: V.umb, M: mat4(m3(rotY3(f.hd), rotX3(-0.28)), place(hr, f, 0.8, true)), col: p.brollyC });
      }
    }

    if (extras.length) {
      plainCommon();
      gl.uniform1f(P.U.uMode, 0); gl.uniform1f(P.U.uA, 1);
      for (const e of extras) {
        c3(P.U.uC, e.col);
        gl.uniform3fv(P.U.uEmit, e.emit || [0, 0, 0]);
        gl.bindVertexArray(e.mesh.vao);
        gl.uniformMatrix4fv(P.U.uM, false, e.M);
        gl.drawArrays(gl.TRIANGLES, 0, e.mesh.count);
      }
    }

    if (rain || cold) {
      plainCommon();
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      gl.uniform1f(P.U.uMode, 0.7);
      gl.uniformMatrix4fv(P.U.uM, false, mat4(I3, [0, 0, 0]));
      gl.uniform3fv(P.U.uC, rain ? (night ? L.street.map((c) => 0.35 + c * 0.35) : [0.75, 0.8, 0.88]) : [0.97, 0.98, 1]);
      gl.uniform1f(P.U.uA, rain ? 0.35 : 0.9);
      gl.bindVertexArray(V.streakVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, V.streaks);
      gl.bufferData(gl.ARRAY_BUFFER, weatherVerts(weather, t), gl.STREAM_DRAW);
      gl.drawArrays(gl.LINES, 0, DROPS.length * 2);
      gl.depthMask(true); gl.disable(gl.BLEND);
    }
    gl.bindVertexArray(null);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
