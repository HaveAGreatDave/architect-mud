<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actor Lab</title>
<style>
  :root { --bg: #0b0d14; --fg: #d8d4c8; --dim: #8a8678; --line: #23263a; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  header b { color: #e8c070; letter-spacing: 0.2em; }
  label { color: var(--dim); white-space: nowrap; }
  label input, label select { vertical-align: middle; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .view { position: relative; }
  .view canvas { width: 100%; height: 80vh; display: block; }
  .view span { position: absolute; left: 12px; top: 10px; font-size: 12px; letter-spacing: 0.25em; text-shadow: 0 0 4px #000; }
  #w span { color: #8fb4ff; }
  #e span { color: #f0a848; }
  @media (max-width: 800px) { #views { grid-template-columns: 1fr; } .view canvas { height: 46vh; } }
</style>
</head>
<body>
<header>
  <b>ACTOR LAB</b>
  <label><input type="checkbox" id="built"> as built</label>
  <label>weather <select id="weather"><option>clear</option><option selected>rain</option><option>cold</option></select></label>
  <label><input type="checkbox" id="night" checked> night</label>
  <label><input type="checkbox" id="shadows" checked> contact shadows</label>
  <label>clip <select id="clip"><option>mixed</option><option>walk</option><option>idle</option></select></label>
  <label><input type="checkbox" id="spin"> turntable</label>
  <label>zoom <input type="range" id="zoom" min="2" max="9" step="0.1" value="5.4"></label>
  <label>seed <input type="number" id="seed" value="7" style="width:4em"></label>
</header>
<div id="views">
  <div class="view" id="w"><canvas id="a"></canvas><span>WEST · ASCENDANT QUARTER</span></div>
  <div class="view" id="e"><canvas id="b"></canvas><span>EAST · LONG WATCH GROUND</span></div>
</div>
<script type="module">
// A look at the street figures (client/game/js/panels/actor3d.js), dressed by district. The west
// street is mostly Ascendants with a few Null, the east mostly Long Watch with some Wildblood. Both
// read the real bake, so they draw the mesh the game does. "as built" draws the look that ships.
//
// An order's dress is the street's, never the NPC's: a figure in the west wears the west's colours
// because of where it walks, which says nothing about who it is (see ACTOR_OUTFITS in actor3d.js).
//
// What this page fakes that the real thing would bake:
//   the held arm   the right arm re-posed in the vertex shader from its rest shape. The real thing is
//                  a hold clip layered over walk and idle, baked like the others.
//   body types     cut, flared or ragged from the one coat. The real thing is a vertex range per body.
//   caps, horns,   small meshes placed each frame at the head or hand vertex, where a rigid part on
//   umbrellas      the head or hand bone would sit.
import { actorBake, actorOutfit } from '/client/game/js/panels/actor3d.js';

const bk = actorBake();
const TOP = bk.top;
const N = 7;
const IDLE0 = bk.clips.idle.row0;
const rest = bk.preview.subarray(IDLE0 * bk.nv * 3, (IDLE0 + 1) * bk.nv * 3);
const R3 = (v) => [rest[v * 3], rest[v * 3 + 1], rest[v * 3 + 2]];
const nearest = (test, x, y, z) => {
  let best = -1, bd = Infinity;
  for (let v = 0; v < bk.nv; v++) {
    if (!test(v)) continue;
    const d = Math.hypot(rest[v * 3] - x, rest[v * 3 + 1] - y, rest[v * 3 + 2] - z);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
};

// The coat's pieces. The lofts are separate, so a union-find over the triangles splits the torso
// from each sleeve. part = 1 is the coat's body; arm = 1 is the right sleeve and the right hand.
const part = new Float32Array(bk.nv), arm = new Float32Array(bk.nv);
{
  const up = new Int32Array(bk.nv).map((_, i) => i);
  const find = (i) => { while (up[i] !== i) i = up[i] = up[up[i]]; return i; };
  for (let t = 0; t < bk.idx.length; t += 3) {
    const a = bk.idx[t], b = bk.idx[t + 1], c = bk.idx[t + 2];
    if (bk.mat[a] !== 1) continue;
    up[find(b)] = find(a); up[find(c)] = find(a);
  }
  const coat = (v) => bk.mat[v] === 1;
  const torso = find(nearest(coat, 0, 1.2, 0.12));
  const sleeve = find(nearest((v) => coat(v) && find(v) !== torso, -0.2, 1.25, -0.01));
  for (let v = 0; v < bk.nv; v++) {
    const [x, y] = R3(v);
    part[v] = coat(v) && find(v) === torso ? 1 : 0;
    arm[v] = (coat(v) && find(v) === sleeve) || (bk.mat[v] === 0 && x < -0.12 && y > 0.68 && y < 0.92) ? 1 : 0;
  }
}
const SHOULDER_V = nearest((v) => arm[v] && bk.mat[v] === 1, -0.195, 1.43, -0.01);
const HAND_V = nearest((v) => arm[v] && bk.mat[v] === 0, -0.19, 0.8, 0.0);
const HEAD_V = nearest((v) => bk.mat[v] === 4, 0, TOP, 0);

function posAt(c, ph, v) {
  const fr = (((ph % 1) + 1) % 1) * c.len, f0 = Math.floor(fr), f1 = (f0 + 1) % c.len, t = fr - f0;
  const a = (c.row0 + f0) * bk.nv * 3 + v * 3, b = (c.row0 + f1) * bk.nv * 3 + v * 3, P = bk.preview;
  return [0, 1, 2].map((i) => P[a + i] + (P[b + i] - P[a + i]) * t);
}

// The hold: the forearm folds up at the elbow, the upper arm comes a little forward and in. The
// same numbers drive the shader and holdPoint below, so the umbrella lands in the hand.
const HOLD = { S: [-0.195, 1.40, -0.01], E: [-0.195, 1.10, -0.01], elbow: -1.45, shoulder: -0.22, inward: 0.3 };
const rotX = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), y = p[1] - o[1], z = p[2] - o[2]; return [p[0], o[1] + c * y - s * z, o[2] + s * y + c * z]; };
const rotZ = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + c * x - s * y, o[1] + s * x + c * y, p[2]]; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function holdPoint(r) {
  const fa = sstep(1.16, 1.04, r[1]);
  const f = rotX(r, HOLD.E, HOLD.elbow);
  let v = [r[0] + (f[0] - r[0]) * fa, r[1] + (f[1] - r[1]) * fa, r[2] + (f[2] - r[2]) * fa];
  v = rotX(v, HOLD.S, HOLD.shoulder);
  return rotZ(v, HOLD.S, HOLD.inward);
}
// A mesh-space point through the figure's shape and heading, as VERT does it.
function place(p, fig, restY, held) {
  let [x, y, z] = p;
  const band = sstep(0.35, 0.6, restY) * (1 - sstep(1.35, 1.5, restY));
  x *= 1 + (fig.g - 1) * band; z *= 1 + (fig.g - 1) * band * 0.8;
  const s = fig.hunch * sstep(0.95, TOP * 0.85, held ? 1.4 : restY);
  [x, y, z] = rotX([x, y, z], [0, 0.95, 0], s);
  x *= fig.ht; y *= fig.ht; z *= fig.ht;
  const ch = Math.cos(fig.hd), sh = Math.sin(fig.hd);
  return [ch * x + sh * z + fig.x, y, -sh * x + ch * z + fig.z];
}

const VERT = `#version 300 es
precision highp float;
precision highp int;
in float aMat;
in vec3 aRest;
in float aPart;
in float aArm;
uniform highp sampler2D uPosT;
uniform highp sampler2D uNrmT;
uniform int uW;
uniform int uRows;
uniform int uIdle0;
uniform mat4 uVP;
uniform vec4 uClip;
uniform vec3 uAt;
uniform float uHd;
uniform vec3 uShape;
uniform float uTop;
uniform float uFlare;
uniform float uHold;
uniform vec3 uArmOff;
uniform vec3 uHoldS;
uniform vec3 uHoldE;
uniform vec3 uHoldA;
out vec3 vN;
out vec3 vW;
out vec3 vRest;
out float vPart;
out float vArm;
flat out int vMat;
ivec2 texel(int f) { return ivec2(gl_VertexID % uW, f * uRows + gl_VertexID / uW); }
vec3 rotX(vec3 p, vec3 o, float a) { float c = cos(a), s = sin(a); vec3 q = p - o; return o + vec3(q.x, c * q.y - s * q.z, s * q.y + c * q.z); }
vec3 rotZ(vec3 p, vec3 o, float a) { float c = cos(a), s = sin(a); vec3 q = p - o; return o + vec3(c * q.x - s * q.y, s * q.x + c * q.y, q.z); }
void main() {
  float fr = fract(uClip.z) * uClip.y;
  int f0 = int(fr);
  int f1 = f0 + 1;
  if (float(f1) >= uClip.y) f1 = 0;
  float t = fr - float(f0);
  int b = int(uClip.x + 0.5);
  vec3 p = mix(texelFetch(uPosT, texel(b + f0), 0).xyz, texelFetch(uPosT, texel(b + f1), 0).xyz, t);
  vec3 n = mix(texelFetch(uNrmT, texel(b + f0), 0).xyz, texelFetch(uNrmT, texel(b + f1), 0).xyz, t);
  bool held = uHold > 0.5 && aArm > 0.5;
  if (held) {
    // The held arm starts from its rest shape, not the clip, so it does not swing, then rides the
    // shoulder wherever the clip has put it.
    vec3 r = aRest;
    vec3 rn = texelFetch(uNrmT, texel(uIdle0), 0).xyz;
    float fa = smoothstep(1.16, 1.04, r.y);
    r = mix(r, rotX(r, uHoldE, uHoldA.x), fa);
    rn = normalize(mix(rn, rotX(rn, vec3(0.0), uHoldA.x), fa));
    r = rotZ(rotX(r, uHoldS, uHoldA.y), uHoldS, uHoldA.z);
    rn = rotZ(rotX(rn, vec3(0.0), uHoldA.y), vec3(0.0), uHoldA.z);
    p = r + uArmOff;
    n = rn;
  }
  float fl = uFlare * aPart * smoothstep(0.92, 0.62, aRest.y);
  p.x *= 1.0 + fl * 0.45;
  p.z *= 1.0 + fl * 0.4;
  float band = smoothstep(0.35, 0.6, aRest.y) * (1.0 - smoothstep(1.35, 1.5, aRest.y));
  p.x *= mix(1.0, uShape.x, band);
  p.z *= mix(1.0, uShape.x, band * 0.8);
  float s = uShape.z * smoothstep(0.95, uTop * 0.85, held ? 1.4 : aRest.y);
  p = rotX(p, vec3(0.0, 0.95, 0.0), s);
  n = rotX(n, vec3(0.0), s);
  p *= uShape.y;
  float ch = cos(uHd), sh = sin(uHd);
  vec3 w = vec3(ch * p.x + sh * p.z, p.y, -sh * p.x + ch * p.z) + uAt;
  vN = vec3(ch * n.x + sh * n.z, n.y, -sh * n.x + ch * n.z);
  vW = w;
  vRest = aRest;
  vPart = aPart;
  vArm = aArm;
  vMat = int(aMat + 0.5);
  gl_Position = uVP * vec4(w, 1.0);
}`;

// Orders: 0 the look as built, 1 Ascendant, 2 Long Watch, 3 Null, 4 Wildblood.
const FRAG = `#version 300 es
precision highp float;
in vec3 vN;
in vec3 vW;
in vec3 vRest;
in float vPart;
in float vArm;
flat in int vMat;
uniform vec3 uCoat;
uniform vec3 uLegs;
uniform vec3 uSkin;
uniform vec3 uHair;
uniform vec3 uShoe;
uniform vec3 uAcc;
uniform vec3 uGlow;
uniform vec3 uKey;
uniform vec3 uKeyC;
uniform vec3 uSky;
uniform vec3 uGnd;
uniform vec3 uRimC;
uniform vec3 uEye;
uniform float uSeed;
uniform float uTop;
uniform int uOrder;
uniform int uBody;
uniform float uHood;
uniform float uScarf;
uniform float uWet;
uniform float uCyber;
out vec4 outColor;
float h1(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h1(i), h1(i + vec3(1, 0, 0)), f.x), mix(h1(i + vec3(0, 1, 0)), h1(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h1(i + vec3(0, 0, 1)), h1(i + vec3(1, 0, 1)), f.x), mix(h1(i + vec3(0, 1, 1)), h1(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float line(float x, float w) { return 1.0 - smoothstep(0.0, w, abs(x)); }
// Bump from a height field in world units, by screen derivatives: folds, straps and weave without
// a normal map.
vec3 bump(vec3 n, vec3 p, float h) {
  vec3 dx = dFdx(p), dy = dFdy(p);
  float hx = dFdx(h), hy = dFdy(h);
  vec3 r1 = cross(dy, n), r2 = cross(n, dx);
  float det = dot(dx, r1);
  vec3 g = sign(det) * (hx * r1 + hy * r2);
  return normalize(abs(det) * n - g);
}
void main() {
  int m = vMat;
  vec3 r = vRest;
  float ang = atan(r.x, r.z);
  float grime = vnoise(r * 18.0 + uSeed) * 0.6 + vnoise(r * 55.0 + uSeed) * 0.4;
  float hem = uBody == 1 ? 0.86 : uBody == 2 ? 0.87 : uBody == 3 ? 0.93 : -1.0;
  if (uOrder == 4) hem = 0.64 + 0.07 * vnoise(vec3(ang * 4.0, uSeed, 0.0)) + 0.03 * vnoise(vec3(ang * 19.0, 1.0, uSeed));
  if (vPart > 0.5 && r.y < hem) discard;
  vec3 col = m == 0 ? uSkin : m == 1 ? uCoat : m == 2 ? uLegs : m == 3 ? uShoe
           : m == 4 ? uHair : m == 5 ? vec3(0.035) : uSkin * vec3(0.78, 0.55, 0.55);
  bool skinLike = m == 0 || m == 6;
  bool face = r.z > 0.045 && r.y < uTop - 0.03 && r.y > uTop - 0.2;
  float neck = uTop * 0.835;
  vec3 glow = vec3(0.0);
  float h = 0.0;
  float rough = 1.0;
  if (uOrder == 0) {
    if (m == 1) {
      float front = step(0.0, r.z);
      col *= 1.0 - 0.45 * line(r.x, 0.006) * front;
      col *= 1.0 - 0.35 * line(r.y - 0.88, 0.004) * step(0.05, abs(r.x)) * step(abs(r.x), 0.15) * front;
      col = mix(col, col * vec3(0.62, 0.55, 0.45), (1.0 - smoothstep(0.55, 1.0, r.y)) * grime * 0.8);
    } else if (m == 2) {
      col = mix(col, vec3(0.2, 0.17, 0.13), (1.0 - smoothstep(0.03, 0.18, r.y)) * grime * 0.6);
    }
  } else {
    // Cloth: long folds below the waist, a finer weave everywhere.
    if (m == 1 && vArm < 0.5) h += 0.0035 * sin(ang * 9.0 + vnoise(r * 5.0 + uSeed) * 4.0) * (1.0 - smoothstep(0.6, 1.02, r.y));
    if (m == 1 && vArm > 0.5) h += 0.0015 * sin(r.y * 70.0 + vnoise(r * 9.0) * 3.0);
    if (m == 2) h += 0.0018 * sin(r.y * 55.0 + vnoise(r * 7.0 + uSeed) * 5.0) * line(r.y - 0.25, 0.22);
    h += vnoise(r * 260.0) * 0.00035;
    if (uOrder == 1) {
      // Ascendant: clean pale coat, a high collar, lit piping on the front edge and the hem, an
      // eye implant, sometimes a machined hand.
      rough = 0.35;
      if (skinLike && r.y < neck + 0.06 && r.y > neck - 0.03 && !face) { col = uCoat; m = 1; }
      if (m == 1) {
        float front = step(0.02, r.z);
        float edge = line(r.x - 0.012, 0.004) * front * step(r.y, neck);
        float hemLine = line(r.y - 0.645, 0.006) * vPart;
        float cuff = line(r.y - 0.9, 0.005) * vArm;
        glow += uGlow * (edge + hemLine + cuff) * 1.6;
        col *= 1.0 - 0.18 * line(r.y - 1.02, 0.01) * vPart;
        h -= 0.0012 * line(r.x - 0.012, 0.01) * front;
        col *= 1.0 - 0.1 * line(abs(r.x) - 0.12, 0.004) * front * step(0.9, r.y);
      }
      if (m == 2) col *= 1.0 + 0.25 * line(abs(r.x) - 0.12, 0.006);
      if (m == 3) { rough = 0.2; col *= 0.9; }
      if (skinLike && r.x > 0.035 && r.x < 0.09 && r.z > 0.05 && r.y > uTop - 0.12 && r.y < uTop - 0.075) {
        col = vec3(0.15, 0.16, 0.2);
        glow += uGlow * line(r.y - (uTop - 0.1), 0.006) * 2.5;
      }
      if (uCyber > 0.5 && skinLike && vArm > 0.5) {
        col = vec3(0.05, 0.05, 0.07);
        rough = 0.15;
        glow += uGlow * line(fract(r.y * 45.0) - 0.5, 0.06) * 1.2;
      }
    } else if (uOrder == 2) {
      // Long Watch: a weathered trench, webbing across the chest, a belt with pouches, a scarf.
      if (m == 1) {
        float wear = smoothstep(0.55, 0.8, vnoise(r * 22.0 + uSeed));
        col = mix(col, col * 1.35 + 0.02, wear * 0.5);
        col = mix(col, col * vec3(0.55, 0.5, 0.42), (1.0 - smoothstep(0.62, 1.0, r.y)) * grime);
        float strap = line(r.x + (r.y - 1.18) * 0.75, 0.02) * step(0.95, r.y) * step(r.y, 1.43) * vPart;
        float belt = line(r.y - 0.985, 0.022) * vPart;
        float pouch = belt * step(0.5, fract(ang * 1.6 + 0.2)) * step(r.z, 0.0);
        col = mix(col, uAcc, max(strap, belt));
        h += 0.004 * (strap + belt) + 0.006 * pouch;
        col += vec3(0.25, 0.22, 0.12) * line(r.y - 0.985, 0.006) * line(r.x, 0.018) * step(0.0, r.z);
        col *= 1.0 - 0.35 * line(r.x - 0.03, 0.005) * step(0.0, r.z) * step(0.7, r.y);
      }
      if (m == 2) col = mix(col, col * 0.6, (1.0 - smoothstep(0.02, 0.3, r.y)) * grime);
      if (m == 3) { col = mix(col, uAcc * 0.8, step(0.05, r.y)); h += 0.002 * line(fract(r.y * 40.0) - 0.5, 0.1) * step(0.06, r.y); }
      if (skinLike) col *= 0.9 + 0.1 * vnoise(r * 40.0 + 3.0);
      // Stubble.
      if (skinLike && face && r.y < uTop - 0.12) col *= 0.75 + 0.25 * vnoise(r * 400.0);
    } else if (uOrder == 3) {
      // Null: black hoodie, hood always up, cans over the ears, one green lamp.
      rough = 0.8;
      if (m == 1) {
        float front = step(0.0, r.z);
        float pouch = step(0.93, r.y) * step(r.y, 1.06) * step(abs(r.x), 0.11) * front;
        col *= 1.0 - 0.4 * pouch * (line(r.y - 1.06, 0.006) + line(abs(r.x) - 0.11, 0.006));
        h += 0.002 * pouch;
        col = mix(col, vec3(0.6), line(abs(r.x) - 0.03, 0.004) * front * step(1.2, r.y) * step(r.y, neck));
        col *= 1.0 - 0.3 * line(r.y - 0.89, 0.012);
        glow += vec3(0.2, 1.0, 0.4) * line(length(r.xy - vec2(0.09, 1.25)), 0.008) * front * 2.0;
      }
      bool cup = length(vec2(abs(r.x) - 0.085, r.y - (uTop - 0.105))) < 0.04;
      if ((m == 4 || skinLike) && cup) { col = vec3(0.12, 0.12, 0.13); rough = 0.3; m = 7; }
    } else if (uOrder == 4) {
      // Wildblood: a red cloak with a ragged hem, a woven band at its edge, marked skin, teeth.
      rough = 0.9;
      if (m == 1) {
        col = mix(col, col * 1.3, smoothstep(0.5, 0.9, vnoise(r * 14.0 + uSeed)) * 0.4);
        float band = step(abs(r.y - hem - 0.05), 0.035) * vPart;
        col = mix(col, uAcc, band * step(0.5, fract(ang * 6.0 + r.y * 40.0)));
        h += 0.002 * band;
        col = mix(col, col * 0.55, (1.0 - smoothstep(0.64, 0.95, r.y)) * grime * 0.8);
      }
      if (skinLike) {
        float spots = smoothstep(0.62, 0.7, vnoise(r * 70.0 + uSeed));
        col = mix(col, col * vec3(0.55, 0.4, 0.5), spots * (face ? 0.5 : 1.0));
      }
      if ((skinLike || m == 1) && abs(r.y - (neck - 0.035)) < 0.012 && r.z > 0.0) {
        col = mix(col, vec3(0.9, 0.86, 0.72), step(0.5, fract(ang * 8.0)));
        m = 8;
      }
    }
    if (uHood > 0.5 && (m == 4 || skinLike) && r.y > uTop - 0.2 && !face) {
      col = uCoat * (0.9 + 0.1 * vnoise(r * 60.0));
      if (r.y < uTop - 0.17) col *= 0.8;
      m = 7;
    }
    if (uScarf > 0.5 && (m == 1 || skinLike) && r.y > neck - 0.05 && r.y < neck + 0.035) {
      col = (uOrder == 2 ? vec3(0.12, 0.11, 0.1) : uAcc) * (0.8 + 0.2 * step(0.5, fract(r.y * 55.0)));
      h += 0.002 * vnoise(r * 80.0);
      m = 8;
    }
  }
  col *= 1.0 - 0.22 * uWet * step(0.5, float(m != 0 && m != 6));
  vec3 n = normalize(vN);
  if (uOrder != 0) n = bump(n, vW, h);
  float wrap = max(0.0, (dot(n, uKey) + 0.35) / 1.35);
  vec3 amb = mix(uGnd, uSky, n.y * 0.5 + 0.5);
  float ao = mix(0.55, 1.0, smoothstep(0.0, 0.3, r.y));

    gl.uniform3fv(U.uKey, K); gl.uniform3fv(U.uKeyC, L.keyC); gl.uniform3fv(U.uSky, L.sky); gl.uniform3fv(U.uGnd, L.gnd);
    gl.uniform3fv(U.uRimC, L.rim.map((c) => c * (night ? 0.8 : 0.5)));
    gl.uniform1f(U.uTop, TOP);
    gl.uniform1i(U.uW, bk.W); gl.uniform1i(U.uRows, bk.rows); gl.uniform1i(U.uIdle0, IDLE0);
    gl.uniform3fv(U.uHoldS, HOLD.S); gl.uniform3fv(U.uHoldE, HOLD.E); gl.uniform3f(U.uHoldA, HOLD.elbow, HOLD.shoulder, HOLD.inward);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, V.posT); gl.uniform1i(U.uPosT, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, V.nrmT); gl.uniform1i(U.uNrmT, 1);
    const c3 = (u, rgb, k = 1) => gl.uniform3f(u, rgb[0] / 255 * k, rgb[1] / 255 * k, rgb[2] / 255 * k);
    const extras = [];
    for (const f of figs) {
      const p = f.p, o = built ? p.base : p.o;
      gl.uniform4f(U.uClip, f.c.row0, f.c.len, f.ph, 0);
      gl.uniform3f(U.uAt, f.x, 0, f.z);
      gl.uniform1f(U.uHd, f.hd);
      gl.uniform3f(U.uShape, f.g, f.ht, f.hunch);
      gl.uniform1f(U.uSeed, p.seed);
      gl.uniform1i(U.uOrder, built ? 0 : p.order);
      gl.uniform1i(U.uBody, built ? 0 : p.body);
      gl.uniform1f(U.uFlare, !built && p.body === 4 ? 1 : 0);
      const armOff = posAt(f.c, f.ph, SHOULDER_V).map((v, i) => v - rest[SHOULDER_V * 3 + i]);
      gl.uniform1f(U.uHold, f.holds ? 1 : 0);
      gl.uniform3fv(U.uArmOff, armOff);
      const hood = !built && (p.order === 3 || (rain && !p.brolly && !p.cap && p.order !== 4) || (cold && p.hoodR < 0.5 && !p.cap));
      gl.uniform1f(U.uHood, hood ? 1 : 0);
      gl.uniform1f(U.uScarf, !built && p.scarf && (p.order === 2 || cold) ? 1 : 0);
      gl.uniform1f(U.uWet, !built && rain ? (f.holds ? 0.3 : 1) : 0);
      gl.uniform1f(U.uCyber, p.cyber ? 1 : 0);
      c3(U.uCoat, o.coat); c3(U.uLegs, o.legs); c3(U.uSkin, o.skin); c3(U.uHair, o.hair); c3(U.uShoe, o.shoes);
      c3(U.uAcc, p.acc); c3(U.uGlow, p.glow, night ? 1 : 0.6);
      gl.drawElements(gl.TRIANGLES, bk.idx.length, gl.UNSIGNED_SHORT, 0);
      if (built) continue;
      const head = place(posAt(f.c, f.ph, HEAD_V), f, TOP, false);
      if (p.cap) extras.push({ mesh: V.cap, at: head, yaw: f.hd, col: p.capC, sc: f.ht });
      if (p.order === 4) extras.push({ mesh: V.horns, at: head, yaw: f.hd, col: [150, 120, 84], sc: f.ht });
      if (f.holds) {
        const hr = holdPoint(R3(HAND_V)).map((v, i) => v + armOff[i]);
        extras.push({ mesh: V.umb, at: place(hr, f, 0.8, true), yaw: f.hd, tilt: -0.28, col: p.brollyC, sc: 1 });
      }
    }

    if (extras.length) {
      plainCommon();
      gl.uniform1f(P.U.uMode, 0); gl.uniform1f(P.U.uA, 1);
      for (const e of extras) {
        c3(P.U.uC, e.col);
        gl.bindVertexArray(e.mesh.vao);
        gl.uniformMatrix4fv(P.U.uM, false, model(e.at[0], e.at[1], e.at[2], e.sc, e.yaw, e.tilt || 0));
        gl.drawArrays(gl.TRIANGLES, 0, e.mesh.count);
      }
    }

    if (rain || cold) {
      plainCommon();
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      gl.uniform1f(P.U.uMode, 0.7);
      gl.uniformMatrix4fv(P.U.uM, false, model(0, 0, 0));
      gl.uniform3fv(P.U.uC, rain ? (night ? L.street.map((c) => 0.35 + c * 0.35) : [0.75, 0.8, 0.88]) : [0.97, 0.98, 1]);
      gl.uniform1f(P.U.uA, rain ? 0.35 : 0.9);
      gl.bindVertexArray(V.streakVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, V.streaks);
      gl.bufferData(gl.ARRAY_BUFFER, weatherVerts(weather, t), gl.STREAM_DRAW);
      gl.drawArrays(gl.LINES, 0, DROPS.length * 2);
      gl.depthMask(true); gl.disable(gl.BLEND);
    }
    gl.bindVertexArray(null);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
