<title>Architect MUD — Economy Report</title>
<style>
:root{
  --bg:#f4f5f3; --panel:#ffffff; --panel2:#eceeea; --line:#d8dcd5; --ink:#1d2420; --ink2:#5c6660; --ink3:#8a938c;
  --accent:#2e8574; --good:#4f7f54; --bad:#b4483e; --warn:#9a7020; --warn-bg:#f5ecdb;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300; --s5:#4a3aa7; /* validated categorical, fixed order */
  --mono:ui-monospace,Consolas,"Cascadia Code",Menlo,monospace;
  --sans:system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161b; --panel:#191f26; --panel2:#20262e; --line:#2b333c; --ink:#dde3de; --ink2:#8b968f; --ink3:#5f6a63;
  --accent:#4fb8a5; --good:#7fb885; --bad:#e0776c; --warn:#d9a441; --warn-bg:#302818;
  --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9;
}}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#191f26; --panel2:#20262e; --line:#2b333c; --ink:#dde3de; --ink2:#8b968f; --ink3:#5f6a63;
  --accent:#4fb8a5; --good:#7fb885; --bad:#e0776c; --warn:#d9a441; --warn-bg:#302818;
  --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9;
}
:root[data-theme="light"]{
  --bg:#f4f5f3; --panel:#ffffff; --panel2:#eceeea; --line:#d8dcd5; --ink:#1d2420; --ink2:#5c6660; --ink3:#8a938c;
  --accent:#2e8574; --good:#4f7f54; --bad:#b4483e; --warn:#9a7020; --warn-bg:#f5ecdb;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300; --s5:#4a3aa7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;align-items:baseline;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0}
header h1 span{color:var(--accent);font-family:var(--mono)}
.regen{margin-left:auto;color:var(--ink2);font-size:11.5px}
.regen code{font:11px var(--mono);background:var(--panel2);padding:1px 6px;border-radius:3px;color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:20px 24px}
h2{font-size:14px;margin:24px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.tile .v{font-size:22px;margin-top:2px}
.tile .v.pos{color:var(--good)} .tile .v.neg{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.empty{color:var(--ink2);font-style:italic;padding:18px;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:4px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
td.pos{color:var(--good)} td.neg{color:var(--bad)}
td.reason{font-family:var(--mono);font-size:12px}
.note{background:var(--warn-bg);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;padding:9px 12px;font-size:12.5px;color:var(--ink2);margin-top:10px;max-width:75ch}
.tblwrap{overflow-x:auto}
svg text{font:11px var(--sans);fill:var(--ink2)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--ink3);stroke-width:1}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:12px;display:none;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
<header>
  <h1><span>architect-mud</span> economy report</h1>
  <div class="regen">regenerate: <code>npm run db:economy-report</code> · prod: <code>node --env-file=.env.prod tools/economy-report/report.mjs</code></div>
</header>
<main id="main"></main>
<div id="tip"></div>
<script>
const D = /*__DATA__*/;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = n => (+n).toLocaleString('en-US');
const POOLS = [
  { key: 'player_credits', label: 'carried', c: 'var(--s1)' },
  { key: 'player_bank', label: 'banked', c: 'var(--s2)' },
  { key: 'org_treasury', label: 'org treasury', c: 'var(--s3)' },
  { key: 'vendor_credits', label: 'vendor floats', c: 'var(--s4)' },
  { key: 'atm_cash', label: 'ATM cash', c: 'var(--s5)' },
];
const tip = document.getElementById('tip');
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
const hideTip = () => tip.style.display = 'none';

// ---- stat tiles ----
const circulation = POOLS.reduce((a, p) => a + +D.current[p.key], 0);
const totalDrift = D.drift.reduce((a, d) => a + d.drift, 0);
const netFlow = D.reasons.reduce((a, r) => a + (+r.inflow || 0) + (+r.outflow || 0), 0);
let h = `<div class="tiles">
  <div class="tile"><div class="l">total circulation</div><div class="v">₵ ${fmt(circulation)}</div></div>
  <div class="tile"><div class="l">player carried + banked</div><div class="v">₵ ${fmt(+D.current.player_credits + +D.current.player_bank)}</div></div>
  <div class="tile"><div class="l">net ledgered flow (all time)</div><div class="v ${netFlow >= 0 ? 'pos' : 'neg'}">${netFlow >= 0 ? '+' : ''}${fmt(netFlow)}</div></div>
  <div class="tile"><div class="l">unattributed drift</div><div class="v ${totalDrift === 0 ? '' : 'neg'}">${fmt(totalDrift)}</div></div>
</div>`;

// ---- circulation over time (multi-series line) ----
h += `<h2>Circulation by pool</h2><div class="card" id="lineCard">`;
if (D.snapshots.length < 2) {
  h += `<div class="empty">Fewer than two daily snapshots so far — the economy-ledger plugin takes one per game-day rollover. Come back after a couple of days of uptime.</div>`;
} else {
  const W = 920, H = 260, P = { l: 56, r: 90, t: 12, b: 22 };
  const xs = D.snapshots.map(s => +s.created_at);
  const maxY = Math.max(...D.snapshots.flatMap(s => POOLS.map(p => +s[p.key]))) * 1.08 || 1;
  const X = t => P.l + (t - xs[0]) / (xs[xs.length - 1] - xs[0] || 1) * (W - P.l - P.r);
  const Y = v => H - P.b - v / maxY * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" id="lineSvg">`;
  for (let g = 0; g <= 4; g++) { const y = P.t + g * (H - P.t - P.b) / 4;
    svg += `<line class="grid" x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}"/><text x="${P.l - 6}" y="${y + 3}" text-anchor="end">${fmt(Math.round(maxY * (1 - g / 4)))}</text>`; }
  svg += `<line class="axis" x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}"/>`;
  for (const p of POOLS) {
    const pts = D.snapshots.map(s => `${X(+s.created_at).toFixed(1)},${Y(+s[p.key]).toFixed(1)}`).join(' ');
    const last = D.snapshots[D.snapshots.length - 1];
    svg += `<polyline points="${pts}" fill="none" stroke="${p.c}" stroke-width="2"/>` +
      `<text x="${W - P.r + 6}" y="${Y(+last[p.key]) + 3}" style="fill:${p.c};font-weight:600">${p.label}</text>`;
  }
  svg += `<rect id="lineHit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/></svg>`;
  h += `<div class="legend">${POOLS.map(p => `<span><i style="background:${p.c}"></i>${p.label}</span>`).join('')}</div>` + svg;
}
h += `</div>`;

// ---- faucet / sink signed bars ----
h += `<h2>Faucets vs sinks by source</h2><div class="card">`;
if (!D.reasons.length) {
  h += `<div class="empty">No ledger rows yet — rows appear as soon as credits move through adjustCredits (vendor trades, quest rewards, pay, rent…).</div>`;
} else {
  const maxAbs = Math.max(...D.reasons.map(r => Math.max(+r.inflow || 0, -(+r.outflow || 0)))) || 1;
  const rowH = 22, W = 920, mid = 470, span = 380;
  let svg = `<svg viewBox="0 0 ${W} ${D.reasons.length * rowH + 26}" style="width:100%;height:auto">`;
  svg += `<line class="axis" x1="${mid}" y1="0" x2="${mid}" y2="${D.reasons.length * rowH}"/>`;
  D.reasons.forEach((r, i) => {
    const y = i * rowH + 4, inW = (+r.inflow || 0) / maxAbs * span, outW = -(+r.outflow || 0) / maxAbs * span;
    svg += `<text x="${mid - outW - 8}" y="${y + 11}" text-anchor="end" class="blbl" data-i="${i}">${esc(r.reason)}</text>`;
    if (outW > 0) svg += `<rect class="bar" data-i="${i}" x="${mid - outW}" y="${y}" width="${outW}" height="14" rx="3" fill="var(--bad)"/>`;
    if (inW > 0) svg += `<rect class="bar" data-i="${i}" x="${mid + 2}" y="${y}" width="${Math.max(inW, 2)}" height="14" rx="3" fill="var(--good)"/>`;
    svg += `<text x="${mid + Math.max(inW, 2) + 8}" y="${y + 11}">${+r.inflow ? '+' + fmt(r.inflow) : ''}${+r.inflow && +r.outflow ? ' / ' : ''}${+r.outflow ? fmt(r.outflow) : ''}</text>`;
  });
  svg += `<text x="${mid - 8}" y="${D.reasons.length * rowH + 18}" text-anchor="end" style="fill:var(--bad)">← sinks</text>` +
         `<text x="${mid + 8}" y="${D.reasons.length * rowH + 18}" style="fill:var(--good)">faucets →</text></svg>`;
  h += svg;
  h += `<div class="tblwrap"><table><tr><th>source</th><th class="r">inflow</th><th class="r">outflow</th><th class="r">net</th><th class="r">events</th></tr>` +
    D.reasons.map(r => { const net = (+r.inflow || 0) + (+r.outflow || 0); return `<tr><td class="reason">${esc(r.reason)}</td><td class="r pos">${+r.inflow ? '+' + fmt(r.inflow) : '—'}</td><td class="r neg">${+r.outflow ? fmt(r.outflow) : '—'}</td><td class="r ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '+' : ''}${fmt(net)}</td><td class="r">${r.events}</td></tr>`; }).join('') + `</table></div>`;
}
h += `</div>`;

// ---- drift windows ----
h += `<h2>Unattributed drift (bypass paths)</h2><div class="card">`;
if (!D.drift.length) h += `<div class="empty">Needs at least two snapshots to compute.</div>`;
else h += `<div class="tblwrap"><table><tr><th>window</th><th class="r">Δ player pool</th><th class="r">ledgered</th><th class="r">drift</th></tr>` +
  D.drift.map(d => `<tr><td>${esc(d.from ?? '?')} → ${esc(d.to ?? '?')}</td><td class="r">${fmt(d.poolDelta)}</td><td class="r">${fmt(d.ledger)}</td><td class="r ${d.drift === 0 ? '' : 'neg'}">${fmt(d.drift)}</td></tr>`).join('') + `</table></div>`;
h += `<div class="note">Drift = credit flow through raw-SQL paths that bypass <b>economy.js</b> (flight, insurance, jail, gametable, surveillance, rent, clone-vat). Persistent nonzero drift is the migration worklist — move those paths onto adjustCredits to attribute them.</div></div>`;

// ---- top holders ----
h += `<h2>Top holders</h2><div class="card"><div class="tblwrap"><table><tr><th>player</th><th class="r">carried</th><th class="r">banked</th><th class="r">total</th></tr>` +
  D.holders.map(p => `<tr><td>${esc(p.handle)}</td><td class="r">${fmt(p.credits)}</td><td class="r">${fmt(p.bank_credits)}</td><td class="r">${fmt(p.total)}</td></tr>`).join('') + `</table></div></div>`;

document.getElementById('main').innerHTML = h;

// hover layers
document.querySelectorAll('.bar, .blbl').forEach(el => {
  el.addEventListener('mousemove', e => { const r = D.reasons[+el.dataset.i];
    showTip(e, `<b>${esc(r.reason)}</b><br>in +${fmt(r.inflow || 0)} · out ${fmt(r.outflow || 0)}<br>${r.events} events`); });
  el.addEventListener('mouseleave', hideTip);
});
const hit = document.getElementById('lineHit');
if (hit) {
  const xs = D.snapshots.map(s => +s.created_at);
  hit.addEventListener('mousemove', e => {
    const svg = document.getElementById('lineSvg'), box = svg.getBoundingClientRect();
    const fx = (e.clientX - box.left) / box.width * 920;
    const t = xs[0] + (fx - 56) / (920 - 56 - 90) * (xs[xs.length - 1] - xs[0]);
    let best = 0; for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - t) < Math.abs(xs[best] - t)) best = i;
    const s = D.snapshots[best];
    showTip(e, `<b>${esc(s.game_date ?? new Date(+s.created_at * 1000).toISOString().slice(0, 10))}</b><br>` +
      POOLS.map(p => `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${p.c};margin-right:4px"></i>${p.label}: ${fmt(s[p.key])}`).join('<br>'));
  });
  hit.addEventListener('mouseleave', hideTip);
}
</script>
