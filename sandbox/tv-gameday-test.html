<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV Gameday — visual test</title>
<link rel="stylesheet" href="../client/game/styles.css">
<style>
  html, body { margin: 0; background: radial-gradient(ellipse at 50% 20%, #202329, #0a0b0d 70%); }
  .stage { display: flex; flex-direction: column; gap: 18px; padding: 26px; align-items: center; }
  /* A minimal stand-in for #tv-window so the Gameday host + CSS vars resolve. */
  .frame {
    position: relative; width: 620px; aspect-ratio: 760 / 520;
    background: #061014; border-radius: 8px; overflow: hidden;
    border: 2px solid #2c3037; box-shadow: 0 0 0 3px #e6e9ee, 0 0 0 6px #70767e, 0 14px 40px rgba(0,0,0,.7);
    font-family: monospace;
  }
  .frame::before { content:'⚾ DEADBALL — CH 4'; color:#7fd6b0; font-size:11px; letter-spacing:2px; display:flex; align-items:center; padding:0 12px; position:absolute; top:0; left:0; right:0; height:45px; background:rgba(0,40,30,.5); border-bottom:1px solid rgba(0,220,180,.35); z-index:2; }
  .frame::after  { content:''; position:absolute; bottom:0; left:0; right:0; height:72px; background:rgba(0,20,15,.7); border-top:1px solid rgba(0,220,180,.35); z-index:2; }
  .label { color:#8fae9a; font-family:monospace; font-size:13px; letter-spacing:2px; }
  button { font-family:monospace; background:#0c1a14; color:#7fd6b0; border:1px solid #2e6a44; padding:6px 14px; border-radius:3px; cursor:pointer; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label">GAMEDAY SUB-SCREEN — cycles a half-inning of plays</div>
    <div id="tv-window" data-theme="crt" class="frame">
      <div id="tv-gameday" class="on"></div>
    </div>
    <button id="next">▶ Next play (click to enable sound)</button>
  </div>

  <!-- Classic script: sets window.AudioEngine so the Gameday SFX are audible here. -->
  <script src="../client/shared/audio-engine.js"></script>
  <script type="module">
    import { createGamedayView } from '../client/game/js/panels/gameday.js';
    const view = createGamedayView(document.getElementById('tv-gameday'));

    // A synthetic half-inning: bases advance play to play, a couple of runs score.
    const PLAYS = [
      { batter:'Volpe', pitcher:'Senga', kind:'strikeout', desc:'Strikeout', out:true, outs:0, rbi:0,
        caption:'Senga freezes Volpe with the high heater — strike three!',
        basesBefore:[false,false,false], basesAfter:[false,false,false], awayScore:3, homeScore:2,
        pitches:[{n:1,type:'Four-Seam Fastball',velo:97,x:0.5,y:0.45,result:'called',balls:0,strikes:1},
                 {n:2,type:'Slider',velo:85,x:0.7,y:0.6,result:'ball',balls:1,strikes:1},
                 {n:3,type:'Slider',velo:86,x:0.55,y:0.5,result:'swinging',balls:1,strikes:2},
                 {n:4,type:'Four-Seam Fastball',velo:98,x:0.5,y:0.5,result:'swinging',balls:1,strikes:3}] },
      { batter:'Judge', pitcher:'Senga', kind:'single', desc:'Single', out:false, outs:1, rbi:0,
        caption:'Judge lines one into right field for a base hit.',
        basesBefore:[false,false,false], basesAfter:[true,false,false], awayScore:3, homeScore:2,
        pitches:[{n:1,type:'Sinker',velo:93,x:0.3,y:0.6,result:'ball',balls:1,strikes:0},
                 {n:2,type:'Changeup',velo:86,x:0.5,y:0.5,result:'inplay',balls:1,strikes:0}] },
      { batter:'Soto', pitcher:'Senga', kind:'double', desc:'Double', out:false, outs:1, rbi:0,
        caption:'Soto rips it into the left-center gap — Judge to third!',
        basesBefore:[true,false,false], basesAfter:[false,false,true], awayScore:3, homeScore:2,
        pitches:[{n:1,type:'Curveball',velo:79,x:0.4,y:0.7,result:'ball',balls:1,strikes:0},
                 {n:2,type:'Four-Seam Fastball',velo:96,x:0.5,y:0.45,result:'called',balls:1,strikes:1},
                 {n:3,type:'Cutter',velo:90,x:0.55,y:0.55,result:'inplay',balls:1,strikes:1}] },
      { batter:'Stanton', pitcher:'Senga', kind:'homerun', desc:'Home Run — 2 RBI', out:false, outs:1, rbi:2,
        caption:'Stanton CRUSHES it — gone, way back, a three-run shot!',
        basesBefore:[false,false,true], basesAfter:[false,false,false], awayScore:5, homeScore:2,
        pitches:[{n:1,type:'Slider',velo:84,x:0.6,y:0.4,result:'ball',balls:1,strikes:0},
                 {n:2,type:'Four-Seam Fastball',velo:97,x:0.5,y:0.5,result:'inplay',balls:1,strikes:0}] },
      { batter:'Torres', pitcher:'Senga', kind:'groundout', desc:'Groundout', out:true, outs:2, rbi:0,
        caption:'Torres chops it to short — over to first, in time.',
        basesBefore:[false,false,false], basesAfter:[false,false,false], awayScore:5, homeScore:2,
        pitches:[{n:1,type:'Sinker',velo:94,x:0.5,y:0.6,result:'inplay',balls:0,strikes:0}] },
      { batter:'Wells', pitcher:'Senga', kind:'flyout', desc:'Flyout', out:true, outs:3, rbi:0,
        caption:'Wells lifts a lazy fly to center — Nimmo camps under it.',
        basesBefore:[false,false,false], basesAfter:[false,false,false], awayScore:5, homeScore:2,
        pitches:[{n:1,type:'Changeup',velo:85,x:0.45,y:0.4,result:'called',balls:0,strikes:1},
                 {n:2,type:'Four-Seam Fastball',velo:96,x:0.5,y:0.5,result:'inplay',balls:0,strikes:1}] },
    ].map(p => ({ ...p, battingTeam:'Yankees', fieldingTeam:'Mets', battingAbbr:'NYY', fieldingAbbr:'NYM', inning:3, inningOrd:'3rd', half:'top' }));

    let i = 0;
    const step = () => { const p = PLAYS[i % PLAYS.length]; view.apply(p); view.setCaption(p.caption || ''); i++; };
    step();
    // AudioEngine needs a user gesture to unlock the AudioContext — first click does it.
    document.getElementById('next').addEventListener('click', () => { window.AudioEngine?.init?.(); step(); });
    setInterval(step, 15000);   // realistic pacing — each at-bat plays out on the field over ~10–13s
  </script>
</body>
</html>
