services:
    - type: web
      name: architect-mud
      runtime: node
      plan: free
      buildCommand: npm install
      startCommand: npm start
      healthCheckPath: /health
      # Skip auto-deploys for pushes that don't change what the server runs.
      # Content pushes still reach Render: the deploy-content CI workflow calls
      # RENDER_DEPLOY_HOOK_URL after importing, and deploy hooks bypass this
      # filter — so the checkout (which serves content/audio_* from disk in
      # prod) is refreshed exactly when content changes. Every avoided reboot
      # saves a full world load from Neon (~10MB of egress).
      buildFilter:
          ignoredPaths:
              - content/**
              - docs/**
              - tools/**
              - tests/**
              - scripts/**
              - .github/**
      envVars:
          - key: DATABASE_URL
            sync: false # paste your Neon URL in the Render dashboard
          - key: NODE_ENV
            value: production
          - key: RENDER_EXTERNAL_URL
            sync: false # paste your full Render URL e.g. architect-mud.onrender.com
          # Cutover done (2026-07-08): prod content is read-only over HTTP — git is the
          # only writer of world content to production (deploy-content CI applies
          # content/ on push to main). Ops tools (player admin, weather/power, live
          # spawns…) stay live.
          - key: CONTENT_READONLY
            value: "1"
