services:
    - type: web
      name: architect-mud
      runtime: node
      plan: free
      buildCommand: npm install
      startCommand: npm start
      healthCheckPath: /health
      # ── ONE deploy trigger, not two (2026-07-26) ──
      # Render no longer watches the repo. The deploy-content CI workflow is the
      # single path to prod: it regress-gates, imports content to Neon, then POSTs
      # RENDER_DEPLOY_HOOK_URL — and deploy hooks fire regardless of this setting.
      #
      # Why: Render's own auto-deploy built on every server/plugins/client push —
      # ~1,078 code-touching commits a month against the Hobby plan's 500 build
      # minutes — and every build rebooted prod, disconnecting every player. The
      # CI schedule collapses a burst of commits into one 2-hourly reboot
      # (~150 builds/month). See the header of deploy-content.yml.
      #
      # NOTE: the live service (architect-mud-live) was created by hand, NOT from
      # this Blueprint, so nothing in this file is applied to it automatically —
      # auto-deploy is switched off in the dashboard (Settings → Build & Deploy).
      # Keep the two in sync if the service is ever re-adopted by the Blueprint.
      autoDeploy: false
      # Inert while autoDeploy is false. Kept deliberately: if auto-deploy is ever
      # switched back on, this stops it silently returning to a reboot-per-content-push.
      buildFilter:
          ignoredPaths:
              - content/**
              - docs/**
              - tools/**
              - tests/**
              - scripts/**
              - .github/**
      envVars:
          - key: DATABASE_URL
            sync: false # paste your Neon URL in the Render dashboard
          - key: NODE_ENV
            value: production
          - key: RENDER_EXTERNAL_URL
            sync: false # paste your full Render URL e.g. architect-mud.onrender.com
          # Base URL baked into the verify/reset links the mailer sends. Unset, it
          # falls back to http://localhost:3000 and every registration email ships
          # a dead link — silently, because nothing errors. Same host as
          # RENDER_EXTERNAL_URL (or the custom domain, once there is one).
          - key: CLIENT_BASE_URL
            sync: false
          # Transactional email (Brevo). Unset, registration "verification" is a
          # no-op that only logs the link server-side — accounts can never verify.
          - key: BREVO_API_KEY
            sync: false
          - key: SMTP_FROM_EMAIL
            sync: false # the verified Brevo sender address
          # Cutover done (2026-07-08): prod content is read-only over HTTP — git is the
          # only writer of world content to production (deploy-content CI applies
          # content/ on push to main). Ops tools (player admin, weather/power, live
          # spawns…) stay live.
          - key: CONTENT_READONLY
            value: "1"
