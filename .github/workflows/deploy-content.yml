# Content deploy — git is the source of truth for world content; this workflow is
# the ONLY writer of content to the production database.
#
# Flow: regress the merged tree against a throwaway Postgres built purely from
# content/ files → snapshot prod (instant Neon branch, self-expiring) → drift
# report (surfaces manual prod hotfixes this deploy would overwrite) → import
# (upserts + git-diff-driven deletions) → record a deployments row → kick Render
# so the game server reboots onto the new content.
#
# Rollback: `git revert` the bad content commit and push — the next run restores
# everything (reverted values re-upsert, added rows delete, deletions restore).
# Catastrophic: Neon instant-restore prod's default branch from the
# `predeploy-<run>-<sha>` snapshot branch created before the damaging run.
#
# ── THE ONLY PATH TO PROD (single trigger, 2026-07-26) ──
# Render's own auto-deploy is OFF (dashboard + `autoDeploy: false` in render.yaml),
# so this workflow's POST to RENDER_DEPLOY_HOOK_URL is the only thing that ever
# ships code OR content to production. That makes the "Restart Render service"
# step load-bearing, so it fails the job outright rather than warning.
#
# On the free instance a missed reboot is partly self-healing by luck: the service
# spins down when idle, and the next player's cold start reloads the fresh content
# from Neon. Do NOT rely on it — that rescue disappears the moment this moves to a
# paid instance, which never spins down, and a missed reboot then means prod serves
# a stale world until somebody notices by hand.
#
# Previously Render ALSO watched the repo and rebuilt on every server/plugins/
# client push — ~1,078 code-touching commits a month, peaking at 122 in a day,
# against the Hobby plan's 500 build minutes, each build disconnecting every
# player. Two independent triggers rebooting one service; `buildFilter` existed
# only to stop them fighting.
#
# ── DEBOUNCE: pushes validate, the schedule deploys ──
# Each deploy reboots Render, which cold-reloads the whole world from Neon. That
# was ~36MB when deploying per-push blew the 5GB/month transfer cap in July 2026,
# and ~4.7MB after prod moved the six audio tables onto the git checkout.
#
# ⚠ IT IS ~13.6MB NOW, AND THIS NUMBER GOES STALE ON ITS OWN. Measured 2026-08-29:
# zones 9.83MB over 17,263 rows, items 2.26MB, npcs 0.84MB, furniture 0.49MB, the
# rest under 0.2MB together. Nothing regressed — the WORLD GREW into the figure
# (the Scarletwastes alone added 4,836 tiles), and no test can catch that, because
# a bigger world is not a bug.
#
# Which matters because this comment is the arithmetic behind the schedule below.
# At 4.7MB, six deploys a day reads as ~850MB/month against a 5GB cap and looks
# like plenty of headroom; at 13.6MB it is ~2.5GB/month — half the cap on deploys
# alone, before a single player cold-starts the spun-down instance. The cap was
# exceeded again on 2026-08-28 and prod froze for four runs.
#
# Re-measure before trusting it, and before any change to the deploy cadence:
#   SELECT sum(pg_column_size(q.*)) FROM <table> q
# over the readTier:'boot' tables in server/models/content-registry.js (the audio_*
# tables are boot-tier there but are served from the checkout, so exclude them).
#
# So a push never deploys. It runs the regress gate — against a throwaway local
# Postgres, zero Neon egress — and STOPS. The deploy is debounced onto a
# schedule, collapsing a burst of commits into one reboot (~150 builds/month).
# Two escape hatches force an immediate deploy:
#   • put `[deploy]` anywhere in the commit message, or
#   • run this workflow by hand (Actions tab → deploy-content → Run workflow).
# See the `gate` job for the exact decision.
#
# `paths:` below covers code as well as content, which buys two things beyond
# batching: code pushes finally get a regress gate (they previously had NO checks
# at all), and `[deploy]` now works on a code-only commit. That last one used to
# fail SILENTLY — the token is read by the gate job, so a commit touching no
# `paths:` entry started no run and the token was never evaluated.
#
# ⚠ Still true: `git commit --allow-empty -m '… [deploy]'` touches nothing, so it
# starts no run and deploys nothing. Use the Run workflow button for that.
#
# Note the schedule ignores `paths:` entirely — a scheduled run deploys whatever
# is on main, judged only by sha, so code changes reach prod on the 4-hourly
# window whether or not they matched a path filter.
#
# Required repo secrets:
#   PROD_DATABASE_URL        — Neon connection string. Use the DIRECT (unpooled)
#                              endpoint, not the -pooler host: the import runs one
#                              transaction with SET CONSTRAINTS ALL DEFERRED.
#   NEON_API_KEY             — Neon API key (Account/Project settings → API keys).
#                              Used to create the pre-deploy snapshot branch. The
#                              project id is read from the committed `.neon` file,
#                              not a secret (it isn't sensitive).
#   RENDER_DEPLOY_HOOK_URL   — optional; Render → Settings → Deploy Hook. Restarts
#                              the service after import so the in-memory world
#                              cache is never stale.

name: deploy-content

on:
  workflow_dispatch:      # manual force: Actions tab → Run workflow
  schedule:
    # Debounced batch deploy, every 4 hours. ⚠ THE :37 IS LOAD-BEARING — DO NOT
    # "TIDY" IT BACK TO :00. GitHub dispatches `schedule` events best-effort from
    # a service shared by every repo on the platform, and the top of the hour is
    # its most oversubscribed minute (every `0 * * * *` and `0 0 * * *` job in the
    # world fires there). On `0 */2 * * *` this workflow was dispatched 29–106
    # minutes late, every single window, measured over 12 consecutive runs on
    # 2026-08-16/17. It was not runner starvation and not our `concurrency` group:
    # `createdAt` equalled `startedAt` on all 12, so the run did not exist yet —
    # nothing was queued, the event itself was simply delivered late. Worst was
    # the 00:00 UTC window at 106 minutes, which is the busiest cron minute
    # anywhere; the quiet evening windows still ran 29–38 minutes behind.
    #
    # An arbitrary off-peak minute is the standard mitigation. The interval is
    # unchanged in spirit (the minute is off-peak), and the interval is now 4 hours.
    #
    # If you change this minute, change `_windowBefore()` in
    # client/devpanel/js/panels/dashboard.js to match — the Deploy Window card
    # snaps to the boundary and will draw against the wrong one otherwise.
    - cron: '37 */4 * * *'
  push:
    branches: [main]
    # Pushes trigger a run so regress validates them; the gate job only lets the
    # deploy through on a schedule / force (see header). Code paths are included
    # so code pushes get a regress gate and can carry a `[deploy]` token — Render
    # no longer watches the repo, so nothing else validates or ships them.
    paths:
      - 'content/**'
      - 'server/**'
      - 'plugins/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/content/**'
      - '.github/workflows/deploy-content.yml'

# Two different jobs with opposite needs, so the group is chosen per run:
#   • a run that WILL deploy (schedule / dispatch / `[deploy]` push) joins the
#     serialized group and is never cancelled — never kill a half-applied deploy.
#   • a plain validation push is disposable: a newer push supersedes it, since its
#     tree is a superset. Without this, a 122-commit day would queue ~9-minute
#     regress runs back-to-back and the backlog would run for hours.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[deploy]'))
        && format('content-validate-{0}', github.ref)
        || 'prod-content-deploy' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[deploy]') }}

jobs:
  regress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: architect
          POSTGRES_PASSWORD: architect
          POSTGRES_DB: architect_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U architect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://architect:architect@localhost:5432/architect_ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # importer + deletion pass need history
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint content files
        run: npm run content:lint
      - name: Build the world from content files
        run: npm run content:import
      - name: Regression suite (world built purely from files)
        run: npm run test:regress

  # ── Debounce gate — decides whether THIS run actually deploys ──────────────
  #   push (no token)    → validate only; deploy waits for the schedule
  #   push with [deploy] → deploy now (force from a commit)
  #   workflow_dispatch  → deploy now (force button)
  #   schedule           → deploy the batch, UNLESS HEAD is already the live sha
  #                        (idle window — skip the pointless ~13.6MB reboot)
  # The sha comparison is content-agnostic, so this batches code changes too.
  gate:
    needs: regress
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          deploy=false; why=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            deploy=true; why="manual dispatch — force deploy"
          elif [ "$EVENT" = "push" ]; then
            if git log -1 --pretty=%B | grep -qF '[deploy]'; then
              deploy=true; why="[deploy] token in commit — force deploy"
            else
              why="content push validated; batched until the next 4-hourly deploy. Force with a [deploy] commit token or Run workflow."
            fi
          elif [ "$EVENT" = "schedule" ]; then
            npm ci >/dev/null 2>&1 || true
            # Fail-open: if the idle check can't run, deploy rather than risk
            # silently skipping a real change (empty $last never equals $GITHUB_SHA).
            last=$(node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.PROD_DATABASE_URL, ssl:{rejectUnauthorized:false}}); await c.connect(); const {rows}=await c.query(\"SELECT changes_summary->>'sha' AS sha FROM deployments WHERE deployed_by='ci' ORDER BY deployed_at DESC LIMIT 1\"); await c.end(); process.stdout.write(rows[0]?.sha||'');" || true)
            if [ "$last" = "$GITHUB_SHA" ]; then
              why="scheduled: HEAD ($GITHUB_SHA) already deployed — skipping the idle reboot"
            else
              deploy=true; why="scheduled batch deploy (last deployed: ${last:-none})"
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "→ $why"

  deploy:
    needs: [regress, gate]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prune old snapshot branches (keep newest 5)
        # expires_at self-cleans snapshots after 14 days, but at any real deploy
        # cadence they pile up past Neon's branch cap long before they expire. So
        # actively prune here: delete every predeploy-* branch beyond the newest 5,
        # which always leaves recent recovery points while keeping us under the cap.
        # Runs before the snapshot so this deploy's own branch never counts against
        # the keep-5. Best-effort: a prune failure must not block the deploy.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        continue-on-error: true
        run: |
          project_id=$(node -p "JSON.parse(require('fs').readFileSync('.neon','utf8')).projectId")
          curl -sS "https://console.neon.tech/api/v2/projects/${project_id}/branches" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${NEON_API_KEY}" > branches.json
          node --input-type=module -e "
          import fs from 'fs';
          const { branches } = JSON.parse(fs.readFileSync('branches.json','utf8'));
          const snaps = branches
            .filter(b => b.name.startsWith('predeploy-'))
            .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
          const stale = snaps.slice(5);
          console.log(\`\${snaps.length} snapshot branch(es); pruning \${stale.length}\`);
          for (const id of stale.map(b => b.id)) console.log(id);
          fs.writeFileSync('stale.txt', stale.map(b => b.id).join('\n'));
          "
          project_id=$(node -p "JSON.parse(require('fs').readFileSync('.neon','utf8')).projectId")
          while read -r id; do
            [ -z "$id" ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              "https://console.neon.tech/api/v2/projects/${project_id}/branches/${id}" \
              -H 'Accept: application/json' \
              -H "Authorization: Bearer ${NEON_API_KEY}")
            echo "delete ${id}: HTTP ${code}"
          done < stale.txt
      - name: Snapshot production (Neon branch)
        # Pre-deploy catastrophe net: an instant copy-on-write snapshot of prod
        # BEFORE we touch it. Data-only (no compute endpoint) so it's near-free;
        # expires_at self-cleans it after 14 days (mirrors the old artifact
        # retention). Recovery = Neon instant-restore prod's default branch from
        # this branch's history. Nothing sensitive ever leaves Neon, so — unlike
        # the old pg_dump-to-artifact — this runs safely on a public repo. Fail
        # the deploy if the snapshot can't be taken: never touch prod without a
        # recovery point.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          project_id=$(node -p "JSON.parse(require('fs').readFileSync('.neon','utf8')).projectId")
          expires_at=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)
          name="predeploy-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${project_id}/branches" \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"${name}\",\"expires_at\":\"${expires_at}\"}}")
          echo "snapshot branch: ${name} (expires ${expires_at})"
          cat resp.json
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi
          # A 409 BRANCH_ALREADY_EXISTS means a prior attempt of this same run+sha
          # already created the snapshot — the recovery point exists, so this is not
          # a failure. Any other error means we have no snapshot: abort before prod.
          if [ "$code" = "409" ] && grep -q BRANCH_ALREADY_EXISTS resp.json; then
            echo "Snapshot branch already exists from a prior attempt — recovery point is in place."
            exit 0
          fi
          echo "::error::Neon snapshot failed (HTTP ${code}) — aborting before touching prod."
          exit 1
      - name: Drift report (manual prod edits this deploy will overwrite)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/content/import.mjs --report-drift --prod --yes
      - name: Deploy content to production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/content/import.mjs --prod --yes
      - name: Dangling references (player rows left pointing at retired content)
        # Runs AFTER the import, because that is when a rename or retirement has
        # actually removed the old rows — this reports what the deploy just orphaned.
        # player_inventory and friends hold content ids with no foreign keys, so
        # nothing else would ever say a word about it: item_credits_small sat broken
        # in two players' packs long enough that nobody could date it.
        # Non-blocking on purpose — these usually predate the deploy that surfaces
        # them, and failing on old data trains people to ignore the gate.
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/content/check-dangling.mjs --prod --yes
      # Restart BEFORE recording. The `deployments` row is what the gate's idle
      # check reads, so recording first meant a failed reboot still stamped the sha
      # as deployed: the run went red, prod kept a stale world, and every later
      # scheduled run skipped with "HEAD already deployed" — no retry, ever. That
      # is exactly what happened on 2026-07-26, when a dead deploy-hook URL 404'd
      # after the row was already written. Recording last makes it self-healing:
      # no row, so the next scheduled run re-deploys (the import is idempotent
      # upserts, so replaying it is free).
      - name: Restart Render service (fresh world cache)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set. Render auto-deploy is off, so this hook is the ONLY way code or content reaches prod — without it the live server serves a stale world indefinitely."
            exit 1
          fi
          if ! curl -fsS -X POST "$HOOK" > /dev/null; then
            echo "::error::Deploy hook POST failed. Content is already in Neon, but the live server has NOT rebooted onto it. Check the hook URL against Render → architect-mud-live → Settings → Deploy Hook (a 404 means it points at a deleted service)."
            exit 1
          fi
          echo "Render restart triggered."
      - name: Record deployment
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          node --input-type=module -e "
          import pg from 'pg';
          const c = new pg.Client({ connectionString: process.env.PROD_DATABASE_URL, ssl: { rejectUnauthorized: false } });
          await c.connect();
          await c.query(
            'INSERT INTO deployments (deployed_by, change_count, changes_summary) VALUES (\$1, \$2, \$3)',
            ['ci', 0, JSON.stringify({ source: 'github-actions', sha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_NUMBER })]
          );
          await c.end();
          console.log('deployments row recorded');
          "

  # A failed deploy is silent: the run goes red on a page nobody has open, and prod
  # simply stops moving. Four consecutive failures went unnoticed in July 2026 while
  # 958 content files — the whole terrain/water rework — sat undeployed, and it was
  # found by hand days later. This opens (or updates) ONE tracking issue so a stalled
  # prod is impossible to miss, and closes it again on the next green run.
  #
  # Deliberately no external service and no new secrets: the built-in GITHUB_TOKEN
  # can file an issue, so this cannot itself break for want of configuration.
  #
  # ⚠ THE ALARM MUST NEVER BE THE THING THAT RAISES THE ALARM. This job reports on
  # the deploy; it is not part of it. By the time it runs, content is already in
  # Neon and Render has already been kicked — so a failure HERE means the report
  # did not get written, never that prod is broken. Hence `continue-on-error`: the
  # run's colour is decided by `regress` and `deploy` alone, which are the two jobs
  # that can actually leave prod stale.
  #
  # Without it, this job inverted the feature it exists for. On 2026-08-17 two
  # consecutive scheduled deploys went fully green — imported, rebooted, recorded —
  # and both runs were painted red by a GitHub API 503 (`No server is currently
  # available…`) thrown while closing the stall issue. So the dashboard showed a
  # failing deploy on a healthy prod, AND issue #28 stayed open insisting content
  # was frozen when it had shipped minutes earlier. Both directions of the signal
  # were lying at once, which is worse than having no notifier at all: the July
  # failure this job was built for was missed because nobody was looking, and a
  # notifier that cries wolf is how you get back to nobody looking.
  #
  # `retries: 3` handles the same 503 one layer down, so the ordinary transient
  # blip still leaves the issue in the right state rather than merely failing
  # quietly. 503 is not in octokit's `retry-exempt-status-codes` (400/401/403/404/
  # 422 — the genuinely terminal ones), so it is retried with backoff; a real
  # permissions or not-found error still fails fast instead of burning retries.
  notify:
    needs: [regress, deploy]
    if: always()   # including manual dispatches: a hand-run green deploy should clear the flag too
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            // Only speak up about runs that actually tried to deploy. A validate-only
            // push (gate skipped the deploy) has deployResult === 'skipped' — nothing
            // to report, and it must NOT close the stall issue claiming "green again".
            const deployResult = '${{ needs.deploy.result }}';
            const regressResult = '${{ needs.regress.result }}';
            const failed = regressResult === 'failure' || deployResult === 'failure';
            const deployed = deployResult === 'success';
            if (!failed && !deployed) return;   // validate-only / skipped — silent
            const TITLE = '🚨 prod content deploy is failing';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-stall',
            });
            const existing = open.find(i => i.title === TITLE);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (failed) {
              const body = [
                `Deploy failed on \`${context.sha.slice(0, 7)}\`.`,
                ``,
                `**Production content is frozen until this passes** — every content commit after the`,
                `last green run is undeployed, however many have landed since.`,
                ``,
                `Run: ${runUrl}`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: TITLE, body, labels: ['deploy-stall'],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Deploy is green again on \`${context.sha.slice(0, 7)}\`. Closing.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
            }
