# Free-tier usage watch — daily Neon + Render burn-rate report.
#
# See docs/ops-usage-watch.md. This is the Phase 2 runner: the same
# `npm run ops:usage` a developer runs by hand, on a schedule, so the report
# does not depend on anybody's laptop being awake.
#
# ── WHY :17 AND NOT :00 ────────────────────────────────────────────────────
# Same lesson deploy-content.yml records at :37 — GitHub's scheduled dispatch
# is heavily contended on the hour, with 29–106 min delays measured on this
# repo. An off-the-hour minute gets picked up promptly.
#
# ── WHY THIS JOB NEVER FAILS ───────────────────────────────────────────────
# A monitor that goes red is a monitor that gets muted, and a red X here would
# say "the watch is broken" when it usually means "usage is high" or "a secret
# is missing". scripts/ops/usage-report.mjs already exits 0 on every collection
# failure and records the reason as a note, so this workflow simply does not
# pass --fail-on-alert. The alarm must never be the thing that raises the
# alarm — the same rule deploy-content.yml's notify job learned from a GitHub
# outage painting green deploys red.
#
# ── MISSING SECRETS DEGRADE, THEY DO NOT BREAK ─────────────────────────────
# NEON_API_KEY and PROD_DATABASE_URL already exist, so the Neon half and the
# whole attribution model work the day this lands. RENDER_API_KEY and
# OPS_WEBHOOK_URL do not exist yet (johna is a collaborator, not an admin — only
# the repo owner can add them). Without them the report prints a "COLLECTION
# FAILED" note for Render and delivers no webhook, and still exits 0. Adding the
# secrets later needs no change to this file.
name: Free-tier usage watch

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

# Never let two runs race on the history file's commit-back.
concurrency:
  group: usage-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Report usage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          # Attribution reads production directly — boot payload and world
          # loads/day. A few KB per run against the budget it measures.
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run ops:usage

      - name: Warn if the Render half is unconfigured
        # Surfaced as a workflow annotation rather than a failure, so the gap is
        # visible in the Actions UI without the run going red every morning.
        #
        # The secrets are mapped into env and tested there, rather than checked
        # in an `if:` expression — the `secrets` context is not dependably
        # available in a step-level conditional, and an expression that silently
        # evaluates empty would make this warning either never fire or always
        # fire. Testing the env var is unambiguous.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: |
          missing=""
          [ -z "$RENDER_API_KEY" ]   && missing="$missing RENDER_API_KEY"
          [ -z "$OPS_WEBHOOK_URL" ]  && missing="$missing OPS_WEBHOOK_URL"
          if [ -n "$missing" ]; then
            echo "::warning::Partial run — missing repo secret(s):$missing. Neon and attribution were reported; Render metrics and/or Discord alerting stay inactive until the repo owner adds them."
          else
            echo "All four secrets present — full report."
          fi

      - name: Commit the history row
        # data/ops/** is outside deploy-content.yml's push path filter, so this
        # cannot trigger a production content deploy.
        #
        # ⚠ [skip ci] IS LOAD-BEARING. sync-commits.yml triggers on EVERY push to
        # main with no path filter at all, and writes to the prod database. Without
        # this marker, a bookkeeping commit whose only purpose is to record a
        # number would kick off a prod DB write every single morning.
        run: |
          if [ -z "$(git status --porcelain data/ops)" ]; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ops
          git commit -m "usage watch: $(date -u +%Y-%m-%d) [skip ci]"
          # Rebase before pushing: a human may have landed a commit on main
          # between checkout and here, and losing the day's row to a rejected
          # push would be a silent gap in the trend.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  # ── Is prod keeping up with main? ─────────────────────────────────────────────
  # deploy-content deploys on a GitHub cron, which GitHub fires late or not at all
  # (3-4 runs a day instead of 6, gaps of 8 hours, in early October 2026), and its
  # own failure notice only runs when the workflow does. So a skipped day was silent.
  # This finds the newest successful deploy, checks whether main has commits since
  # that touch deployable paths (docs-only commits don't need a deploy), and when
  # they have waited more than 8 hours it opens or updates a deploy-stall issue. It
  # closes the issue once prod has caught up. Reporting only: like deploy-content's
  # notify job, a failure here never fails the morning usage report.
  deploy-freshness:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const STALL_HOURS = 8;
            const TITLE = '🚨 prod deploy has stalled';
            const DEPLOYABLE = [/^content\//, /^server\//, /^plugins\//, /^client\//, /^scripts\/content\//,
              /^package(-lock)?\.json$/, /^\.github\/workflows\/deploy-content\.yml$/];

            // The newest deploy-content run whose `deploy` job succeeded.
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy-content.yml', status: 'success', per_page: 40,
            });
            let deployed = null;
            for (const run of runs) {
              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id });
              const job = jobs.find((j) => j.name === 'deploy' && j.conclusion === 'success');
              if (job) { deployed = { sha: run.head_sha, at: new Date(job.completed_at), url: run.html_url }; break; }
            }
            if (!deployed) { core.warning('No successful deploy in the last 40 deploy-content runs.'); return; }

            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            let waiting = [];
            if (branch.commit.sha !== deployed.sha) {
              const { data: cmp } = await github.rest.repos.compareCommits({ owner, repo, base: deployed.sha, head: branch.commit.sha });
              const touches = (cmp.files || []).some((f) => DEPLOYABLE.some((re) => re.test(f.filename)));
              if (touches) waiting = cmp.commits;
            }
            const oldest = waiting.length ? new Date(waiting[0].commit.committer.date) : null;
            const hours = oldest ? (Date.now() - oldest) / 3.6e6 : 0;
            core.info(`last deploy ${deployed.sha.slice(0, 9)} at ${deployed.at.toISOString()}; ${waiting.length} commit(s) waiting, oldest ${hours.toFixed(1)} h`);

            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'deploy-stall' });
            const existing = open.find((i) => i.title === TITLE);
            if (hours > STALL_HOURS) {
              const body = [
                `${waiting.length} commit(s) on main that touch deployable files have waited **${hours.toFixed(1)} hours** for a deploy.`,
                `Last successful deploy: \`${deployed.sha.slice(0, 9)}\` at ${deployed.at.toISOString()} (${deployed.url}).`,
                'The scheduled deploy may not be firing. Run deploy-content by hand (Actions tab, Run workflow) or push a commit with `[deploy]`.',
              ].join('\n\n');
              if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: ['deploy-stall'] });
            } else if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Prod has caught up (last deploy \`${deployed.sha.slice(0, 9)}\`). Closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
