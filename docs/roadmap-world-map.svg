<svg viewBox="0 0 1360 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Coldwater Basin and the Wastes — 100x100 overworld tile map</title>
  <desc id="mapDesc">A zoomed-out overworld map of the Architect MUD world on a 100 by 100 tile grid. The starting metropolis Coldwater Basin sits centre-west, broken into districts. Surrounding regions include mountains (The Frostreach) to the north, an irradiated zone (The Glow) and a rival city (Halcyon Reach) to the east, farmland (Greenfields) and a stadium city-state to the south, gang ashlands to the southwest, and the industrial Slagworks and Western Gateway to the west. Terrain types, settlements, roads, and rivers are marked with a legend.</desc>

  <style>
    text{font-family:system-ui,sans-serif}
    .mono{font-family:'Courier New',monospace}
    .rlabel{fill:#cdd6c6;opacity:.30;letter-spacing:3px;font-weight:700}
    .settle{fill:#eef3e6;font-size:12px;paint-order:stroke;stroke:#0a0c0e;stroke-width:3.2px;stroke-linejoin:round;font-weight:600}
    .city{fill:#f3f7ec;font-size:15px;paint-order:stroke;stroke:#0a0c0e;stroke-width:3.6px;stroke-linejoin:round;font-weight:800;letter-spacing:1px}
    .sub{fill:#cbd3c4;font-size:9px;paint-order:stroke;stroke:#151b16;stroke-width:2.4px;stroke-linejoin:round;text-anchor:middle}
    .tick{fill:#6f7d70;font-size:11px}
    .terr{stroke:#000;stroke-opacity:.30;stroke-width:1}
    .road{fill:none;stroke:#5c5443;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
    .rdln{fill:none;stroke:#948967;stroke-width:1;stroke-dasharray:5 6}
    .river{fill:none;stroke:#2c5c67;stroke-width:6;stroke-linecap:round}
  </style>

  <defs>
    <pattern id="grid1" width="9.6" height="9.6" patternUnits="userSpaceOnUse">
      <path d="M9.6 0V9.6H0" fill="none" stroke="#c9d8cc" stroke-width="0.3" opacity="0.07"/>
    </pattern>
    <pattern id="grid10" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0V96H0" fill="none" stroke="#c9d8cc" stroke-width="0.7" opacity="0.15"/>
    </pattern>
    <pattern id="hazard" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="none"/><line x1="0" y1="0" x2="0" y2="10" stroke="#c7d84a" stroke-width="1.4" opacity="0.18"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1360" height="1100" fill="#0b0d10"/>

  <!-- ============ TERRAIN (back to front) ============ -->
  <!-- base wasteland -->
  <rect x="70" y="70" width="960" height="960" fill="#2c2a21"/>

  <!-- suburbs / ruins apron around the city -->
  <path class="terr" fill="#38322a" d="M360,360 L560,335 L740,370 L782,470 L760,600 L620,690 L440,682 L358,560 L350,452 Z"/>

  <!-- mountains: The Frostreach (north band) -->
  <path class="terr" fill="#33383d" d="M70,70 L70,178 L185,152 L300,206 L415,160 L530,118 L646,178 L761,140 L876,192 L1030,150 L1030,70 Z"/>

  <!-- Lake Coldwater (NW) -->
  <path class="terr" fill="#173139" d="M118,198 L202,214 L242,256 L216,318 L150,338 L98,300 L94,240 Z"/>

  <!-- Toxic Shallows (SE sea) -->
  <path class="terr" fill="#173139" d="M1030,712 L964,772 L914,852 L880,936 L860,1030 L1030,1030 Z"/>

  <!-- Static Wood (forest, west-central) -->
  <path class="terr" fill="#1b3324" d="M250,382 L332,360 L402,396 L422,470 L372,542 L290,536 L246,470 Z"/>
  <!-- south forest patch -->
  <path class="terr" fill="#1b3324" d="M300,852 L382,836 L442,872 L432,956 L352,976 L296,930 Z"/>

  <!-- The Glow (irradiated, NE) -->
  <path class="terr" fill="#3a481d" d="M736,142 L820,96 L920,110 L986,176 L950,262 L840,292 L760,236 L734,178 Z"/>
  <path fill="url(#hazard)" d="M736,142 L820,96 L920,110 L986,176 L950,262 L840,292 L760,236 L734,178 Z"/>

  <!-- Greenfields farmland (south) -->
  <path class="terr" fill="#2c3b23" d="M400,730 L520,704 L652,736 L682,820 L620,902 L500,912 L410,852 Z"/>

  <!-- The Slagworks industrial (far west) -->
  <path class="terr" fill="#3a2a1c" d="M70,440 L152,430 L202,492 L196,592 L140,642 L74,620 L70,520 Z"/>

  <!-- The Ashlands (SW) -->
  <path class="terr" fill="#26202a" d="M158,652 L280,636 L342,702 L332,802 L250,852 L164,822 L138,732 Z"/>

  <!-- ============ RIVER ============ -->
  <path class="river" d="M150,338 C 222,384 300,360 360,432 C 420,500 470,540 522,612 C 582,692 700,782 822,902 C 862,956 872,1000 882,1030"/>

  <!-- ============ GRID OVERLAY (100x100) ============ -->
  <rect x="70" y="70" width="960" height="960" fill="url(#grid1)"/>
  <rect x="70" y="70" width="960" height="960" fill="url(#grid10)"/>
  <rect x="70" y="70" width="960" height="960" fill="none" stroke="#3a4640" stroke-width="1.2"/>

  <!-- coordinate ticks every 10 -->
  <g class="mono tick">
    <text x="70" y="60" text-anchor="middle">0</text><text x="262" y="60" text-anchor="middle">20</text>
    <text x="454" y="60" text-anchor="middle">40</text><text x="646" y="60" text-anchor="middle">60</text>
    <text x="838" y="60" text-anchor="middle">80</text><text x="1030" y="60" text-anchor="middle">100</text>
    <text x="60" y="74" text-anchor="end">0</text><text x="60" y="266" text-anchor="end">20</text>
    <text x="60" y="458" text-anchor="end">40</text><text x="60" y="650" text-anchor="end">60</text>
    <text x="60" y="842" text-anchor="end">80</text><text x="60" y="1034" text-anchor="end">100</text>
  </g>

  <!-- ============ ROADS ============ -->
  <g>
    <path class="road" d="M166,598 L338,580 L434,570 L704,586 L800,600"/>
    <path class="road" d="M569,494 L560,360 L550,244"/>
    <path class="road" d="M590,676 L579,838 L662,916"/>
    <path class="road" d="M666,472 L804,412 L878,304"/>
    <path class="rdln" d="M166,598 L338,580 L434,570 L704,586 L800,600"/>
    <path class="rdln" d="M569,494 L560,360 L550,244"/>
    <path class="rdln" d="M590,676 L579,838 L662,916"/>
    <path class="rdln" d="M666,472 L804,412 L878,304"/>
  </g>

  <!-- ============ REGION LABELS (faint) ============ -->
  <g class="rlabel">
    <text x="548" y="122" font-size="19" text-anchor="middle">THE FROSTREACH</text>
    <text x="150" y="256" font-size="12" text-anchor="middle">LAKE COLDWATER</text>
    <text x="872" y="176" font-size="17" text-anchor="middle">THE GLOW</text>
    <text x="322" y="452" font-size="12" text-anchor="middle">STATIC WOOD</text>
    <text x="232" y="772" font-size="14" text-anchor="middle">THE ASHLANDS</text>
    <text x="852" y="512" font-size="17" text-anchor="middle">THE EASTERN SPRAWL</text>
    <text x="950" y="952" font-size="12" text-anchor="middle">TOXIC SHALLOWS</text>
    <text x="250" y="700" font-size="15" text-anchor="middle">THE DUSTFLATS</text>
  </g>

  <!-- ============ RIVAL CITY BLOCKS ============ -->
  <!-- Halcyon Reach (east) -->
  <rect x="799" y="550" width="134" height="116" rx="6" fill="#27313d" stroke="#4a6076" stroke-width="1.4"/>
  <g stroke="#3a4a5a" stroke-width="0.8"><line x1="844" y1="550" x2="844" y2="666"/><line x1="889" y1="550" x2="889" y2="666"/><line x1="799" y1="589" x2="933" y2="589"/><line x1="799" y1="627" x2="933" y2="627"/></g>
  <text class="settle" x="866" y="544" text-anchor="middle">HALCYON REACH</text>
  <text class="sub" x="866" y="612" fill="#9fb0c2">rival metropolis</text>

  <!-- Custodian Arcology (NE fortress) -->
  <rect x="751" y="367" width="106" height="87" rx="4" fill="#22343a" stroke="#5fd0d0" stroke-width="1.4"/>
  <text class="settle" x="804" y="360" text-anchor="middle" fill="#a6ecec">Custodian Arcology</text>
  <text class="sub" x="804" y="416" fill="#6fbcbc">corp fortress-city</text>

  <!-- Stadium City-State (far south, oval) -->
  <ellipse cx="684" cy="953" rx="58" ry="37" fill="#332a1f" stroke="#c08a4a" stroke-width="1.6"/>
  <ellipse cx="684" cy="953" rx="34" ry="18" fill="none" stroke="#c08a4a" stroke-width="1" opacity="0.5"/>
  <text class="settle" x="684" y="1008" text-anchor="middle" fill="#e6bd7a">Stadium City-State</text>

  <!-- ============ COLDWATER BASIN (expanded starting metropolis) ============ -->
  <rect x="434" y="434" width="270" height="242" rx="9" fill="#2f3d4d" stroke="#5f7f9c" stroke-width="2"/>
  <!-- internal district grid -->
  <g stroke="#41556a" stroke-width="0.9" opacity="0.8">
    <line x1="524" y1="434" x2="524" y2="676"/><line x1="614" y1="434" x2="614" y2="676"/>
    <line x1="434" y1="515" x2="704" y2="515"/><line x1="434" y1="596" x2="704" y2="596"/>
  </g>
  <text class="city" x="569" y="424" text-anchor="middle">COLDWATER BASIN</text>
  <text class="sub" x="569" y="700" fill="#9fb0c2" font-size="10">the starting metropolis · safe core + districts</text>

  <!-- district sublabels -->
  <g>
    <!-- The Threshold: safe core, centre -->
    <path d="M569,548 l4 9 10 1 -8 7 3 10 -9 -5 -9 5 3 -10 -8 -7 10 -1 z" fill="#8ff0b4" stroke="#0a0c0e" stroke-width="1.2"/>
    <text class="sub" x="569" y="585" fill="#bfeecb">The Threshold</text>
    <text class="sub" x="479" y="478">Foundry Flats</text>
    <text class="sub" x="569" y="478">Merchant Row</text>
    <text class="sub" x="659" y="478">Precinct 9</text>
    <text class="sub" x="479" y="560">Franchise Strip</text>
    <text class="sub" x="659" y="560">Marquee District</text>
    <text class="sub" x="479" y="640">Old Coldwater</text>
    <text class="sub" x="569" y="632">Embassy · Residential</text>
    <text class="sub" x="659" y="640">Dockside</text>
    <text class="sub" x="569" y="612" fill="#c9d2c0">Undercity ↧</text>
  </g>

  <!-- ============ SETTLEMENT MARKERS ============ -->
  <g>
    <!-- Western Gateway -->
    <rect x="331" y="571" width="14" height="14" fill="#7fb0d8" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="338" y="606" text-anchor="middle">Western Gateway</text>

    <!-- The Slagworks -->
    <rect x="159" y="591" width="14" height="14" fill="#d08a52" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="166" y="626" text-anchor="middle" fill="#eab787">The Slagworks</text>

    <!-- Greenfields Commune -->
    <circle cx="579" cy="838" r="6" fill="#8fbf6a" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="579" y="826" text-anchor="middle" fill="#bfe09a">Greenfields Commune</text>

    <!-- Breaker Camps -->
    <path d="M310,772 l8 14 -16 0 z" fill="#e0663c" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="302" y="798" text-anchor="end" fill="#f08a5a">Breaker Camps</text>
    <text class="sub" x="302" y="811" text-anchor="end" fill="#a0603a">gang faction</text>

    <!-- Northgate -->
    <circle cx="550" cy="243" r="6" fill="#7fb0d8" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="562" y="247">Northgate</text>

    <!-- The Glitch / Data Haven -->
    <circle cx="732" cy="684" r="6" fill="#8a6cff" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="744" y="688" fill="#ab93ff">The Glitch · Data Haven</text>

    <!-- Coldwater Power Station -->
    <circle cx="406" cy="545" r="7" fill="#e2b23c" stroke="#0a0c0e" stroke-width="1"/>
    <path d="M406,540 l-3 6 3 0 -2 5 6 -8 -3 0 3 -3 z" fill="#0a0c0e"/>
    <text class="settle" x="398" y="533" text-anchor="end" fill="#f0cd6a">Coldwater Power Station</text>

    <!-- Archivist Stacks (underground) -->
    <circle cx="454" cy="700" r="6" fill="#9a7fd8" stroke="#0a0c0e" stroke-width="1"/>
    <text class="settle" x="446" y="704" text-anchor="end" fill="#b8a2e8">Archivist Stacks ↧</text>

    <!-- Deep Data Center — Architect's Core (in The Glow) -->
    <path d="M878,280 l6 14 15 1 -11 10 4 15 -14 -8 -13 8 4 -15 -12 -10 15 -1 z" fill="#8a6cff" stroke="#e0d4ff" stroke-width="1.4"/>
    <text class="settle" x="878" y="266" text-anchor="middle" fill="#cbb9ff">THE DEEP DATA CENTER</text>
    <text class="sub" x="878" y="322" fill="#8f7ad0">the Architect's core · endgame</text>
  </g>

  <!-- ============ COMPASS ============ -->
  <g transform="translate(120,140)" class="mono">
    <circle r="30" fill="#12161a" stroke="#39433c"/>
    <path d="M0 -22 L5 0 L0 22 L-5 0 Z" fill="#c56a4a"/>
    <text x="0" y="-34" text-anchor="middle" font-size="12" fill="#c9d2c0">N</text>
  </g>

  <!-- ============ LEGEND PANEL ============ -->
  <g class="mono">
    <rect x="1058" y="70" width="288" height="960" rx="8" fill="#101418" stroke="#39433c" stroke-width="1"/>

    <text x="1078" y="104" font-family="system-ui" font-size="19" font-weight="800" fill="#eef3e6">COLDWATER BASIN</text>
    <text x="1078" y="126" font-size="12" fill="#8a9484">&amp; THE WASTES</text>
    <text x="1078" y="146" font-size="11" fill="#6f7d70">100×100 overworld · tile map</text>
    <line x1="1078" y1="160" x2="1326" y2="160" stroke="#2c352f"/>

    <!-- tile types -->
    <text x="1078" y="186" font-size="12" fill="#c9d2c0" letter-spacing="1">TILE TYPES</text>
    <g font-size="11.5" fill="#aeb8a6">
      <rect x="1078" y="196" width="18" height="14" fill="#2f3d4d"/><text x="1104" y="207">Urban / city</text>
      <rect x="1078" y="216" width="18" height="14" fill="#38322a"/><text x="1104" y="227">Suburbs / ruins</text>
      <rect x="1078" y="236" width="18" height="14" fill="#2c2a21"/><text x="1104" y="247">Wasteland (Dustflats)</text>
      <rect x="1078" y="256" width="18" height="14" fill="#2c3b23"/><text x="1104" y="267">Farmland (reclaimed)</text>
      <rect x="1078" y="276" width="18" height="14" fill="#1b3324"/><text x="1104" y="287">Forest / Static Wood</text>
      <rect x="1078" y="296" width="18" height="14" fill="#33383d"/><text x="1104" y="307">Mountains / Frostreach</text>
      <rect x="1078" y="316" width="18" height="14" fill="#173139"/><text x="1104" y="327">Water / river / sea</text>
      <rect x="1078" y="336" width="18" height="14" fill="#3a481d"/><text x="1104" y="347">Irradiated (The Glow)</text>
      <rect x="1078" y="356" width="18" height="14" fill="#3a2a1c"/><text x="1104" y="367">Industrial / slag</text>
      <rect x="1078" y="376" width="18" height="14" fill="#26202a"/><text x="1104" y="387">Ashlands</text>
    </g>

    <line x1="1078" y1="404" x2="1326" y2="404" stroke="#2c352f"/>

    <!-- symbols -->
    <text x="1078" y="428" font-size="12" fill="#c9d2c0" letter-spacing="1">SYMBOLS</text>
    <g font-size="11.5" fill="#aeb8a6">
      <rect x="1080" y="438" width="14" height="14" rx="3" fill="#2f3d4d" stroke="#5f7f9c"/><text x="1104" y="449">Major city (districts)</text>
      <rect x="1081" y="460" width="12" height="12" fill="#7fb0d8"/><text x="1104" y="470">Settlement / town</text>
      <rect x="1081" y="480" width="12" height="12" fill="#5fd0d0"/><text x="1104" y="490">Faction stronghold</text>
      <path d="M1087,500 l7 12 -14 0 z" fill="#e0663c"/><text x="1104" y="512">Gang camp</text>
      <circle cx="1087" cy="527" r="6" fill="#e2b23c"/><text x="1104" y="531">Power station</text>
      <path d="M1087,542 l4 9 10 1 -8 7 3 10 -9 -5 -9 5 3 -10 -8 -7 10 -1 z" fill="#8a6cff"/><text x="1112" y="553">Architect's core</text>
      <circle cx="1087" cy="571" r="6" fill="#9a7fd8"/><text x="1104" y="575">Underground access ↧</text>
    </g>
    <g font-size="11.5" fill="#aeb8a6">
      <line x1="1080" y1="596" x2="1098" y2="596" class="road"/><line x1="1080" y1="596" x2="1098" y2="596" class="rdln"/><text x="1104" y="600">Highway</text>
      <line x1="1080" y1="616" x2="1098" y2="616" class="river"/><text x="1104" y="620">River</text>
      <rect x="1080" y="628" width="18" height="12" fill="url(#hazard)" stroke="#2c352f"/><text x="1104" y="638">Radiation hazard</text>
    </g>

    <line x1="1078" y1="656" x2="1326" y2="656" stroke="#2c352f"/>

    <!-- notes -->
    <text x="1078" y="680" font-size="12" fill="#c9d2c0" letter-spacing="1">NOTES</text>
    <g font-size="10.5" fill="#8a9484" font-family="system-ui">
      <text x="1078" y="700">• Coldwater Basin is the starting city —</text>
      <text x="1090" y="714">safe core (The Threshold) + districts.</text>
      <text x="1078" y="732">• Danger rises with distance &amp; terrain,</text>
      <text x="1090" y="746">not in neat rings — multiple cities,</text>
      <text x="1090" y="760">frontiers, and hazards break it up.</text>
      <text x="1078" y="778">• Roads connect the settlements; the</text>
      <text x="1090" y="792">wilds between them are the danger.</text>
      <text x="1078" y="810">• Interiors (buildings, the Undercity,</text>
      <text x="1090" y="824">the Data Center) are their own child</text>
      <text x="1090" y="838">maps — not shown at this zoom.</text>
      <text x="1078" y="856">• Grid = 100×100 tiles; ticks every 20.</text>
    </g>

    <line x1="1078" y1="876" x2="1326" y2="876" stroke="#2c352f"/>
    <text x="1078" y="900" font-size="12" fill="#c9d2c0" letter-spacing="1">STARTING AREA</text>
    <g font-size="10.5" fill="#9fb0c2" font-family="system-ui">
      <text x="1078" y="920">Coldwater Basin districts:</text>
      <text x="1078" y="938" fill="#8a9484">Threshold · Merchant Row · Foundry Flats</text>
      <text x="1078" y="954" fill="#8a9484">Precinct 9 · Franchise Strip · Marquee</text>
      <text x="1078" y="970" fill="#8a9484">Old Coldwater · Embassy · Dockside</text>
      <text x="1078" y="986" fill="#8a9484">Undercity (↧ child map)</text>
    </g>
    <text x="1078" y="1012" font-size="10" fill="#5f6a5e" font-family="system-ui">Vision map — see roadmap-world-expansion.md</text>
  </g>
</svg>
