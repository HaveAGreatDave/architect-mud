<svg viewBox="0 0 1100 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle mapDesc" font-family="system-ui, sans-serif">
  <title id="mapTitle">Coldwater Basin — the 100x100 world overview</title>
  <desc id="mapDesc">A zoomed-out concentric map of the planned Architect MUD world: a safe core at the centre, surrounded by rings of increasing danger — city, inner ruins, badlands, and outer wastes — with landmark districts and faction territories marked.</desc>

  <!-- backdrop -->
  <rect x="0" y="0" width="1100" height="1120" fill="#0c0e11"/>

  <!-- ===================== DANGER BANDS (concentric, flat) ===================== -->
  <!-- outer wastes -->
  <ellipse cx="550" cy="570" rx="478" ry="472" fill="#241614" stroke="#5a3324" stroke-width="1.5" transform="rotate(-8 550 570)"/>
  <!-- badlands -->
  <ellipse cx="550" cy="570" rx="376" ry="368" fill="#3a251a" stroke="#7a4a2e" stroke-width="1.5" transform="rotate(6 550 570)"/>
  <!-- inner ruins / gray zone -->
  <ellipse cx="550" cy="570" rx="282" ry="274" fill="#443519" stroke="#8a712f" stroke-width="1.5" transform="rotate(-5 550 570)"/>
  <!-- city proper -->
  <ellipse cx="550" cy="570" rx="186" ry="180" fill="#26303c" stroke="#4a6076" stroke-width="1.5" transform="rotate(4 550 570)"/>
  <!-- safe core -->
  <ellipse cx="550" cy="570" rx="90" ry="86" fill="#1e4030" stroke="#3f8a63" stroke-width="1.8"/>

  <!-- band labels (upper-left arc) -->
  <g font-size="13" fill="#c9d2c0" opacity="0.55" font-family="'Courier New', monospace" letter-spacing="2">
    <text x="550" y="512" text-anchor="middle">SAFE CORE</text>
    <text x="550" y="418" text-anchor="middle">THE CITY</text>
    <text x="550" y="322" text-anchor="middle">INNER RUINS</text>
    <text x="550" y="228" text-anchor="middle">THE BADLANDS</text>
    <text x="550" y="128" text-anchor="middle">THE OUTER WASTES</text>
  </g>

  <!-- survey grid overlay (100x100) -->
  <g stroke="#c9d8cc" stroke-width="0.6" opacity="0.05">
    <line x1="166" y1="90" x2="166" y2="1050"/><line x1="262" y1="90" x2="262" y2="1050"/>
    <line x1="358" y1="90" x2="358" y2="1050"/><line x1="454" y1="90" x2="454" y2="1050"/>
    <line x1="550" y1="90" x2="550" y2="1050"/><line x1="646" y1="90" x2="646" y2="1050"/>
    <line x1="742" y1="90" x2="742" y2="1050"/><line x1="838" y1="90" x2="838" y2="1050"/>
    <line x1="934" y1="90" x2="934" y2="1050"/>
    <line x1="70" y1="186" x2="1030" y2="186"/><line x1="70" y1="282" x2="1030" y2="282"/>
    <line x1="70" y1="378" x2="1030" y2="378"/><line x1="70" y1="474" x2="1030" y2="474"/>
    <line x1="70" y1="570" x2="1030" y2="570"/><line x1="70" y1="666" x2="1030" y2="666"/>
    <line x1="70" y1="762" x2="1030" y2="762"/><line x1="70" y1="858" x2="1030" y2="858"/>
    <line x1="70" y1="954" x2="1030" y2="954"/>
  </g>
  <!-- grid frame + coordinate ticks -->
  <rect x="70" y="90" width="960" height="960" fill="none" stroke="#3a4640" stroke-width="1"/>
  <g font-size="11" fill="#6f7d70" font-family="'Courier New', monospace">
    <text x="70" y="82" text-anchor="middle">0</text><text x="310" y="82" text-anchor="middle">25</text>
    <text x="550" y="82" text-anchor="middle">50</text><text x="790" y="82" text-anchor="middle">75</text>
    <text x="1030" y="82" text-anchor="middle">100</text>
    <text x="60" y="94" text-anchor="end">0</text><text x="60" y="334" text-anchor="end">25</text>
    <text x="60" y="574" text-anchor="end">50</text><text x="60" y="814" text-anchor="end">75</text>
    <text x="60" y="1054" text-anchor="end">100</text>
  </g>

  <!-- ===================== "BUILT TODAY" boundary ===================== -->
  <path d="M 430 490 Q 300 500 320 590 Q 340 690 470 680 Q 610 690 640 600 Q 660 500 550 485 Q 490 480 430 490 Z"
        fill="none" stroke="#7fd4a0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7"/>
  <text x="330" y="700" font-size="11" fill="#7fd4a0" font-family="'Courier New', monospace" opacity="0.8">▲ BUILT TODAY</text>

  <!-- ===================== LANDMARKS ===================== -->
  <!-- helper glyphs drawn inline; text uses dark halo for legibility -->
  <g font-size="12.5" fill="#e6ecdb" paint-order="stroke" stroke="#0c0e11" stroke-width="3" stroke-linejoin="round" font-weight="600">

    <!-- THE THRESHOLD (safe hub) -->
    <path d="M550 552 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1 z" fill="#8ff0b4" stroke="#0c0e11" stroke-width="1.5"/>
    <text x="550" y="600" text-anchor="middle">THE THRESHOLD</text>
    <text x="550" y="615" text-anchor="middle" font-size="9.5" font-weight="400" fill="#9fb59f" stroke="none">safe hub · anchor · vendors</text>

    <!-- Merchant Row -->
    <circle cx="545" cy="470" r="5" fill="#7fb0d8"/>
    <text x="545" y="456" text-anchor="middle" font-size="11">Merchant Row</text>

    <!-- Marquee District -->
    <circle cx="688" cy="548" r="5" fill="#7fb0d8"/>
    <text x="700" y="552" font-size="11">Marquee District</text>

    <!-- Franchise Strip / Embassy -->
    <circle cx="432" cy="612" r="5" fill="#7fb0d8"/>
    <text x="424" y="628" text-anchor="end" font-size="11">Franchise Strip · Embassy</text>

    <!-- Static Wood / Rust Quarter (buffer) -->
    <circle cx="360" cy="560" r="5" fill="#b79a55"/>
    <text x="352" y="548" text-anchor="end" font-size="11">Rust Quarter · Static Wood</text>

    <!-- Coldwater Power Station -->
    <circle cx="250" cy="560" r="6" fill="#e2b23c"/>
    <path d="M250 556 l-3 5 3 0 -2 5 6 -7 -3 0 3 -3 z" fill="#0c0e11"/>
    <text x="250" y="588" text-anchor="middle" font-size="11" fill="#f0cd6a">Coldwater Power Station</text>

    <!-- The Slagworks / Ashway -->
    <circle cx="128" cy="612" r="5" fill="#c56a4a"/>
    <text x="138" y="616" font-size="11">Slagworks · Ashway</text>

    <!-- Custodian Arcology (NE, corp) -->
    <rect x="742" y="316" width="12" height="12" fill="#5fd0d0"/>
    <text x="762" y="326" font-size="11" fill="#8fe6e6">Custodian Arcology</text>
    <text x="762" y="340" font-size="9" font-weight="400" fill="#5a9a9a" stroke="none">corp faction</text>

    <!-- Breaker Camps (SW, gang) -->
    <path d="M330 786 l7 12 -14 0 z" fill="#e0663c"/>
    <text x="322" y="812" text-anchor="end" font-size="11" fill="#f08a5a">Breaker Camps</text>
    <text x="322" y="826" text-anchor="end" font-size="9" font-weight="400" fill="#a0603a" stroke="none">gang faction</text>

    <!-- Franchise HQ (S) -->
    <rect x="556" y="792" width="11" height="11" fill="#d0a05f"/>
    <text x="561" y="826" text-anchor="middle" font-size="11" fill="#e6c078">The Franchise HQ</text>

    <!-- Archivist Stacks (underground W) -->
    <circle cx="392" cy="440" r="5" fill="#9a7fd8"/>
    <text x="384" y="428" text-anchor="end" font-size="11" fill="#b49ae6">Archivist Stacks ↧</text>

    <!-- The Glitch / Data Haven (E) -->
    <circle cx="700" cy="655" r="5" fill="#8a6cff"/>
    <text x="712" y="659" font-size="11" fill="#a88fff">The Glitch · Data Haven</text>

    <!-- The Undercity (down, central-S) -->
    <path d="M498 654 l8 0 -4 9 z" fill="#c9d2c0"/>
    <text x="500" y="690" text-anchor="middle" font-size="11">The Undercity ↧</text>

    <!-- Collapsed Stadium City-State (far S) -->
    <circle cx="580" cy="936" r="5" fill="#c56a4a"/>
    <text x="580" y="922" text-anchor="middle" font-size="11">Stadium City-State</text>

    <!-- The Cinder Reach / EMP scar (E waste) -->
    <circle cx="902" cy="662" r="5" fill="#c56a4a"/>
    <text x="892" y="666" text-anchor="end" font-size="11">The Cinder Reach</text>

    <!-- DEEP DATA CENTER — ARCHITECT'S CORE (endgame, far NE) -->
    <path d="M898 176 l6 15 16 1 -12 11 4 16 -14 -9 -14 9 4 -16 -12 -11 16 -1 z" fill="#8a6cff" stroke="#d8c8ff" stroke-width="1.5"/>
    <text x="898" y="222" text-anchor="middle" font-size="12" fill="#c8b6ff">THE DEEP DATA CENTER</text>
    <text x="898" y="237" text-anchor="middle" font-size="9.5" font-weight="400" fill="#8f7ad0" stroke="none">the Architect's core · endgame</text>
  </g>

  <!-- ===================== TITLE ===================== -->
  <text x="70" y="1090" font-size="22" fill="#e6ecdb" font-weight="700" letter-spacing="1">COLDWATER BASIN</text>
  <text x="304" y="1090" font-size="13" fill="#8a9484" font-family="'Courier New', monospace">— the 100×100 world · zoomed-out overview</text>
  <text x="70" y="1108" font-size="11" fill="#6f7d70" font-family="'Courier New', monospace">danger rises with distance from the core · interiors are their own child maps, not shown here</text>

  <!-- ===================== LEGEND (danger ramp) ===================== -->
  <g font-family="'Courier New', monospace" font-size="10.5">
    <rect x="852" y="884" width="176" height="158" rx="6" fill="#12161a" stroke="#39433c" stroke-width="1"/>
    <text x="866" y="906" fill="#c9d2c0" font-size="11" letter-spacing="1">DANGER RAMP</text>
    <rect x="866" y="916" width="16" height="12" fill="#1e4030"/><text x="890" y="926" fill="#9fb59f">Safe · PvP-off</text>
    <rect x="866" y="934" width="16" height="12" fill="#26303c"/><text x="890" y="944" fill="#9fb59f">City · low</text>
    <rect x="866" y="952" width="16" height="12" fill="#443519"/><text x="890" y="962" fill="#9fb59f">Inner ruins · medium</text>
    <rect x="866" y="970" width="16" height="12" fill="#3a251a"/><text x="890" y="980" fill="#9fb59f">Badlands · high · PvP</text>
    <rect x="866" y="988" width="16" height="12" fill="#241614"/><text x="890" y="998" fill="#9fb59f">Wastes · lethal</text>
    <text x="866" y="1022" fill="#7fd4a0">▲ dashed = built today</text>
    <text x="866" y="1036" fill="#8a6cff">★ = the Architect's core</text>
  </g>

  <!-- compass -->
  <g transform="translate(978,150)" font-family="'Courier New', monospace">
    <circle r="34" fill="#12161a" stroke="#39433c"/>
    <path d="M0 -26 L6 0 L0 26 L-6 0 Z" fill="#c56a4a" stroke="#0c0e11" stroke-width="0.5"/>
    <text x="0" y="-38" text-anchor="middle" font-size="12" fill="#c9d2c0">N</text>
    <text x="0" y="48" text-anchor="middle" font-size="10" fill="#6f7d70">S</text>
  </g>
</svg>
