  <text x="40" y="76" fill="#8b98a5" font-size="15">Proposal. The site plan, then Foundry Way from the street. Tiles x 912 to 914, y 910 to 911.</text>
  <g transform="translate(1190,46)">
    <text x="0" y="0" fill="#6b7684" font-size="12" text-anchor="middle">N</text>
    <line x1="0" y1="4" x2="0" y2="24" stroke="#6b7684" stroke-width="1.4"/>
    <polygon points="0,2 -4,10 4,10" fill="#6b7684"/>
  </g>

  <!-- ===================== SITE PLAN ===================== -->
