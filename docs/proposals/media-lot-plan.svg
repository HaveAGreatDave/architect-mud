  <text x="300" y="646" fill="#8b98a5" font-size="14" text-anchor="middle">Foundry Way</text>
  <text x="900" y="646" fill="#6b7684" font-size="13" text-anchor="middle">Tallow Row</text>

  <!-- Neighbours to the east -->
  <rect x="800" y="200" width="200" height="200" fill="#1f252e" stroke="#2f3742"/>
  <rect x="800" y="400" width="200" height="200" fill="#1f252e" stroke="#2f3742"/>
  <text x="900" y="298" fill="#6b7684" font-size="14" text-anchor="middle">Co-Pay &amp; Pray</text>
  <text x="900" y="318" fill="#566170" font-size="12" text-anchor="middle">clinic, not part of the lot</text>
  <text x="900" y="498" fill="#6b7684" font-size="14" text-anchor="middle">Treble Maker</text>
  <text x="900" y="518" fill="#566170" font-size="12" text-anchor="middle">music shop, not part of the lot</text>

  <!-- The Deadline (912,910) -->
  <path d="M 250 200 H 400 V 400 H 200 V 250 A 50 50 0 0 1 250 200 Z" fill="#d8cbab" stroke="#00000055"/>
  <text x="300" y="292" fill="#2a241a" font-size="17" font-weight="700" text-anchor="middle">The Deadline</text>
  <text x="300" y="313" fill="#5a4f3c" font-size="12.5" text-anchor="middle">the lot's pub</text>
  <text x="300" y="330" fill="#5a4f3c" font-size="12.5" text-anchor="middle">door on the street</text>

