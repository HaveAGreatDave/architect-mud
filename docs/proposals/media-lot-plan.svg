  <text x="700" y="326" fill="#5a4f3c" font-size="12.5" text-anchor="middle">press hall behind the glass</text>
  <rect x="640" y="400" width="80" height="16" fill="#a89c80" stroke="#00000055"/>
  <text x="680" y="412" fill="#2a241a" font-size="10" text-anchor="middle">loading dock</text>

