  <rect x="120" y="120" width="920" height="80" fill="#1b212b"/>
  <rect x="120" y="120" width="80" height="560" fill="#1b212b"/>
  <rect x="120" y="600" width="920" height="80" fill="#1b212b"/>
  <text x="900" y="166" fill="#8b98a5" font-size="14" text-anchor="middle">Marrow Street</text>
