  <circle cx="700" cy="224" r="9" fill="#f2ead8" stroke="#2a241a" stroke-width="1.2"/>
  <line x1="700" y1="224" x2="700" y2="218" stroke="#2a241a" stroke-width="1.2"/>
  <line x1="700" y1="224" x2="705" y2="226" stroke="#2a241a" stroke-width="1.2"/>
