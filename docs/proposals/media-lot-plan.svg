  <text x="300" y="434" fill="#2a241a" font-size="16" font-weight="700" text-anchor="middle">KSAB Stage 7</text>
  <text x="300" y="453" fill="#5a4f3c" font-size="12.5" text-anchor="middle">the sound stage and the mast</text>
  <polygon points="226,590 240,590 233,568" fill="none" stroke="#6b7684" stroke-width="1.4"/>
  <circle cx="233" cy="566" r="2.6" fill="#ff4d4d"/>

