<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0;height:100%;background:#05070a}#area-content{position:absolute;inset:0}
body.old .cab-controls{background:linear-gradient(#15181c,#0b0d10) !important;border-top-color:#2a2f36 !important}
body.old .cab-controls::before{height:2px !important;
  background:linear-gradient(90deg,transparent,var(--cab-glow,#e8c07a),transparent) !important;opacity:.35}
body.old .cab-controls::after{display:none}
body.old .cab-box,body.old .cab-steer,body.old .cab-look,body.old .cab-rockers,body.old .cab-cabctl{
  background:linear-gradient(#0b0f13,#070a0d) !important;border:1px solid #1b232b !important;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.75) !important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head><body><div id="area-content"></div>
<script type="module">
import { openCab } from './js/panels/cab-view.js';
const mount = document.getElementById('area-content');
if (new URLSearchParams(location.search).has('old')) document.body.classList.add('old');
openCab({ mount, tier: 1, name: 'HARNESS', x: 900, y: 900, heading: 180 });
</script><script>window.__shot=async()=>{const c=await html2canvas(document.body,{scale:1,backgroundColor:"#05070a",logging:false});return c.toDataURL("image/jpeg",0.82);};</script></body></html>
