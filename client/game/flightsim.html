<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ARCHITECT · FLIGHT SIM (open test)</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   FLIGHT SIM — open, no-login test rig. Mounts the REAL live cockpit
   (openFlightSim from cockpit.js) into a bare page and flies it over a
   procedurally-generated version of the world. Completely client-side: no
   websocket, no account. Served at /flightsim.html (lives in client/game/).

   The cockpit normally gets its map windows pushed from the server as you cross
   tiles. Here a client-side "context provider" plays that role: it watches the
   live position and regenerates a fresh procedural window through the same
   flightSimContext() seam — so the world scrolls smoothly (sub-tile offset) and
   is effectively infinite, exactly like live.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --accent:#8fd0ff; --font:'DejaVu Sans Mono','Consolas','Courier New',monospace;
  --bg:#04070c; --ink:#cfe4f2; --ink-dim:#6f8698; --panel:#0b1219;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{ background:var(--bg); color:var(--ink); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:none; }
#output{ display:none; }                                   /* appendMsg() sink — never shown here */

#page{ height:100%; display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px; }
#bar{ display:flex; align-items:center; gap:14px; width:min(94vw,900px); flex:0 0 auto; }
#bar .title{ font-size:12px; letter-spacing:3px; color:var(--accent); }
#bar .sub{ font-size:9px; letter-spacing:1.5px; color:var(--ink-dim); }
#bar .spacer{ flex:1; }
#bar label{ font-size:9px; letter-spacing:1.5px; color:var(--ink-dim); }
#craftSel{ background:var(--panel); border:1px solid #16242f; color:var(--accent);
  border-radius:7px; padding:7px 9px; font-family:var(--font); font-size:12px; }
#respawn{ background:#0f2231; border:1px solid #315c6f; color:var(--accent);
  border-radius:7px; padding:8px 12px; font-family:var(--font); font-size:11px; letter-spacing:1px; cursor:pointer; }
#respawn:hover{ background:#153046; }

/* The live cockpit mounts into #area-content, exactly as it does in the game area pane. */
#area-pane{ width:min(94vw,900px); flex:1 1 auto; min-height:0; overflow:auto; }
#area-content{ min-height:100%; }

#hint{ flex:0 0 auto; font-size:9px; letter-spacing:1px; color:var(--ink-dim); line-height:1.6; text-align:center; max-width:min(94vw,900px); }
#hint b{ color:var(--accent); font-weight:normal; }
</style>
</head>
<body>

<div id="page">
  <div id="bar">
    <div>
      <div class="title">ARCHITECT · FLIGHT SIM</div>
      <div class="sub">open test — no login · live cockpit · procedural world</div>
    </div>
    <div class="spacer"></div>
    <label for="craftSel">AIRCRAFT</label>
    <select id="craftSel"></select>
    <button id="respawn" title="respawn on the strip (or after a crash/park)">↺ RESPAWN</button>
  </div>

  <div id="area-pane"><div id="area-content"></div></div>

  <div id="hint">
    <b>Yoke</b> drag (springs to centre) · <b>Throttle</b> lever · <b>⏻</b> engine master · <b>Flaps</b> switch &nbsp;|&nbsp;
    keys: <b>↑↓←→</b> fly · <b>A/Z</b> throttle · <b>F</b> flaps · <b>G</b> gear · <b>Q/E</b> look &nbsp;—&nbsp;
    roll down the strip past the rotate speed, ease back, and climb away.
  </div>
</div>

<!-- appendMsg (imported transitively by the cockpit's module graph) writes here; kept hidden. -->
<div id="output"></div>

<script type="module">
import { openFlightSim, closeFlightSim, isFlightSimActive, flightSimContext, flightSimSnapshot } from './js/panels/cockpit.js';
import { TYPES } from './js/panels/flight-model.js';

// ── Fleet (fixed-wing only — the Dragonfly is a helicopter needing collective +
//    pedals, a different control set; left out of this simple open test). ─────────
const FLEET = [
  { key:'mule',      cls:'prop',       engines:2, seats:9,  name:'Mule',      blurb:'Twin-turboprop STOL hauler — rugged, strong climber off short strips.' },
  { key:'mayfly',    cls:'ultralight', engines:1, seats:2,  name:'Mayfly',    blurb:'Featherweight trainer — slow, docile, very hard to stall. Start here.' },
  { key:'carcass',   cls:'wreck',      engines:1, seats:2,  name:'Carcass',   blurb:'Salvaged wreck — underpowered, draggy and twitchy; nurse it aloft.' },
  { key:'reaper',    cls:'gunship',    engines:2, seats:1,  name:'Reaper',    blurb:'Warthog-class platform — slow and draggy, rock-stable down low.' },
  { key:'leviathan', cls:'heavy',      engines:4, seats:6,  name:'Leviathan', blurb:'Four-engine heavy freighter — ponderous; needs a real runway.' },
];
const byKey = (k) => FLEET.find(f => f.key === k) || FLEET[0];
let craftKey = 'mule';

// ── Procedural world ──────────────────────────────────────────────────────────
// A deterministic hash → the same "basic version of the world" wherever you fly:
// varied building districts, tree parks, and a meandering river, with the departure
// corridor down the strip kept clear. The cockpit anchors a world-fixed runway at
// the spawn tile (0,0) and seeds each building by its WORLD coordinate, so the map
// window can recenter under you without anything popping or re-shuffling.
const RAD = 11;                    // window half-size (23×23) — covers the 7.5-tile draw range + slop
const RECENTER = 3;                // regenerate + recenter once you drift this many tiles from centre
const BUILDING_BIOMES = ['citycore','uptown','civic','industrial','infra','freight','ruins','marquee'];
function hash2(x, y){ let h = (Math.imul(x|0, 73856093) ^ Math.imul(y|0, 19349663)) >>> 0; return h / 4294967295; }
function worldCell(x, y){
  // Keep the strip you take off from clear of obstacles (x=0 column, a few tiles
  // ahead of / behind the threshold at origin).
  if (x === 0 && y <= 2 && y >= -6) return { kind:'air' };
  if (Math.abs((x*3 + y) % 19) === 0) return { kind:'land', biome:'water' };            // meandering river
  const r = hash2(x, y);
  if (r > 0.74){ const b = BUILDING_BIOMES[(hash2(x+7, y-3) * BUILDING_BIOMES.length) | 0]; return { kind:'land', biome:b }; }  // building district
  if (r > 0.60) return { kind:'land', biome:'parkland' };                                // tree park
  if (r > 0.55) return { kind:'land', biome:'badlands' };                                // scrub / rocks
  return { kind:'air' };                                                                 // open ground
}
function genWindow(cx, cy){
  const rows = [];
  for (let y = -RAD; y <= RAD; y++){ const row = [];
    for (let x = -RAD; x <= RAD; x++) row.push(worldCell(cx + x, cy + y));
    rows.push(row);
  }
  return rows;
}

const SKY = { hour:14, weather:'clear', wind:0 };

// ── Launch / relaunch the live cockpit ────────────────────────────────────────
function launch(){
  const c = byKey(craftKey);
  closeFlightSim();
  openFlightSim({
    craftType: c.key, craftClass: c.cls, deviceName: c.name,
    registration: c.name.toUpperCase(), owner: 'OPEN TEST',
    gx: 0, gy: 0, heading: 0, engineOn: true,      // engine already running so you can just push the throttle
    fuel: 100, fuelCap: 100,
    map: genWindow(0, 0), sky: SKY, biomeBelow: null,
    fields: [{ id: 'home', name: 'Test Field', gx: 0, gy: 0 }],
    engines: c.engines, seats: c.seats, occupants: [], hardpoints: 0,
    airport: 'default',
  });
  // openFlightSim already seeds the initial window + its paired centre (0,0); the
  // provider loop below takes over pushing fresh windows as you fly.
}

// ── Context provider — plays the server's role of pushing fresh map windows ─────
// Each frame: if the sim ended (rolled to a stop & parked, or crashed), respawn on
// the strip after a beat. Otherwise, once the aircraft has drifted RECENTER tiles
// from the current window centre, regenerate a procedural window centred on it and
// push it through flightSimContext — the cockpit blends it in seamlessly (buildings
// are world-seeded, so nothing pops on the recenter).
let downTimer = 0;
function provide(){
  requestAnimationFrame(provide);
  if (!isFlightSimActive()){
    // Sim torn down (park after a full-stop landing, or a stuck post-crash state) →
    // auto-respawn shortly so the open test never dead-ends.
    if (!downTimer) downTimer = performance.now();
    else if (performance.now() - downTimer > 1400){ downTimer = 0; launch(); }
    return;
  }
  downTimer = 0;
  const snap = flightSimSnapshot(); if (!snap) return;
  const dx = snap.pos.x - snap.mapCenter.x, dy = snap.pos.y - snap.mapCenter.y;
  if (Math.hypot(dx, dy) >= RECENTER){
    const cx = Math.round(snap.pos.x), cy = Math.round(snap.pos.y);
    flightSimContext({ map: genWindow(cx, cy), mapX: cx, mapY: cy, sky: SKY });
  }
}

// ── Page chrome ───────────────────────────────────────────────────────────────
const sel = document.getElementById('craftSel');
FLEET.forEach(f => { const o = document.createElement('option'); o.value = f.key; o.textContent = f.name; sel.appendChild(o); });
sel.value = craftKey;
sel.addEventListener('change', () => { craftKey = sel.value; launch(); });
document.getElementById('respawn').addEventListener('click', launch);

launch();
requestAnimationFrame(provide);
</script>
</body>
</html>
