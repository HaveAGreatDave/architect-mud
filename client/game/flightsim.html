<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ARCHITECT · FLIGHT SIM (open test)</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   FLIGHT SIM — open, no-login test rig. Mounts the REAL live cockpit
   (openFlightSim from cockpit.js) FULLSCREEN and flies it over a procedurally
   generated version of the world. Completely client-side: no websocket, no
   account. Served at /flightsim.html (lives in client/game/).

   The cockpit's own CSS (injected by ensureFlightSimStyles as `.fsim-*`) lays it
   out as a fixed view/glass/ctl stack sized for the in-game area pane. Here we
   override those (via higher-specificity `#area-content .fsim-*` rules) so the
   cockpit fills the whole viewport — no surrounding window, no text pane — and,
   on mobile, drops a big yoke into its own bottom band clear of the gauges.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --accent:#8fd0ff; --font:'DejaVu Sans Mono','Consolas','Courier New',monospace;
  --bg:#04070c; --ink:#cfe4f2; --ink-dim:#6f8698; --panel:#0b1219;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{ background:var(--bg); color:var(--ink); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:none; -webkit-user-select:none; user-select:none; }
#output{ display:none; }                                   /* appendMsg() sink — never shown here */

/* ── Fullscreen cockpit: the pane and the cockpit fill the entire viewport ───── */
#page{ width:100vw; height:100vh; height:100dvh; }
#area-pane{ width:100vw; height:100vh; height:100dvh; overflow:hidden; }
#area-content{ height:100%; }
#area-content .fsim{ height:100%; gap:5px; padding:6px; }
#area-content .fsim-view{ flex:1 1 auto; height:auto; min-height:0; }   /* out-the-glass view grows to fill the top */

/* ── Floating chrome: a compact translucent control, tucked under the cockpit's
   own ⛶/⚙ buttons (top-right) so it never eats layout or covers the gauges ──── */
#chrome{ position:fixed; top:34px; right:6px; z-index:40; display:flex; gap:7px; align-items:center;
  background:rgba(6,12,18,.6); border:1px solid #16303f; border-radius:8px; padding:5px 7px; backdrop-filter:blur(3px); }
#craftSel{ background:var(--panel); border:1px solid #16242f; color:var(--accent);
  border-radius:6px; padding:6px 7px; font-family:var(--font); font-size:12px; }
#respawn,#wxToggle{ background:#0f2231; border:1px solid #315c6f; color:var(--accent);
  border-radius:6px; padding:7px 9px; font-family:var(--font); font-size:11px; letter-spacing:1px; cursor:pointer; }
#respawn:active,#wxToggle:active{ transform:translateY(1px); }
#wxToggle.on{ background:#123a2a; border-color:#3f8f6a; color:#8fffcf; }   /* lit when the demo front is up */

/* ── Mobile: a bigger yoke, dropped into its own bottom band, clear of the gauges.
   The cockpit normally lets the yoke graphic rise UP into the gauge panel
   (top:-120%); on a phone that overlaps the instruments, so here the yoke gets
   the full width of a taller bottom row and stays contained within it. ───────── */
@media (max-width: 820px){
  #area-content .fsim{ gap:4px; padding:4px; }
  #area-content .fsim-glass{ height:21vh; }
  #area-content .fsim-rightctl{ flex:0 0 112px; }         /* throttle · engine · flaps (roomier gate) stay, a touch narrower */
  #area-content .fsim-ctl{ height:34vh; }                 /* tall bottom band = a big yoke, further down */
  #area-content .fsim-placard,
  #area-content .fsim-xpdr{ display:none; }               /* hand the whole bottom row to the yoke */
  #area-content .fsim-yoke{ flex:1 1 auto; }
  #area-content .fsim-yoke-svg{ left:7%; top:2%; width:86%; height:96%;
    transform-origin:50% 58%; }                           /* large, and contained — no longer overlapping the gauges */
  #area-content .fsim-climbmark{ top:60%; }
}
</style>
</head>
<body>

<div id="page">
  <div id="area-pane"><div id="area-content"></div></div>
</div>

<!-- Floating aircraft picker + respawn — sits OVER the cockpit, outside #area-content
     so it survives the cockpit re-mounting itself into the pane. -->
<div id="chrome">
  <select id="craftSel" title="aircraft"></select>
  <button id="wxToggle" title="toggle a demo weather front (fly-through clouds)">☁ WX</button>
  <button id="respawn" title="respawn on the strip (or after a crash/park)">↺</button>
</div>

<!-- appendMsg (imported transitively by the cockpit's module graph) writes here; kept hidden. -->
<div id="output"></div>

<!-- The cockpit's whole soundscape (engine-audio.js: engine synth, slipstream, ground roll,
     weather bed, one-shot cues) is guarded on window.AudioEngine / window.SFXCatalog — plain
     globals the main client loads before its modules. Load them here too, or the open test
     flies silent. audio-engine.js installs its own touch/click unlock; keydown is added below. -->
<script src="/shared/audio-engine.js"></script>
<script src="/shared/sfx-catalog.js"></script>

<script type="module">
import { openFlightSim, closeFlightSim, isFlightSimActive, flightSimContext, flightSimSnapshot } from './js/panels/cockpit.js';
import { TYPES } from './js/panels/flight-model.js';

// Autoplay unlock: the audio engine self-unlocks on touch/click, but the sim is flyable purely
// from the keyboard — so resume the context on the first keypress too (one-shot).
window.addEventListener('keydown', () => window.AudioEngine?.init?.(), { once: true });

// ── Fleet (fixed-wing only — the Dragonfly is a helicopter needing collective +
//    pedals, a different control set; left out of this simple open test). ─────────
const FLEET = [
  { key:'mule',      cls:'prop',       engines:2, seats:9,  name:'Mule' },
  { key:'mayfly',    cls:'ultralight', engines:1, seats:2,  name:'Mayfly' },
  { key:'carcass',   cls:'wreck',      engines:1, seats:2,  name:'Carcass' },
  { key:'reaper',    cls:'gunship',    engines:2, seats:1,  name:'Reaper' },
  { key:'leviathan', cls:'heavy',      engines:4, seats:6,  name:'Leviathan' },
];
const byKey = (k) => FLEET.find(f => f.key === k) || FLEET[0];
let craftKey = 'mule';

// ── Live world snapshot ─────────────────────────────────────────────────────────
// The REAL Coldwater map_world surface, captured by scripts/snapshot-flight-world.mjs
// into flightsim-world.json — one entry per tile, in the EXACT cell shape the flight
// plugin (plugins/flight/state.js mapWindow) streams to the cockpit, so the windshield
// renders these tiles identically to a live flight. We slice a window out of it as the
// aircraft drifts, so the open test flies over the actual city — bay, districts, runway
// and all — with no server. Re-run the snapshot script to refresh after a map change.
const WORLD = await fetch('./flightsim-world.json').then(r => r.json());
const RAD = 24;                    // window half-size (49×49) — matches the flight plugin's mapWindow radius so the far skyline never starves
const RECENTER = 4;                // regenerate + recenter once you drift this many tiles from centre
function worldCell(x, y){ return WORLD.cells[`${x},${y}`] || { kind:'air' }; }   // beyond the real map ⇒ open air, exactly like the server's null tile
function genWindow(cx, cy){
  const rows = [];
  for (let y = -RAD; y <= RAD; y++){ const row = [];
    for (let x = -RAD; x <= RAD; x++){
      if (x === 0 && y === 0){ row.push({ kind:'craft' }); continue; }   // centre = the aircraft's own tile (the model is drawn separately)
      row.push(worldCell(cx + x, cy + y));
    }
    rows.push(row);
  }
  return rows;
}
const biomeAt = (x, y) => (WORLD.cells[`${x},${y}`] || {}).biome || null;

// Spawn on a real field — prefer one with a runway (fixed-wing needs a strip). The
// cockpit anchors a world-fixed departure runway from opts.runway and nudges the parked
// craft ~1.3 tiles forward down it, so the paired window centre is that nudged point —
// generate the initial window there so tiles and centre line up with no first-frame jump.
const SPAWN = WORLD.fields.find(f => f.runway) || WORLD.fields[0] || { gx:0, gy:0, runway:null };
const SPAWN_X = SPAWN.runway ? SPAWN.runway.ox : SPAWN.gx;
const SPAWN_Y = SPAWN.runway ? SPAWN.runway.oy : SPAWN.gy;
const SPAWN_HDG = SPAWN.runway ? SPAWN.runway.hdg : 0;
const _hr = SPAWN_HDG * Math.PI / 180, _fwd = SPAWN.runway ? 1.3 : 0;
const CENTER_X = Math.round(SPAWN_X + Math.sin(_hr) * _fwd);   // mirrors openFlightSim's mapCenter nudge
const CENTER_Y = Math.round(SPAWN_Y - Math.cos(_hr) * _fwd);
const FIELDS = WORLD.fields.map(f => ({ id:f.id, name:f.name, gx:f.gx, gy:f.gy }));   // ✈ waypoint targets ([ ] cycling)

const SKY = { hour:14, weather:'clear', wind:0 };

// ── Demo weather front (the ☁ WX toggle) ──────────────────────────────────────
// The real game plumbs sky.field from the server; this open rig has none, so the
// fly-through cloud deck (windshield.js) has no cells to render. This is a stand-in
// field — a scatter of drifting cloud cells + one storm — in the SAME shape the
// server sends (cells advected by stepWeatherCells, sampled for rain/whiteout). Flip
// it on to climb into real clouds; off restores clear skies. Cells drift on their own
// velocities and torus-wrap inside `bounds`, so a front keeps circling back to fly through.
// Anchored on the spawn (the sim now flies at real world coords, not the origin): cells
// sit a short way north of the strip — the heading-0 takeoff direction — so you climb into
// them straight off the runway.
const WX_FIELD = {
  tick: 30,
  bounds: { minX: SPAWN_X - 70, maxX: SPAWN_X + 70, minY: SPAWN_Y - 70, maxY: SPAWN_Y + 70 },
  cells: [
    { x: SPAWN_X +  0, y: SPAWN_Y - 24, r:15, intensity:0.80, type:'cloud',                 vx: 0.6, vy: 0.2 },
    { x: SPAWN_X - 20, y: SPAWN_Y - 44, r:19, intensity:0.95, type:'cloud',                 vx: 0.4, vy: 0.5 },
    { x: SPAWN_X + 24, y: SPAWN_Y - 58, r:16, intensity:1.00, type:'storm', precip:'rain',  vx:-0.3, vy: 0.4 },
    { x: SPAWN_X + 32, y: SPAWN_Y +  9, r:13, intensity:0.70, type:'cloud',                 vx: 0.5, vy:-0.3 },
    { x: SPAWN_X - 32, y: SPAWN_Y + 14, r:16, intensity:0.85, type:'cloud',                 vx: 0.2, vy:-0.4 },
  ],
};
let wxOn = false;
function setWeather(on){
  wxOn = on;
  SKY.weather = on ? 'cloudy' : 'clear';
  SKY.field   = on ? WX_FIELD : undefined;
  document.getElementById('wxToggle').classList.toggle('on', on);
  flightSimContext({ sky: SKY });   // takes effect on the next render frame (F.sky.field)
}

// ── Launch / relaunch the live cockpit ────────────────────────────────────────
function launch(){
  const c = byKey(craftKey);
  closeFlightSim();
  openFlightSim({
    craftType: c.key, craftClass: c.cls, deviceName: c.name,
    registration: c.name.toUpperCase(), owner: 'OPEN TEST',
    gx: SPAWN_X, gy: SPAWN_Y, heading: SPAWN_HDG, engineOn: true,   // engine already running so you can just push the throttle
    fuel: 100, fuelCap: 100,
    map: genWindow(CENTER_X, CENTER_Y), sky: SKY, biomeBelow: biomeAt(CENTER_X, CENTER_Y),
    runway: SPAWN.runway || undefined,             // real departure strip on the map's runway tiles
    fields: FIELDS,
    engines: c.engines, seats: c.seats, occupants: [], hardpoints: 0,
    airport: 'default',
  });
  // openFlightSim already seeds the initial window + its paired centre (0,0); the
  // provider loop below takes over pushing fresh windows as you fly.
}

// ── Context provider — plays the server's role of pushing fresh map windows ─────
// Each frame: if the sim ended (rolled to a stop & parked, or crashed), respawn on
// the strip after a beat. Otherwise, once the aircraft has drifted RECENTER tiles
// from the current window centre, regenerate a procedural window centred on it and
// push it through flightSimContext — the cockpit blends it in seamlessly (buildings
// are world-seeded, so nothing pops on the recenter).
let downTimer = 0;
function provide(){
  requestAnimationFrame(provide);
  if (!isFlightSimActive()){
    // Sim torn down (park after a full-stop landing, or a stuck post-crash state) →
    // auto-respawn shortly so the open test never dead-ends.
    if (!downTimer) downTimer = performance.now();
    else if (performance.now() - downTimer > 1400){ downTimer = 0; launch(); }
    return;
  }
  downTimer = 0;
  const snap = flightSimSnapshot(); if (!snap) return;
  const dx = snap.pos.x - snap.mapCenter.x, dy = snap.pos.y - snap.mapCenter.y;
  if (Math.hypot(dx, dy) >= RECENTER){
    const cx = Math.round(snap.pos.x), cy = Math.round(snap.pos.y);
    flightSimContext({ map: genWindow(cx, cy), mapX: cx, mapY: cy, sky: SKY, biomeBelow: biomeAt(cx, cy) });
  }
}

// ── Page chrome ───────────────────────────────────────────────────────────────
const sel = document.getElementById('craftSel');
FLEET.forEach(f => { const o = document.createElement('option'); o.value = f.key; o.textContent = f.name; sel.appendChild(o); });
sel.value = craftKey;
sel.addEventListener('change', () => { craftKey = sel.value; launch(); });
document.getElementById('respawn').addEventListener('click', launch);
document.getElementById('wxToggle').addEventListener('click', () => setWeather(!wxOn));

launch();
requestAnimationFrame(provide);
</script>
</body>
</html>
