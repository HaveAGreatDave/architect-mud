<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHITECT</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #111116;
    --bg3: #18181f;
    --border: #2a2a35;
    --text: #c8c8d4;
    --text-dim: #5a5a70;
    --text-bright: #e8e8f0;
    --accent: #7b68ee;
    --accent-dim: #3d3470;
    --green: #4caf74;
    --red: #e05555;
    --orange: #e0914a;
    --yellow: #d4c44a;
    --cyan: #4ab8d4;
    --purple: #9b59b6;
    --font-mono: 'Courier New', 'Lucida Console', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── HEADER ─── */
  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  #header .logo {
    color: var(--accent);
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  #header .conn-status {
    font-size: 11px;
    color: var(--text-dim);
  }
  #header .conn-status.online { color: var(--green); }
  #header .conn-status.offline { color: var(--red); }

  #header .handle-display {
    margin-left: auto;
    color: var(--accent);
    font-size: 12px;
  }

  /* ─── MAIN LAYOUT ─── */
  #main {
    display: grid;
    grid-template-columns: 1fr 240px;
    flex: 1;
    overflow: hidden;
  }

  /* ─── OUTPUT PANE ─── */
  #output-container {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    scroll-behavior: smooth;
  }

  #output::-webkit-scrollbar { width: 6px; }
  #output::-webkit-scrollbar-track { background: var(--bg2); }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { padding: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .msg + .msg { }

  .msg-system { color: var(--text-dim); font-style: italic; }
  .msg-look { color: var(--text-bright); }
  .msg-combat { color: var(--orange); }
  .msg-combat-incoming { color: var(--red); }
  .msg-death { color: var(--red); font-weight: bold; }
  .msg-ambient { color: var(--text-dim); font-style: italic; }
  .msg-say { color: var(--cyan); }
  .msg-zone-event { color: var(--text-dim); font-style: italic; }
  .msg-error { color: var(--red); }
  .msg-loot { color: var(--green); }
  .msg-help { color: var(--text); }
  .msg-separator { color: var(--border); margin: 4px 0; }

  /* Rich text styles used in game output */
  .zone-name { color: var(--accent); font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
  .zone-danger { font-size: 11px; padding: 1px 5px; border-radius: 2px; }
  .zone-danger-safe { color: var(--green); border: 1px solid var(--green); }
  .zone-danger-low { color: var(--yellow); border: 1px solid var(--yellow); }
  .zone-danger-medium { color: var(--orange); border: 1px solid var(--orange); }
  .zone-danger-high { color: var(--red); border: 1px solid var(--red); }
  .zone-danger-lethal { color: var(--red); border: 1px solid var(--red); background: rgba(224,85,85,0.15); }
  .rad-warning { color: var(--green); font-size: 11px; }
  .pvp-warning { color: var(--red); font-size: 11px; }
  .exits-label, .npcs-label, .enemies-label, .corpses-label { color: var(--text-dim); }
  .enemies-label { color: var(--orange); }
  .inv-header, .stats-header, .skills-header, .who-header, .help-header { color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
  .equipped { color: var(--green); }
  .item-rarity-common { color: var(--text-dim); }
  .item-rarity-uncommon { color: var(--green); }
  .item-rarity-rare { color: var(--cyan); }
  .item-rarity-very_rare { color: var(--purple); }
  .skill-category { color: var(--accent-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .help-category { color: var(--accent); }
  .death-message { color: var(--red); font-size: 13px; }

  /* ─── INPUT BAR ─── */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    background: var(--bg2);
    flex-shrink: 0;
  }

  #prompt { color: var(--accent); align-self: center; user-select: none; }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-bright);
    font-family: var(--font-mono);
    font-size: 14px;
    outline: none;
    caret-color: var(--accent);
  }

  #cmd-input::placeholder { color: var(--text-dim); }

  /* Quick command buttons */
  #quick-cmds {
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    background: var(--bg);
    flex-shrink: 0;
  }

  .qcmd {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.1s;
  }
  .qcmd:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── SIDEBAR ─── */
  #sidebar {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg2);
  }

  .sidebar-section {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* Vitals bars */
  .vital { margin-bottom: 6px; }
  .vital-label { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 2px; }
  .vital-bar-bg { background: var(--bg3); height: 6px; border-radius: 1px; }
  .vital-bar { height: 100%; border-radius: 1px; transition: width 0.3s; }
  .vital-hp .vital-bar { background: var(--green); }
  .vital-sanity .vital-bar { background: var(--purple); }
  .vital-hunger .vital-bar { background: var(--yellow); }
  .vital-thirst .vital-bar { background: var(--cyan); }
  .vital-radiation .vital-bar { background: var(--orange); }
  .vital-bar.low { background: var(--red); }

  /* Zone info */
  #zone-name-display {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  #exits-display {
    font-size: 11px;
    color: var(--text-dim);
  }

  .exit-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    margin: 2px;
    border-radius: 2px;
    transition: all 0.1s;
  }
  .exit-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Dialogue panel */
  #dialogue-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #dialogue-panel.active { display: flex; }

  #dialogue-box {
    background: var(--bg2);
    border: 1px solid var(--accent);
    padding: 24px;
    max-width: 540px;
    width: 90%;
    border-radius: 2px;
  }
  #dialogue-npc-name { color: var(--accent); font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  #dialogue-text { color: var(--text-bright); margin-bottom: 16px; line-height: 1.6; white-space: pre-wrap; }
  #dialogue-options { display: flex; flex-direction: column; gap: 6px; }
  .dialogue-opt {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 12px;
    cursor: pointer;
    text-align: left;
    border-radius: 2px;
    transition: all 0.1s;
  }
  .dialogue-opt:hover { border-color: var(--accent); color: var(--accent); }

  /* Auth screen */
  #auth-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #auth-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 32px;
    width: 340px;
    border-radius: 2px;
  }

  #auth-box h1 {
    color: var(--accent);
    font-size: 22px;
    letter-spacing: 6px;
    text-align: center;
    margin-bottom: 4px;
  }

  #auth-box .tagline {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-bottom: 24px;
  }

  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .auth-field input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    border-radius: 2px;
    transition: border-color 0.15s;
  }
  .auth-field input:focus { border-color: var(--accent); }

  .auth-btn {
    width: 100%;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--text-bright);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.15s;
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .auth-btn:hover { background: var(--accent); color: var(--bg); }

  .auth-toggle {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .auth-toggle a:hover { text-decoration: underline; }

  .auth-error { color: var(--red); font-size: 11px; margin-top: 8px; text-align: center; min-height: 16px; }

  .auth-handle-field { display: none; }
  .auth-handle-field.visible { display: block; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div id="auth-box">
    <h1>ARCHITECT</h1>
    <div class="tagline">The AI won. You survived. Probably.</div>

    <div class="auth-field auth-handle-field" id="handle-field">
      <label>Handle (in-world name)</label>
      <input type="text" id="auth-handle" placeholder="How will you be known?" maxlength="24">
    </div>
    <div class="auth-field">
      <label>Username</label>
      <input type="text" id="auth-username" placeholder="username" autocomplete="username">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="password" autocomplete="current-password">
    </div>

    <button class="auth-btn" id="auth-submit">Enter</button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle">
      <span id="auth-toggle-text">No account?</span>
      <a id="auth-toggle-link">Register</a>
    </div>
  </div>
</div>

<!-- MAIN UI -->
<div id="header">
  <span class="logo">ARCHITECT</span>
  <span class="conn-status offline" id="conn-status">DISCONNECTED</span>
  <span class="handle-display" id="handle-display"></span>
</div>

<div id="main">
  <div id="output-container">
    <div id="output"></div>
    <div id="quick-cmds">
      <button class="qcmd" onclick="sendCmd('look')">look</button>
      <button class="qcmd" onclick="sendCmd('inventory')">inv</button>
      <button class="qcmd" onclick="sendCmd('stats')">stats</button>
      <button class="qcmd" onclick="sendCmd('skills')">skills</button>
      <button class="qcmd" onclick="sendCmd('who')">who</button>
      <button class="qcmd" onclick="sendCmd('help')">help</button>
      <button class="qcmd" onclick="sendCmd('recipes')">recipes</button>
      <button class="qcmd" onclick="sendCmd('factions')">factions</button>
      <button class="qcmd" onclick="sendCmd('mutations')">mutations</button>
    </div>
    <div id="input-area">
      <span id="prompt">&gt;</span>
      <input type="text" id="cmd-input" placeholder="Type a command..." autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Vitals</div>
      <div class="vital vital-hp">
        <div class="vital-label"><span>HP</span><span id="hp-val">—</span></div>
        <div class="vital-bar-bg"><div class="vital-bar" id="hp-bar" style="width:100%"></div></div>
      </div>
      <div class="vital vital-sanity">
        <div class="vital-label"><span>Sanity</span><span id="san-val">—</span></div>
        <div class="vital-bar-bg"><div class="vital-bar" id="san-bar" style="width:100%"></div></div>
      </div>
      <div class="vital vital-hunger">
        <div class="vital-label"><span>Hunger</span><span id="hun-val">—</span></div>
        <div class="vital-bar-bg"><div class="vital-bar" id="hun-bar" style="width:100%"></div></div>
      </div>
      <div class="vital vital-thirst">
        <div class="vital-label"><span>Thirst</span><span id="thi-val">—</span></div>
        <div class="vital-bar-bg"><div class="vital-bar" id="thi-bar" style="width:100%"></div></div>
      </div>
      <div class="vital vital-radiation">
        <div class="vital-label"><span>☢ Radiation</span><span id="rad-val">—</span></div>
        <div class="vital-bar-bg"><div class="vital-bar" id="rad-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Location</div>
      <div id="zone-name-display">—</div>
      <div id="exits-display"></div>
    </div>

    <div class="sidebar-section" id="enemy-section" style="display:none">
      <div class="sidebar-label" style="color:var(--red)">⚠ Hostiles</div>
      <div id="enemy-list" style="font-size:11px;color:var(--orange)"></div>
    </div>
  </div>
</div>

<!-- DIALOGUE PANEL -->
<div id="dialogue-panel">
  <div id="dialogue-box">
    <div id="dialogue-npc-name"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-options"></div>
    <button class="dialogue-opt" style="margin-top:10px;color:var(--text-dim)" onclick="closeDialogue()">[ Leave ]</button>
  </div>
</div>

<script>
const WS_URL = `ws://${location.host}`;
let ws = null;
let player = null;
let cmdHistory = [];
let historyIdx = -1;
let isRegister = false;
let currentNpcId = null;
let currentZone = null;

// --- WebSocket ---
let reconnectDelay = 1000;
let coldStartTimer = null;

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    reconnectDelay = 1000;
    setConnStatus('online', 'CONNECTED');
    if (coldStartTimer) { clearTimeout(coldStartTimer); coldStartTimer = null; hideColdStart(); }
    if (!player) appendMsg('Connected to ARCHITECT. Login or register to enter.', 'system');
    // Client-side ping every 10s to keep Render free tier alive
    setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ping'})); }, 10000);
  };

  ws.onclose = () => {
    setConnStatus('offline', 'DISCONNECTED');
    // Show cold-start notice after 5s of disconnect
    coldStartTimer = setTimeout(showColdStart, 5000);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
    setTimeout(connect, reconnectDelay);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMsg(msg);
  };
}

function handleServerMsg(msg) {
  switch(msg.type) {
    case 'connected': break;
    case 'auth_success':
      player = msg.player;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('handle-display').textContent = player.handle;
      updateVitals(player);
      break;
    case 'auth_fail':
      document.getElementById('auth-error').textContent = msg.message;
      break;
    case 'look':
      appendMsg('─'.repeat(50), 'separator');
      appendHtml(msg.message, 'look');
      parseZoneInfo(msg.message);
      break;
    case 'move':
      appendHtml(msg.message, 'look');
      currentZone = msg.zone;
      parseZoneInfo(msg.message);
      if (msg.radiation_gain > 0) appendMsg(`☢ +${msg.radiation_gain} radiation absorbed.`, 'system');
      if (player) { player.radiation = Math.min(100, (player.radiation||0) + (msg.radiation_gain||0)); updateVitals(player); }
      break;
    case 'combat':
      appendHtml(msg.message, msg.killed ? 'loot' : 'combat');
      if (msg.killed && msg.loot?.length) {
        appendMsg(`Loot: ${msg.loot.map(l => `${l.item_id} x${l.quantity}`).join(', ')}`, 'loot');
      }
      break;
    case 'combat_incoming':
      appendHtml(msg.message, 'combat-incoming');
      if (player) { player.hp = msg.hp; updateVitals(player); }
      break;
    case 'combat_miss':
      appendMsg(msg.message, 'system');
      break;
    case 'player_death':
      appendHtml(msg.message, 'death');
      if (player) { player.hp = 10; updateVitals(player); }
      setTimeout(() => { sendCmd('look'); }, 1500);
      break;
    case 'ambient':
      appendHtml(msg.message, 'ambient');
      break;
    case 'zone_event':
      appendMsg(msg.message, 'zone-event');
      break;
    case 'say':
      appendMsg(msg.message, 'say');
      break;
    case 'inventory':
      appendHtml(msg.message, 'help');
      break;
    case 'stats':
      appendHtml(msg.message, 'help');
      if (msg.player) updateVitals(msg.player);
      break;
    case 'skills':
      appendHtml(msg.message, 'help');
      break;
    case 'who': case 'help': case 'examine': case 'take': case 'drop': case 'equip':
      appendHtml(msg.message, 'help');
      break;
    case 'use':
      appendHtml(msg.message, 'loot');
      if (msg.player_update) updateVitals(msg.player_update);
      break;
    case 'dialogue':
      openDialogue(msg);
      break;
    case 'dialogue_end':
      closeDialogue();
      appendMsg(msg.message, 'system');
      break;
    case 'status_tick':
      for (const m of msg.messages) appendMsg(m, 'combat-incoming');
      break;
    case 'resource_tick':
      for (const m of msg.messages) appendMsg(m, 'system');
      if (msg.player_update && player) {
        Object.assign(player, msg.player_update);
        updateVitals(player);
      }
      break;
    case 'player_update':
      if (player) { Object.assign(player, msg); updateVitals(player); }
      break;
    case 'error':
      appendMsg(msg.message, 'error');
      break;
    case 'craft': case 'buy': case 'sell': case 'loot':
      appendHtml(msg.message, 'loot');
      break;
    case 'recipes': case 'mutations': case 'factions': case 'shop':
      appendHtml(msg.message, 'help');
      break;
    case 'mutation_gained':
      appendHtml(msg.message, 'combat-incoming');
      break;
    case 'kicked':
      appendMsg(msg.message, 'error');
      ws.close();
      break;
    case 'pong': break; // keepalive
  }
}

function showColdStart() {
  let el = document.getElementById('cold-start-notice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cold-start-notice';
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--accent);padding:24px;text-align:center;z-index:300;border-radius:2px;max-width:320px';
    el.innerHTML = '<div style="color:var(--accent);font-size:13px;letter-spacing:2px;margin-bottom:8px">ARCHITECT</div><div style="color:var(--text-dim);font-size:12px;line-height:1.6">Server is waking up.<br>Free tier cold start — about 60 seconds.<br><span style="color:var(--text);font-size:11px">Reconnecting automatically...</span></div>';
    document.body.appendChild(el);
  }
  el.style.display = 'block';
}

function hideColdStart() {
  const el = document.getElementById('cold-start-notice');
  if (el) el.style.display = 'none';
}

// --- Auth ---
function doAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const handle = document.getElementById('auth-handle').value.trim();
  const errEl = document.getElementById('auth-error');

  if (!username || !password) { errEl.textContent = 'Username and password required.'; return; }
  if (isRegister && !handle) { errEl.textContent = 'Handle required.'; return; }

  errEl.textContent = '';

  if (isRegister) {
    fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password, handle})
    }).then(r => r.json()).then(data => {
      if (data.error) { errEl.textContent = data.error; return; }
      // Now auth via WS
      ws.send(JSON.stringify({ type: 'auth', username, password }));
    });
  } else {
    ws.send(JSON.stringify({ type: 'auth', username, password }));
  }
}

document.getElementById('auth-submit').addEventListener('click', doAuth);
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

document.getElementById('auth-toggle-link').addEventListener('click', () => {
  isRegister = !isRegister;
  document.getElementById('handle-field').classList.toggle('visible', isRegister);
  document.getElementById('auth-toggle-text').textContent = isRegister ? 'Have an account?' : 'No account?';
  document.getElementById('auth-toggle-link').textContent = isRegister ? 'Login' : 'Register';
  document.getElementById('auth-submit').textContent = isRegister ? 'Register' : 'Enter';
});

// --- Command input ---
const input = document.getElementById('cmd-input');
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const cmd = input.value.trim();
    if (!cmd) return;
    cmdHistory.unshift(cmd);
    historyIdx = -1;
    input.value = '';
    appendMsg(`> ${cmd}`, 'system');
    sendCmd(cmd);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < cmdHistory.length - 1) { historyIdx++; input.value = cmdHistory[historyIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) { historyIdx--; input.value = cmdHistory[historyIdx]; }
    else { historyIdx = -1; input.value = ''; }
  }
});

function sendCmd(cmd) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'command', command: cmd }));
}

// Auto-focus the game command input when user types anywhere —
// but never steal focus while another input/textarea is active
// (e.g. the login form) or while the auth screen is showing.
document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (document.getElementById('auth-screen').style.display !== 'none') return;
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    input.focus();
  }
});

// --- Output ---
function appendMsg(text, cls = '') {
  const el = document.createElement('div');
  el.className = `msg msg-${cls}`;
  el.textContent = text;
  document.getElementById('output').appendChild(el);
  scrollOutput();
}

function appendHtml(html, cls = '') {
  const el = document.createElement('div');
  el.className = `msg msg-${cls}`;
  el.innerHTML = html;
  document.getElementById('output').appendChild(el);
  scrollOutput();
}

function scrollOutput() {
  const out = document.getElementById('output');
  out.scrollTop = out.scrollHeight;
}

// --- Vitals ---
function updateVitals(p) {
  setBar('hp', p.hp, p.hp_max || 100);
  setBar('san', p.sanity, p.sanity_max || 100);
  setBar('hun', p.hunger, 100);
  setBar('thi', p.thirst, 100);
  setBar('rad', p.radiation, 100, true);
}

function setBar(id, val, max, inverse = false) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100));
  const bar = document.getElementById(`${id}-bar`);
  const valEl = document.getElementById(`${id}-val`);
  if (bar) {
    bar.style.width = pct + '%';
    bar.classList.toggle('low', inverse ? pct > 60 : pct < 25);
  }
  if (valEl) valEl.textContent = Math.round(val);
}

// --- Zone info parsing ---
function parseZoneInfo(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const zoneName = tmp.querySelector('.zone-name')?.textContent;
  if (zoneName) document.getElementById('zone-name-display').textContent = zoneName;

  // Parse exits from text
  const text = tmp.textContent;
  const exitsMatch = text.match(/Exits:\s*([^\n]+)/);
  const exitsEl = document.getElementById('exits-display');
  exitsEl.innerHTML = '';
  if (exitsMatch) {
    const dirs = exitsMatch[1].split(',').map(s => s.trim()).filter(Boolean);
    for (const dir of dirs) {
      const btn = document.createElement('button');
      btn.className = 'exit-btn';
      btn.textContent = dir;
      btn.onclick = () => sendCmd(dir);
      exitsEl.appendChild(btn);
    }
  }
}

// --- Dialogue ---
function openDialogue(msg) {
  currentNpcId = msg.npcId;
  document.getElementById('dialogue-npc-name').textContent = msg.npcName;
  document.getElementById('dialogue-text').textContent = msg.text;
  const opts = document.getElementById('dialogue-options');
  opts.innerHTML = '';
  for (const opt of (msg.options || [])) {
    if (!opt.next) continue;
    const btn = document.createElement('button');
    btn.className = 'dialogue-opt';
    btn.textContent = opt.label;
    btn.onclick = () => {
      ws.send(JSON.stringify({ type: 'dialogue', npcId: currentNpcId, choice: opt.next }));
    };
    opts.appendChild(btn);
  }
  document.getElementById('dialogue-panel').classList.add('active');
}

function closeDialogue() {
  document.getElementById('dialogue-panel').classList.remove('active');
  currentNpcId = null;
}

// Close dialogue on backdrop click
document.getElementById('dialogue-panel').addEventListener('click', (e) => {
  if (e.target === document.getElementById('dialogue-panel')) closeDialogue();
});

function setConnStatus(state, text) {
  const el = document.getElementById('conn-status');
  el.className = `conn-status ${state}`;
  el.textContent = text;
}

// Boot
connect();
</script>
