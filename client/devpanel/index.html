<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHITECT // DEV PANEL</title>
<style>
  :root {
    --bg: #05050a;
    --bg2: #0d0d16;
    --bg3: #15151f;
    --border: #2a2a40;
    --text: #c4c4dc;
    --text-dim: #5c5c78;
    --text-bright: #e8e8f5;
    --accent: #ff2ec4;
    --accent2: #39ff8f;
    --accent3: #ff9a3c;
    --red: #ff3b5c;
    --yellow: #f5e642;
    --cyan: #28e5ff;
    --font: 'Lucida Console', 'Lucida Sans Typewriter', 'Monaco', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo { color: var(--accent); font-size: 14px; letter-spacing: 4px; }
  .logo span { color: var(--accent3); }
  .auth-status { font-size: 11px; color: var(--text-dim); }
  .auth-status.ok { color: var(--accent2); }
  #header-actions { margin-left: auto; display: flex; gap: 8px; }

  /* Layout */
  #layout { display: flex; flex: 1; overflow: hidden; }

  /* Nav */
  #nav {
    width: 160px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    padding: 8px 0;
  }
  .nav-section { padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); }
  .nav-item {
    padding: 7px 16px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    border-left: 2px solid transparent;
    transition: all 0.1s;
  }
  .nav-item:hover { color: var(--text); background: var(--bg3); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--bg3); }

  /* Main content area */
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #toolbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #toolbar h2 { font-size: 13px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 2px; flex: 1; }

  /* Panels */
  #panel-area { flex: 1; overflow: hidden; display: flex; }

  /* Table view */
  #list-panel { flex: 1; overflow-y: auto; padding: 0; }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--bg2);
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  th.sortable-col { cursor: pointer; user-select: none; transition: color 0.15s; }
  th.sortable-col:hover { color: var(--accent); }
  th.sortable-col.sorted { color: var(--accent); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--bg3); vertical-align: top; }
  tr:hover td { background: var(--bg2); }
  tr.selected td { background: rgba(123,104,238,0.1); }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    display: inline-block;
  }
  .badge-safe { background: rgba(76,175,116,0.2); color: var(--accent2); border: 1px solid rgba(76,175,116,0.3); }
  .badge-low { background: rgba(212,196,74,0.15); color: var(--yellow); border: 1px solid rgba(212,196,74,0.3); }
  .badge-medium { background: rgba(224,145,74,0.15); color: var(--accent3); border: 1px solid rgba(224,145,74,0.3); }
  .badge-high { background: rgba(224,85,85,0.15); color: var(--red); border: 1px solid rgba(224,85,85,0.3); }
  .badge-lethal { background: rgba(224,85,85,0.3); color: var(--red); border: 1px solid var(--red); }
  .badge-pvp { background: rgba(224,85,85,0.15); color: var(--red); font-size: 10px; padding: 1px 5px; }
  .badge-safe-zone { background: rgba(76,175,116,0.15); color: var(--accent2); font-size: 10px; padding: 1px 5px; }

  .action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.1s;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .action-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .action-btn.primary { border-color: var(--accent); color: var(--accent); }
  .action-btn.primary:hover { background: var(--accent); color: var(--bg); }
  .action-btn.success { border-color: var(--accent2); color: var(--accent2); }
  .action-btn.success:hover { background: var(--accent2); color: var(--bg); }

  /* Edit panel */
  #edit-panel {
    width: 380px;
    border-left: 1px solid var(--border);
    background: var(--bg2);
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  #edit-panel.open { display: flex; }

  .edit-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edit-header h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-bright); flex: 1; }
  .edit-body { padding: 16px; flex: 1; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: var(--font);
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    border-radius: 2px;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: var(--bg3); }

  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }

  .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .checkbox-field label { font-size: 11px; color: var(--text); margin: 0; }
  .checkbox-field input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }

  .edit-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .msg-toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--bg2);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    padding: 10px 16px;
    font-size: 12px;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  .msg-toast.error { border-color: var(--red); color: var(--red); }
  .msg-toast.visible { opacity: 1; }

  /* Auth overlay */
  #auth-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500;
    display: flex; align-items: center; justify-content: center;
  }
  #auth-overlay.hidden { display: none; }
  .auth-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 28px;
    width: 300px;
    border-radius: 2px;
  }
  .auth-card h2 { color: var(--accent); letter-spacing: 3px; margin-bottom: 4px; font-size: 15px; text-align: center; }
  .auth-card p { color: var(--text-dim); font-size: 11px; text-align: center; margin-bottom: 20px; }
  .auth-card .field input { background: var(--bg3); }
  .auth-card .submit { width: 100%; padding: 9px; background: var(--bg3); border: 1px solid var(--accent); color: var(--accent); font-family: var(--font); font-size: 12px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; border-radius: 2px; }
  .auth-card .submit:hover { background: var(--accent); color: var(--bg); }
  .auth-card .err { color: var(--red); font-size: 11px; text-align: center; margin-top: 6px; min-height: 14px; }

  /* World state sidebar */
  #world-state {
    width: 180px;
    border-left: 1px solid var(--border);
    background: var(--bg2);
    padding: 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .ws-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 6px; }
  .ws-item { font-size: 11px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ws-item span { color: var(--accent); }
  .ws-player { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .ws-player em { color: var(--cyan); font-style: normal; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>ARCHITECT</h2>
    <p>Dev Panel — Authorized Access Only</p>
    <div class="field"><label>Username</label><input type="text" id="dev-username" placeholder="username"></div>
    <div class="field"><label>Password</label><input type="password" id="dev-password" placeholder="password"></div>
    <button class="submit" onclick="devLogin()">Access Panel</button>
    <div class="err" id="dev-err"></div>
  </div>
</div>

<!-- HEADER -->
<div id="header">
  <span class="logo">ARCHITECT <span>// DEV</span></span>
  <span class="auth-status" id="auth-badge">NOT AUTHENTICATED</span>
  <div id="header-actions">
    <button class="action-btn" onclick="refreshWorld()">↻ Refresh</button>
    <button class="action-btn" id="ghost-btn" onclick="openGhostMode()" style="display:none">👻 Ghost Mode</button>
  </div>
</div>

<div id="layout">
  <!-- NAV -->
  <div id="nav">
    <div class="nav-section">World</div>
    <div class="nav-item active" onclick="showPanel('zones')">🗺 Zones</div>
    <div class="nav-item" onclick="showPanel('enemies')">👾 Enemies</div>
    <div class="nav-item" onclick="showPanel('items')">🗡 Items</div>
    <div class="nav-item" onclick="showPanel('npcs')">🧑 NPCs</div>
    <div class="nav-item" onclick="showPanel('recipes')">⚗ Recipes</div>
    <div class="nav-item" onclick="showPanel('mutations')">☢ Mutations</div>
    <div class="nav-item" onclick="showPanel('drugs')">💊 Drugs</div>
    <div class="nav-item" onclick="showPanel('apartments')">🏠 Apartments</div>
    <div class="nav-section">Server</div>
    <div class="nav-item" onclick="showPanel('worldstate')">📡 World State</div>
    <div class="nav-item" onclick="showPanel('players')">👥 Players</div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div id="toolbar">
      <h2 id="panel-title">Zones</h2>
      <input type="text" id="search-input" placeholder="Search..." style="background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 10px;outline:none;border-radius:2px;width:200px;" oninput="filterTable()">
      <button class="action-btn primary" id="new-btn" onclick="newRecord()">+ New</button>
    </div>

    <div id="panel-area">
      <div id="list-panel"></div>
      <div id="edit-panel">
        <div class="edit-header">
          <h3 id="edit-title">Edit</h3>
          <button class="action-btn" onclick="closeEdit()">✕</button>
        </div>
        <div class="edit-body" id="edit-body"></div>
        <div class="edit-footer">
          <button class="action-btn success" onclick="saveRecord()" style="flex:1">Save & Publish</button>
          <button class="action-btn danger" id="delete-btn" onclick="deleteRecord()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- WORLD STATE -->
  <div id="world-state">
    <div class="ws-label">Online</div>
    <div id="ws-players">—</div>
    <div class="ws-label" style="margin-top:12px">Server</div>
    <div class="ws-item">Enemies <span id="ws-enemies">—</span></div>
    <div class="ws-item">Corpses <span id="ws-corpses">—</span></div>
    <div class="ws-item">Zones <span id="ws-zones">—</span></div>
  </div>
</div>

<div class="msg-toast" id="toast"></div>

<script>
let token = null;
let currentPanel = 'zones';
let currentRecord = null;
let allRecords = [];
let devRole = null;

const API = async (path, method = 'GET', body = null) => {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }
  };
  if (body) opts.body = JSON.stringify(body);

  let res;
  try {
    res = await fetch(`/api${path}`, opts);
  } catch (err) {
    // Network failure — server unreachable, cold start, CORS, etc.
    return { error: `Network error: ${err.message}` };
  }

  let data;
  try {
    data = await res.json();
  } catch (err) {
    return { error: `Server returned an unreadable response (status ${res.status})` };
  }

  if (!res.ok) {
    // Surface the server's error message if present, otherwise the status
    if (res.status === 403) {
      return { error: data.error || 'Access denied — your session may have expired. Please log in again.' };
    }
    return { error: data.error || `Request failed (status ${res.status})` };
  }

  return data;
};

async function devLogin() {
  const username = document.getElementById('dev-username').value;
  const password = document.getElementById('dev-password').value;
  const data = await API('/auth/login', 'POST', { username, password });
  if (data.error) { document.getElementById('dev-err').textContent = data.error; return; }
  if (!['admin','dev','builder','designer'].includes(data.role)) {
    document.getElementById('dev-err').textContent = 'Insufficient permissions.'; return;
  }
  token = data.token;
  devRole = data.role;
  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('auth-badge').textContent = `${data.handle} [${data.role}]`;
  document.getElementById('auth-badge').className = 'auth-status ok';
  if (['admin','dev'].includes(data.role)) document.getElementById('ghost-btn').style.display = '';
  loadPanel('zones');
  startWorldStatePolling();
}

document.getElementById('dev-password').addEventListener('keydown', e => { if(e.key==='Enter') devLogin(); });

// Panel management
const PANELS = {
  zones: {
    title: 'Zones',
    fetch: () => API('/zones'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'danger_rating', label: 'Danger', render: v => `<span class="badge badge-${v}">${v}</span>` },
      { key: 'pvp_enabled', label: 'PvP', render: v => v ? '<span class="badge badge-pvp">PvP</span>' : '' },
      { key: 'is_safe_zone', label: 'Safe', render: v => v ? '<span class="badge badge-safe-zone">Safe</span>' : '' },
      { key: 'player_count', label: 'Players' },
      { key: 'exits', label: 'Exits', render: v => typeof v === 'object' ? Object.keys(v||{}).join(', ') : '' },
    ],
    editForm: zoneEditForm,
    save: saveZone,
    delete: id => API(`/zones/${id}`, 'DELETE'),
  },
  enemies: {
    title: 'Enemies',
    fetch: () => API('/enemies'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'hp_max', label: 'HP' },
      { key: 'damage_min', label: 'Dmg Min' },
      { key: 'damage_max', label: 'Dmg Max' },
      { key: 'armor', label: 'Armor' },
      { key: 'behavior', label: 'Behavior' },
      { key: 'xp_reward', label: 'XP' },
    ],
    editForm: enemyEditForm,
    save: saveEnemy,
    delete: id => API(`/enemies/${id}`, 'DELETE'),
  },
  items: {
    title: 'Items',
    fetch: () => API('/items'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'type', label: 'Type' },
      { key: 'subtype', label: 'Subtype' },
      { key: 'rarity', label: 'Rarity' },
      { key: 'weight', label: 'Weight' },
      { key: 'value', label: 'Value' },
    ],
    editForm: itemEditForm,
    save: saveItem,
    delete: id => API(`/items/${id}`, 'DELETE'),
  },
  npcs: {
    title: 'NPCs',
    fetch: () => API('/npcs'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'zone_id', label: 'Zone' },
      { key: 'faction', label: 'Faction' },
      { key: 'disposition', label: 'Disposition' },
    ],
    editForm: npcEditForm,
    save: saveNpc,
    delete: id => API(`/npcs/${id}`, 'DELETE'),
  },
  mutations: {
    title: 'Mutations',
    fetch: () => API('/mutations'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'polarity', label: 'Polarity', render: v => `<span class="badge badge-${v==='positive'?'safe-zone':v==='negative'?'lethal':'medium'}">${v}</span>` },
      { key: 'visible', label: 'Visible', render: v => v ? '👁' : '' },
      { key: 'rarity', label: 'Rarity' },
      { key: 'radiation_threshold', label: 'Rad. Threshold' },
    ],
    editForm: mutationEditForm,
    save: saveMutation,
    delete: id => API(`/mutations/${id}`, 'DELETE'),
  },
  drugs: {
    title: 'Drugs',
    fetch: () => API('/drugs'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'duration_seconds', label: 'Duration (s)' },
      { key: 'addiction_chance', label: 'Addiction %', render: v => `${Math.round((v||0)*100)}%` },
      { key: 'overdose_threshold', label: 'OD Threshold' },
    ],
    editForm: drugEditForm,
    save: saveDrug,
    delete: id => API(`/drugs/${id}`, 'DELETE'),
  },
  apartments: {
    title: 'Apartments',
    fetch: () => API('/apartments'),
    render: renderApartments,
  },
  recipes: {
    title: 'Recipes',
    fetch: () => API('/recipes'),
    columns: [
      { key: 'name', label: 'Name' },
      { key: 'category', label: 'Category' },
      { key: 'skill_id', label: 'Skill' },
      { key: 'base_difficulty', label: 'Difficulty' },
      { key: 'requires_station', label: 'Station' },
    ],
    editForm: recipeEditForm,
    save: saveRecipe,
    delete: id => API(`/recipes/${id}`, 'DELETE'),
  },
  worldstate: {
    title: 'World State',
    fetch: () => API('/world/state'),
    render: renderWorldState,
  },
  players: {
    title: 'Players',
    fetch: () => API('/players'),
    columns: [
      { key: 'handle', label: 'Handle' },
      { key: 'username', label: 'Username' },
      { key: 'role', label: 'Role' },
      { key: 'current_zone', label: 'Zone' },
      { key: 'credits', label: 'Credits' },
    ],
    noEdit: true,
  },
};

async function showPanel(name) {
  currentPanel = name;
  sortState = { key: null, dir: 1 };
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  closeEdit();
  loadPanel(name);
}

async function loadPanel(name) {
  const p = PANELS[name];
  if (!p) return;
  document.getElementById('panel-title').textContent = p.title;
  document.getElementById('new-btn').style.display = p.noEdit || name === 'worldstate' || name === 'players' ? 'none' : '';

  const data = await p.fetch();
  allRecords = Array.isArray(data) ? data : (data.zones || []);

  if (p.render) {
    p.render(data);
    return;
  }

  renderTable(p.columns, allRecords, p.noEdit);
}

let sortState = { key: null, dir: 1 };

function renderTable(columns, records, noEdit = false) {
  const panel = document.getElementById('list-panel');
  if (!records.length) { panel.innerHTML = '<div style="padding:24px;color:var(--text-dim)">No records found.</div>'; return; }

  let sorted = records;
  if (sortState.key) {
    sorted = [...records].sort((a, b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
      return String(av).localeCompare(String(bv)) * sortState.dir;
    });
  }

  let html = '<table><thead><tr>';
  for (const col of columns) {
    const isSorted = sortState.key === col.key;
    const arrow = isSorted ? (sortState.dir === 1 ? ' ▲' : ' ▼') : '';
    html += `<th class="sortable-col${isSorted?' sorted':''}" onclick="sortTableBy('${col.key}')">${col.label}${arrow}</th>`;
  }
  if (!noEdit) html += '<th></th>';
  html += '</tr></thead><tbody>';

  for (const rec of sorted) {
    html += `<tr onclick="selectRecord('${rec.id}')">`;
    for (const col of columns) {
      const raw = rec[col.key];
      const val = col.render ? col.render(raw) : (raw ?? '—');
      html += `<td>${val}</td>`;
    }
    if (!noEdit) html += `<td><button class="action-btn" onclick="event.stopPropagation();editRecord('${rec.id}')">Edit</button></td>`;
    html += '</tr>';
  }
  html += '</tbody></table>';
  panel.innerHTML = html;
}

function sortTableBy(key) {
  if (sortState.key === key) sortState.dir *= -1;
  else { sortState.key = key; sortState.dir = 1; }
  const p = PANELS[currentPanel];
  if (p?.columns) renderTable(p.columns, allRecords, p.noEdit);
}

function sortWorldStateBy(key) {
  if (sortState.key === key) sortState.dir *= -1;
  else { sortState.key = key; sortState.dir = 1; }
  if (window._wsData) renderWorldState(window._wsData);
}

function filterTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const p = PANELS[currentPanel];
  if (!p || !p.columns) return;
  const filtered = allRecords.filter(r =>
    Object.values(r).some(v => String(v).toLowerCase().includes(q))
  );
  renderTable(p.columns, filtered, p.noEdit);
}

function selectRecord(id) {
  currentRecord = allRecords.find(r => r.id === id);
}

function editRecord(id) {
  currentRecord = allRecords.find(r => r.id === id);
  openEdit(currentRecord, false);
}

function newRecord() {
  currentRecord = null;
  openEdit({}, true);
}

function openEdit(record, isNew) {
  const p = PANELS[currentPanel];
  if (!p?.editForm) return;
  document.getElementById('edit-panel').classList.add('open');
  document.getElementById('edit-title').textContent = isNew ? `New ${p.title.slice(0,-1)}` : `Edit: ${record.name || record.id}`;
  document.getElementById('delete-btn').style.display = isNew ? 'none' : '';
  document.getElementById('edit-body').innerHTML = p.editForm(record, isNew);
}

function closeEdit() {
  document.getElementById('edit-panel').classList.remove('open');
  currentRecord = null;
}

async function saveRecord() {
  const p = PANELS[currentPanel];
  if (!p?.save) return;
  const submitBtn = document.querySelector('.edit-footer .action-btn.success');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving...'; }
  try {
    const result = await p.save(currentRecord);
    if (result?.error) { toast(result.error, true); return; }
    toast('Saved & published ✓');
    await loadPanel(currentPanel);
    closeEdit();
  } catch (err) {
    toast(`Unexpected error: ${err.message}`, true);
    console.error('saveRecord failed:', err);
  } finally {
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Save & Publish'; }
  }
}

async function deleteRecord() {
  if (!currentRecord) return;
  if (!confirm(`Delete ${currentRecord.name || currentRecord.id}?`)) return;
  const p = PANELS[currentPanel];
  if (!p?.delete) return;
  try {
    const result = await p.delete(currentRecord.id);
    if (result?.error) { toast(result.error, true); return; }
    toast('Deleted');
    await loadPanel(currentPanel);
    closeEdit();
  } catch (err) {
    toast(`Unexpected error: ${err.message}`, true);
    console.error('deleteRecord failed:', err);
  }
}

  return API(`/npcs/${existing.id}`, 'PUT', body);
}

// --- World state ---
function renderWorldState(data) {
  const panel = document.getElementById('list-panel');
  window._wsData = data; // cache full payload for re-sort without refetch
  let zones = data.zones || [];

  if (sortState.key) {
    zones = [...zones].sort((a, b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (av == null) av = ''; if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
      return String(av).localeCompare(String(bv)) * sortState.dir;
    });
  }

  const cols = [
    {key:'name',label:'Zone'},{key:'danger_rating',label:'Danger'},
    {key:'player_count',label:'Players'},{key:'enemy_count',label:'Enemies'},{key:'is_safe_zone',label:'Safe'},
  ];
  let html = '<table><thead><tr>';
  for (const c of cols) {
    const isSorted = sortState.key === c.key;
    const arrow = isSorted ? (sortState.dir === 1 ? ' ▲' : ' ▼') : '';
    html += `<th class="sortable-col${isSorted?' sorted':''}" onclick="sortWorldStateBy('${c.key}')">${c.label}${arrow}</th>`;
  }
  html += '<th></th></tr></thead><tbody>';
  for (const z of zones) {
    html += `<tr>
      <td>${z.name}</td>
      <td><span class="badge badge-${z.danger_rating}">${z.danger_rating}</span></td>
      <td>${z.player_count}</td>
      <td>${z.enemy_count}</td>
      <td>${z.is_safe_zone ? '✓' : ''}</td>
      <td><button class="action-btn" onclick="reloadZone('${z.id}')">↻ Reload</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  panel.innerHTML = html;

  // Update sidebar
  const players = data.online_players || [];
  document.getElementById('ws-players').innerHTML = players.length
    ? players.map(p => `<div class="ws-player"><em>${p.handle}</em> — ${p.current_zone}</div>`).join('')
    : '<div class="ws-player" style="color:var(--text-dim)">None online</div>';
  document.getElementById('ws-enemies').textContent = data.live_enemies || 0;
  document.getElementById('ws-corpses').textContent = data.live_corpses || 0;
  document.getElementById('ws-zones').textContent = zones.length;
}

function renderApartments(rows) {
  const panel = document.getElementById('list-panel');
  let html = `<div style="padding:12px"><button class="action-btn success" onclick="openBuildApartmentModal()">+ Build Apartment Building</button></div>`;
  html += '<table><thead><tr><th>Unit</th><th>Zone ID</th><th>Owner</th><th>Locked</th><th>Lock Diff.</th><th>Rent</th><th></th></tr></thead><tbody>';
  for (const a of rows) {
    html += `<tr>
      <td>${a.zone_name || a.zone_id}</td>
      <td style="font-size:11px;color:var(--text-dim)">${a.zone_id}</td>
      <td>${a.owner_handle || '<span style="color:var(--text-dim)">unowned</span>'}</td>
      <td>${a.is_locked ? '🔒' : '🔓'}</td>
      <td>${a.lock_difficulty}</td>
      <td>${a.rent_cost}c</td>
      <td><button class="action-btn danger" onclick="deleteApartmentUnit('${a.zone_id}')">Delete</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  if (!rows.length) html += '<div style="padding:16px;color:var(--text-dim)">No apartment units yet. Build a block to get started.</div>';
  panel.innerHTML = html;
}

async function deleteApartmentUnit(zoneId) {
  if (!confirm(`Delete apartment unit ${zoneId}? This also deletes its zone.`)) return;
  const result = await API(`/apartments/${zoneId}`, 'DELETE');
  if (result?.error) { toast(result.error, true); return; }
  toast('Unit deleted');
  loadPanel('apartments');
}

async function openBuildApartmentModal() {
  const zones = await API('/zones');
  const zoneOptions = (zones || []).map(z => `<option value="${z.id}">${z.name} (${z.id})</option>`).join('');
  document.getElementById('edit-panel').classList.add('open');
  document.getElementById('edit-title').textContent = 'Build Apartment Building';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('edit-body').innerHTML = `
    <div class="field"><label>Attach To Zone</label>
      <select id="bb-attach_to_zone_id">${zoneOptions}</select>
    </div>
    <div class="field"><label>Direction From That Zone</label>
      <select id="bb-attach_direction">
        ${['down','up','north','south','east','west'].map(d=>`<option value="${d}">${d}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Building Name</label><input id="bb-building_name" value="Residential Block" placeholder="e.g. Coldwater Residences"></div>
    <div class="field"><label>Lobby Description</label><textarea id="bb-lobby_description" rows="3" placeholder="Leave blank for a generic description"></textarea></div>
    <div class="field-row">
      <div class="field"><label>Number of Units (1-6)</label><input type="number" id="bb-unit_count" value="4" min="1" max="6"></div>
      <div class="field"><label>Rent Cost (credits)</label><input type="number" id="bb-rent_cost" value="100" min="0"></div>
    </div>
    <div class="field"><label>Unit Name Prefix</label><input id="bb-unit_name_prefix" value="Unit" placeholder="e.g. Unit, Room, Suite"></div>
    <p style="font-size:11px;color:var(--text-dim);margin-top:4px">Generates a lobby attached to the chosen zone, plus one unit per remaining compass direction (max 6). Each unit is created unowned and ready to RENT — exits are wired automatically and symmetrically.</p>
  `;
  // Swap the save button's behavior just for this modal
  const saveBtn = document.querySelector('.edit-footer .action-btn.success');
  if (saveBtn) saveBtn.setAttribute('onclick', 'submitBuildApartment()');
}

async function submitBuildApartment() {
  const body = {
    attach_to_zone_id: document.getElementById('bb-attach_to_zone_id').value,
    attach_direction: document.getElementById('bb-attach_direction').value,
    building_name: document.getElementById('bb-building_name').value || 'Residential Block',
    lobby_description: document.getElementById('bb-lobby_description').value || null,
    unit_count: +document.getElementById('bb-unit_count').value || 4,
    rent_cost: +document.getElementById('bb-rent_cost').value || 100,
    unit_name_prefix: document.getElementById('bb-unit_name_prefix').value || 'Unit',
  };
  const result = await API('/apartments/build', 'POST', body);
  if (result?.error) { toast(result.error, true); return; }
  toast(result.message || 'Building created');
  closeEdit();
  // Restore the normal save button behavior for other panels
  const saveBtn = document.querySelector('.edit-footer .action-btn.success');
  if (saveBtn) saveBtn.setAttribute('onclick', 'saveRecord()');
  loadPanel('apartments');
}

async function reloadZone(id) {
  await API('/world/reload', 'POST', { zone_id: id });
  toast(`Zone ${id} reloaded ✓`);
}

async function refreshWorld() { loadPanel(currentPanel); }

function startWorldStatePolling() {
  setInterval(async () => {
    const data = await API('/world/state');
    const players = data.online_players || [];
    document.getElementById('ws-players').innerHTML = players.length
      ? players.map(p => `<div class="ws-player"><em>${p.handle}</em></div>`).join('')
      : '<div class="ws-player" style="color:var(--text-dim)">None</div>';
    document.getElementById('ws-enemies').textContent = data.live_enemies || 0;
    document.getElementById('ws-corpses').textContent = data.live_corpses || 0;
  }, 10000);
}

function openGhostMode() {
  const zone = prompt('Enter zone ID to observe:');
  if (!zone) return;
  toast(`Ghost mode: observing ${zone}`);
}

// Toast
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `msg-toast${isError ? ' error' : ''} visible`;
  setTimeout(() => el.classList.remove('visible'), 2500);
}
</script>
